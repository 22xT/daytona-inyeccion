<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuenta de proveedores - Daytona Repuestos Automotor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="precio.js"></script>
  <style>
    .kpis { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-bottom:14px; }
    .kpi { background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 16px; }
    .kpi .l { font-size:0.72rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }
    .kpi .v { font-size:1.4rem; font-weight:800; color:var(--navy); }
    .kpi.rojo .v { color:#B42318; } .kpi.amarillo .v { color:#92400E; }
    .layout { display:grid; grid-template-columns: 330px 1fr; gap:16px; align-items:start; }
    @media (max-width: 991px) { .layout, .kpis { grid-template-columns: 1fr; } }
    .prov { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid #f0f1f3; cursor:pointer; }
    .prov:hover { background:#fafbfd; }
    .prov.activo { background:var(--nav-accent-soft); border-left:3px solid var(--nav-accent); }
    .prov .nom { font-weight:600; color:var(--navy); font-size:0.9rem; }
    .prov .sub, .sub { font-size:0.74rem; color:var(--text-muted); }
    .prov .saldo { font-weight:800; font-size:0.92rem; text-align:right; white-space:nowrap; }
    .debe { color:#b02a37; } .favor { color:#146c43; } .cero { color:var(--text-muted); }
    .chip { font-size:0.68rem; font-weight:700; border-radius:7px; padding:1px 7px; display:inline-block; margin-top:2px; }
    .ch-venc { background:#FEE2E2; color:#991B1B; } .ch-semana { background:#FEF3C7; color:#92400E; } .ch-rec { background:#F3E8FF; color:#6B21A8; }

    .cab-prov { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
    .cab-prov .saldo-grande { font-size:1.6rem; font-weight:800; }
    .plazo { font-size:0.8rem; color:var(--text-muted); }
    .plazo a { font-weight:600; }
    .tabs-p { display:flex; gap:4px; border-bottom:1px solid var(--border); padding:0 16px; }
    .tab-p { border:none; background:none; padding:10px 14px; font-weight:700; font-size:0.85rem; color:var(--text-muted); border-bottom:2px solid transparent; }
    .tab-p.activo { color:var(--navy); border-bottom-color:var(--navy); }
    .tab-p .cnt { font-size:0.7rem; background:var(--bg); border-radius:8px; padding:1px 6px; margin-left:4px; }
    .tabla td { font-size:0.85rem; vertical-align:middle; }
    .tabla th { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); }
    .venc { font-size:0.72rem; font-weight:700; border-radius:7px; padding:2px 8px; white-space:nowrap; }
    .v-vencida { background:#FEE2E2; color:#991B1B; } .v-pronto { background:#FEF3C7; color:#92400E; } .v-ok { background:#F3F4F6; color:#374151; }
    .tipo-inc { font-size:0.7rem; font-weight:700; border-radius:7px; padding:2px 8px; white-space:nowrap; }
    .ti-FACTURADO_NO_RECIBIDO { background:#FEE2E2; color:#991B1B; } .ti-DANADO { background:#FEF3C7; color:#92400E; }
    .ti-RECIBIDO_NO_FACTURADO { background:#E0EAFF; color:#1E40AF; } .ti-NO_PEDIDO { background:#F3E8FF; color:#6B21A8; }
    .est-inc { font-size:0.7rem; font-weight:700; }
    .barra-acc { display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--border); background:#fcfcfd; align-items:center; }
    .tipo { font-size:0.7rem; font-weight:700; border-radius:7px; padding:2px 8px; }
    .t-COMPRA, .t-ND { background:#fdecee; color:#b02a37; } .t-PAGO, .t-NC { background:#e3f4e9; color:#146c43; }
    .t-AJUSTE { background:#fff4d6; color:#8a6300; } .t-ANULACION { background:var(--bg); color:var(--text-muted); }
    .vacio { padding:36px; text-align:center; color:var(--text-muted); }
    /* Orden de pago y datos fiscales (script 95) */
    .op-tabla { width:100%; font-size:0.84rem; border-collapse:collapse; }
    .op-tabla th { font-size:0.68rem; text-transform:uppercase; color:#6c757d; padding:5px 6px; border-bottom:1px solid #e3e7ec; text-align:left; }
    .op-tabla td { padding:5px 6px; border-bottom:1px solid #f0f1f3; vertical-align:middle; }
    .op-tabla input.imp { width:120px; text-align:right; }
    .op-tot { display:flex; justify-content:flex-end; gap:18px; font-size:0.9rem; margin:8px 0; flex-wrap:wrap; }
    .op-tot b { font-variant-numeric:tabular-nums; }
    .op-sec { font-weight:800; color:var(--navy); font-size:0.85rem; margin:12px 0 4px; text-align:left; }
    .op-ok { color:#146c43; font-weight:700; } .op-mal { color:#b02a37; font-weight:700; }
    .fis { font-size:0.68rem; font-weight:700; border-radius:7px; padding:1px 7px; white-space:nowrap; }
    .fis-ok { background:#e3f4e9; color:#146c43; } .fis-no { background:#F3F4F6; color:#6b7280; }
    .fg { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px 12px; text-align:left; }
    .fg label { font-size:0.74rem; font-weight:700; color:#5a6270; margin-bottom:2px; display:block; }
    @media (max-width: 640px) { .fg { grid-template-columns:1fr 1fr; } }
    .t-OP { background:#e0eaff; color:#1e40af; }
  </style>
</head>

<body data-page="cuenta-proveedores">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="header-bar">
      <div>
        <h2><i class="bi bi-journal-text"></i> Cuenta de proveedores</h2>
        <span class="subtitle">Facturas a pagar, reclamos abiertos y movimientos de cada proveedor.</span>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="l">Deuda total</div><div class="v" id="kDeuda">—</div></div>
      <div class="kpi rojo"><div class="l">Vencido</div><div class="v" id="kVencido">—</div></div>
      <div class="kpi amarillo"><div class="l">Vence esta semana</div><div class="v" id="kSemana">—</div></div>
    </div>

    <div class="layout">
      <div class="panel mb-0">
        <div class="panel-header"><i class="bi bi-truck"></i> Proveedores</div>
        <div id="listaProv"><div class="vacio">Cargando…</div></div>
      </div>
      <div class="panel mb-0" id="panelDetalle"><div class="vacio"><i class="bi bi-arrow-left"></i> Elegí un proveedor</div></div>
    </div>
  </div>

  <script src="layout.js"></script>
  <script>
    if (!Auth.requireSession()) { /* redirect */ }

    const API = API_BASE + "Compras/";
    const usuario = Auth.getUsuario() || {};
    const esPlata = ["Dueño", "Administrador"].indexOf(usuario.Rol) !== -1;
    const puedeReclamar = ["Dueño", "Administrador", "Supervisor", "Vendedor"].indexOf(usuario.Rol) !== -1;
    const puedeResolver = ["Dueño", "Administrador", "Supervisor"].indexOf(usuario.Rol) !== -1;
    let proveedores = [], cuentas = [], actual = null, tab = "facturas";
    let facturas = [], incidencias = [], movimientos = [], ordenes = [], fiscales = {};

    function escapeHtml(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }
    function leerError(r) {
      return r.text().then(t => { try { const d = JSON.parse(t); return d.Message || d.message || t; } catch { return t; } })
                     .catch(() => "No se pudo completar la operación.");
    }
    const fmtFecha = f => f ? new Date(f).toLocaleDateString("es-AR") : "—";
    const fechaLocal = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    const claseSaldo = s => s > 0.005 ? "debe" : (s < -0.005 ? "favor" : "cero");
    const textoSaldo = s => s > 0.005 ? formatearMoneda(s) : (s < -0.005 ? formatearMoneda(-s) + " a favor" : "Al día");
    const TIPO_INC = { FACTURADO_NO_RECIBIDO: "Facturado, no llegó", DANADO: "En mal estado",
                       RECIBIDO_NO_FACTURADO: "Llegó sin facturar", NO_PEDIDO: "No estaba pedido" };
    const prov = () => proveedores.find(x => x.Id === actual);

    /* ================= LISTA ================= */

    function cargarSaldos(seleccionar) {
      fetchAuth(API + "CuentasProveedor").then(r => r.ok ? r.json() : Promise.reject()).then(d => {
        proveedores = d || [];
        const sum = k => proveedores.reduce((a, p) => a + Math.max(0, Number(p[k] || 0)), 0);
        document.getElementById("kDeuda").textContent = formatearMoneda(sum("Saldo"));
        document.getElementById("kVencido").textContent = formatearMoneda(sum("Vencido"));
        document.getElementById("kSemana").textContent = formatearMoneda(sum("VenceEstaSemana"));
        document.getElementById("listaProv").innerHTML = proveedores.length ? proveedores.map(p =>
          '<div class="prov' + (actual === p.Id ? ' activo' : '') + '" onclick="elegir(' + p.Id + ')">' +
            '<div><div class="nom">' + escapeHtml(p.RazonSocial) + '</div>' +
              '<div>' + (Number(p.Vencido) > 0 ? '<span class="chip ch-venc">Vencido ' + formatearMoneda(p.Vencido) + '</span> ' : '') +
                (Number(p.VenceEstaSemana) > 0 ? '<span class="chip ch-semana">Vence esta semana</span> ' : '') +
                (p.Incidencias ? '<span class="chip ch-rec">' + p.Incidencias + ' reclamo(s)</span>' : '') + '</div></div>' +
            '<div class="saldo ' + claseSaldo(Number(p.Saldo)) + '">' + textoSaldo(Number(p.Saldo)) + '</div>' +
          '</div>').join("") : '<div class="vacio">No hay proveedores activos.</div>';
        if (seleccionar) elegir(seleccionar);
      }).catch(() => document.getElementById("listaProv").innerHTML = '<div class="vacio">No se pudieron cargar.</div>');
    }

    function elegir(id) {
      actual = id;
      document.querySelectorAll(".prov").forEach((x, i) => x.classList.toggle("activo", proveedores[i] && proveedores[i].Id === id));
      Promise.all([
        fetchAuth(API + "Facturas?idProveedor=" + id).then(r => r.ok ? r.json() : []),
        fetchAuth(API + "Incidencias?idProveedor=" + id).then(r => r.ok ? r.json() : []),
        fetchAuth(API + "CuentasProveedor/" + id).then(r => r.ok ? r.json() : []),
        fetchAuth(API + "OrdenesPago?idProveedor=" + id).then(r => r.ok ? r.json() : []).catch(() => []),
        fetchAuth(API + "DatosFiscales?idProveedor=" + id).then(r => r.ok ? r.json() : []).catch(() => [])
      ]).then(([f, i, m, o, df]) => {
        facturas = f || []; incidencias = i || []; movimientos = m || []; ordenes = o || [];
        fiscales = {}; (df || []).forEach(x => fiscales[x.IdMovimiento] = x);
        pintarDetalle();
      });
    }

    /* ================= DETALLE ================= */

    function pintarDetalle() {
      const p = prov(); if (!p) return;
      const saldo = Number(p.Saldo);
      let html =
        '<div class="panel-body"><div class="cab-prov">' +
          '<div><div style="font-size:0.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;">' + escapeHtml(p.RazonSocial) + '</div>' +
            '<div class="saldo-grande ' + claseSaldo(saldo) + '">' + textoSaldo(saldo) + '</div>' +
            '<div class="plazo">Paga a ' + p.DiasPago + ' días de la factura' + (esPlata ? ' · <a href="#" onclick="cambiarPlazo();return false;">cambiar</a>' : '') +
              (Number(p.ImporteAReclamar) > 0 ? ' · ' + formatearMoneda(p.ImporteAReclamar) + ' a acreditar por reclamos' : '') + '</div></div>' +
          '<div class="d-flex gap-2 flex-wrap">' +
            (esPlata ? '<button class="btn btn-success" onclick="ordenPago()"><i class="bi bi-cash-coin"></i> Orden de pago</button>' +
                       '<button class="btn btn-outline-primary" onclick="notaCredito()"><i class="bi bi-receipt-cutoff"></i> Nota de crédito</button>' +
                       '<button class="btn btn-outline-secondary" onclick="saldoInicial()" title="Cargar lo que ya se debía, desde el resumen del proveedor">Saldo inicial</button>' +
                       '<button class="btn btn-outline-secondary" onclick="ajuste()" title="Corrección puntual">Ajuste</button>' : '') +
          '</div></div></div>' +
        '<div class="tabs-p">' +
          tabBtn("facturas", "Facturas a pagar", facturas.length) +
          tabBtn("reclamos", "Reclamos", incidencias.length) +
          tabBtn("ordenes", "Órdenes de pago", ordenes.filter(o => o.Estado === "VIGENTE").length) +
          tabBtn("movimientos", "Movimientos", movimientos.length) +
        '</div><div id="tabCuerpo"></div>';
      document.getElementById("panelDetalle").innerHTML = html;
      pintarTab();
    }

    function tabBtn(k, t, n) {
      return '<button class="tab-p' + (tab === k ? ' activo' : '') + '" onclick="tab=\'' + k + '\';pintarDetalle()">' + t + '<span class="cnt">' + n + '</span></button>';
    }

    function pintarTab() {
      pintarTabContenido();
      activarTooltips();
    }

    function pintarTabContenido() {
      const c = document.getElementById("tabCuerpo");
      if (tab === "facturas") {
        if (!facturas.length) { c.innerHTML = '<div class="vacio">No hay facturas impagas.</div>'; return; }
        c.innerHTML = '<div class="table-responsive"><table class="table tabla mb-0"><thead><tr><th>Comprobante</th><th>Fecha</th><th class="text-center">Días</th><th>Vence</th><th class="text-end">Importe</th><th class="text-end">Abonado</th><th class="text-end">Falta pagar</th><th></th></tr></thead><tbody>' +
          facturas.map(f => {
            const d = f.DiasParaVencer;
            const v = d < 0 ? '<span class="venc v-vencida">Vencida hace ' + (-d) + ' día(s)</span>'
                    : d <= 7 ? '<span class="venc v-pronto">' + (d === 0 ? 'Vence hoy' : 'En ' + d + ' día(s)') + '</span>'
                    : '<span class="venc v-ok">En ' + d + ' días</span>';
            return '<tr><td>' + escapeHtml(f.Documento) + (f.IdPedido ? '<div class="sub">Pedido #' + String(f.IdPedido).padStart(4, "0") + '</div>' : '') + '</td>' +
              '<td>' + fmtFecha(f.FechaDoc) + '</td>' +
              '<td class="text-center">' + Math.max(0, prov().DiasPago - d) + '</td>' +
              '<td>' + fmtFecha(f.Vencimiento) + '<div>' + v + '</div></td>' +
              '<td class="text-end">' + formatearMoneda(f.Importe) + '</td>' +
              '<td class="text-end" style="color:#146c43;">' + (Number(f.Importe) - Number(f.Pendiente) > 0.005 ? formatearMoneda(Number(f.Importe) - Number(f.Pendiente)) : '') + '</td>' +
              '<td class="text-end"><strong>' + formatearMoneda(f.Pendiente) + '</strong></td>' +
              '<td class="text-end" style="white-space:nowrap;">' + botonFiscal(f.IdMovimiento) + ' ' + accionesFoto(f.IdRecepcion, f.IdAdjunto, () => elegir(actual)) + '</td></tr>';
          }).join("") + '</tbody></table></div>' +
          '<div class="sub p-3"><i class="bi bi-info-circle"></i> La orden de pago cancela las facturas que elegís; los pagos sueltos de antes cancelan las más viejas. Los reclamos no se descuentan: la nota de crédito se toma cuando llega.</div>';
        return;
      }
      if (tab === "reclamos") {
        if (!incidencias.length) { c.innerHTML = '<div class="vacio">No hay reclamos abiertos con este proveedor.</div>'; return; }
        const hayAbiertas = incidencias.some(i => i.Estado === "ABIERTA");
        c.innerHTML =
          '<div class="barra-acc">' +
            (puedeReclamar && hayAbiertas ? '<button class="btn btn-sm btn-primary" onclick="entregarViajante()"><i class="bi bi-person-badge"></i> Entregar al viajante</button>' : '') +
            (esPlata ? '<button class="btn btn-sm btn-outline-primary" onclick="notaCredito()"><i class="bi bi-receipt-cutoff"></i> Llegó la nota de crédito</button>' : '') +
            '<span class="sub ms-auto">Marcá los reclamos y elegí qué pasó</span></div>' +
          '<div class="table-responsive"><table class="table tabla mb-0"><thead><tr><th style="width:30px;"><input type="checkbox" id="chkTodos"></th><th>Qué pasó</th><th>Repuesto</th><th class="text-center">Cant.</th><th class="text-end">Importe</th><th>Estado</th><th></th></tr></thead><tbody>' +
          incidencias.map(i =>
            '<tr><td><input type="checkbox" class="chk-inc" value="' + i.Id + '"></td>' +
              '<td><span class="tipo-inc ti-' + i.Tipo + '">' + TIPO_INC[i.Tipo] + '</span><div class="sub">' + escapeHtml(i.Comprobante) + ' · ' + fmtFecha(i.Fecha) + '</div></td>' +
              '<td>' + (i.Codigo ? '<strong>' + escapeHtml(i.Codigo) + '</strong> ' : '') + escapeHtml(i.Descripcion) + '</td>' +
              '<td class="text-center">' + i.Cantidad + '</td>' +
              '<td class="text-end">' + formatearMoneda(i.Importe) + '</td>' +
              '<td><span class="est-inc" style="color:' + (i.Estado === "EN_RECLAMO" ? '#6B21A8' : '#92400E') + ';">' +
                (i.Estado === "EN_RECLAMO" ? 'En reclamo<div class="sub">Recibo ' + escapeHtml(i.NumeroConstancia) + ' · ' + fmtFecha(i.FechaReclamo) + '</div>'
                                           : (i.Tipo === "DANADO" ? 'Apartado en el local' : 'Abierto')) + '</span></td>' +
              '<td class="text-end">' + (puedeResolver ? '<div class="dropdown"><button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">Resolver</button><ul class="dropdown-menu dropdown-menu-end">' + opcionesResolver(i) + '</ul></div>' : '') + '</td></tr>'
          ).join("") + '</tbody></table></div>';
        const t = document.getElementById("chkTodos");
        if (t) t.addEventListener("change", () => document.querySelectorAll(".chk-inc").forEach(x => x.checked = t.checked));
        return;
      }
      if (tab === "ordenes") {
        if (!ordenes.length) { c.innerHTML = '<div class="vacio">Todavía no hay órdenes de pago a este proveedor.</div>'; return; }
        c.innerHTML = '<div class="table-responsive"><table class="table tabla mb-0"><thead><tr><th>N°</th><th>Fecha</th><th class="text-center">Facturas</th><th class="text-end">Facturas</th><th class="text-end">Notas de crédito</th><th class="text-end">Pagado</th><th>Estado</th><th></th></tr></thead><tbody>' +
          ordenes.map(o => '<tr' + (o.Estado === "ANULADA" ? ' style="color:#9aa6b4;"' : '') + '><td><strong>' + String(o.Id).padStart(6, "0") + '</strong></td>' +
            '<td>' + fmtFecha(o.Fecha) + '<div class="sub">' + escapeHtml(o.Usuario || "") + '</div></td>' +
            '<td class="text-center">' + o.Facturas + '</td>' +
            '<td class="text-end">' + formatearMoneda(o.TotalImputado) + '</td>' +
            '<td class="text-end">' + (Number(o.TotalNotasCredito) > 0 ? '−' + formatearMoneda(o.TotalNotasCredito) : '') + '</td>' +
            '<td class="text-end"><strong>' + formatearMoneda(o.TotalPagado) + '</strong></td>' +
            '<td>' + (o.Estado === "ANULADA" ? '<span class="tipo t-ANULACION">Anulada</span>' : '<span class="tipo t-PAGO">Vigente</span>') + '</td>' +
            '<td class="text-end" style="white-space:nowrap;"><button class="btn btn-sm btn-outline-secondary" onclick="verOrden(' + o.Id + ')"><i class="bi bi-printer"></i> Ver</button>' +
              (esPlata && o.Estado === "VIGENTE" ? ' <button class="btn btn-sm btn-outline-danger" onclick="anularOrden(' + o.Id + ')">Anular</button>' : '') + '</td></tr>'
          ).join("") + '</tbody></table></div>';
        return;
      }
      // Movimientos
      if (!movimientos.length) { c.innerHTML = '<div class="vacio">Sin movimientos.</div>'; return; }
      c.innerHTML = '<div class="table-responsive"><table class="table tabla mb-0"><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th class="text-end">Debe</th><th class="text-end">Haber</th><th class="text-end">Saldo</th><th></th></tr></thead><tbody>' +
        movimientos.map(m => {
          const monto = Number(m.Monto);
          return '<tr><td>' + fmtFecha(m.Fecha) + '</td><td><span class="tipo t-' + m.Tipo + '">' + m.Tipo + '</span></td>' +
            '<td>' + escapeHtml(m.Descripcion) + '<div class="sub">' + escapeHtml(m.Usuario || "") + '</div></td>' +
            '<td class="text-end">' + (monto > 0 ? formatearMoneda(monto) : '') + '</td>' +
            '<td class="text-end">' + (monto < 0 ? formatearMoneda(-monto) : '') + '</td>' +
            '<td class="text-end"><strong>' + formatearMoneda(m.SaldoAcumulado) + '</strong></td>' +
            '<td class="text-end" style="white-space:nowrap;">' +
              (m.Tipo === "COMPRA" || m.Tipo === "ND" || m.Tipo === "NC" ? botonFiscal(m.Id) + ' ' : '') +
              (m.Tipo === "COMPRA" ? accionesFoto(m.IdRecepcion, m.IdAdjunto, () => elegir(actual)) : '') +
              (esPlata && m.Tipo === "PAGO" && m.IdPagoProveedor ? '<button class="btn btn-sm btn-outline-danger" onclick="anularPago(' + m.IdPagoProveedor + ')">Anular</button>' : '') +
            '</td></tr>';
        }).join("") + '</tbody></table></div>';
    }

    function opcionesResolver(i) {
      const op = (accion, txt) => '<li><a class="dropdown-item" href="#" onclick="resolver(' + i.Id + ',\'' + accion + '\');return false;">' + txt + '</a></li>';
      let h = "";
      if (i.Tipo === "FACTURADO_NO_RECIBIDO") h += op("LLEGO_DESPUES", "Llegó en otra entrega");
      if (i.Tipo === "DANADO") h += op("LLEGO_DESPUES", "Llegó el reemplazo");
      if (i.Tipo === "RECIBIDO_NO_FACTURADO" || i.Tipo === "NO_PEDIDO") {
        if (esPlata) h += op("FACTURADO", "Llegó la factura");
        h += op("DEVUELTO", "Se devolvió");
      }
      if (i.Tipo === "NO_PEDIDO") h += op("ACEPTADO", "Nos lo quedamos");
      h += '<li><hr class="dropdown-divider"></li>' + op("RECHAZADO", "El proveedor lo rechazó");
      return h;
    }

    function marcadas() { return Array.from(document.querySelectorAll(".chk-inc:checked")).map(x => parseInt(x.value, 10)); }

    /* ================= ACCIONES ================= */

    function entregarViajante() {
      let ids = marcadas().filter(id => (incidencias.find(i => i.Id === id) || {}).Estado === "ABIERTA");

      const lista = incidencias.filter(i => ids.includes(i.Id));
      Swal.fire({
        title: "Entregar al viajante",
        html: '<div class="text-start" style="font-size:0.88rem;">' + lista.map(i => '• ' + i.Cantidad + ' × ' + escapeHtml(i.Descripcion) + ' <small class="text-muted">(' + TIPO_INC[i.Tipo] + ')</small>').join("<br>") +
              '<div class="mt-3">Número del recibo que deja el viajante:</div></div>',
        input: "text", inputPlaceholder: "N° de recibo", showCancelButton: true,
        confirmButtonText: "Registrar entrega", cancelButtonText: "Cancelar",
        inputValidator: v => (!v || !v.trim()) ? "Cargá el número del recibo." : null
      }).then(r => {
        if (!r.isConfirmed) return;
        fetchAuth(API + "Incidencias/Reclamar", { method: "POST", body: JSON.stringify({ Ids: ids, NumeroConstancia: r.value.trim() }) })
          .then(x => x.ok ? (Swal.fire({ icon: "success", title: "Reclamo iniciado", text: "Queda en reclamo hasta que llegue la nota de crédito.", timer: 2200, showConfirmButton: false }), cargarSaldos(actual))
                          : leerError(x).then(m => Swal.fire("No se pudo", m, "error")));
      });
    }

        title: "Nota de crédito de " + prov().RazonSocial, width: 620,
        html: '<div class="text-start">' +
          '<div class="row g-2"><div class="col-6"><label class="form-label mb-1">Número</label><input id="ncNum" class="form-control"></div>' +
          '<div class="col-6"><label class="form-label mb-1">Fecha</label><input type="date" id="ncFecha" class="form-control" value="' + fechaLocal(new Date()) + '"></div>' +
          '<div class="col-12"><label class="form-label mb-1">Importe</label><div class="input-group"><span class="input-group-text">$</span><input id="ncImp" inputmode="decimal" class="form-control text-end"></div></div></div>' +

            '<div class="form-check"><input class="form-check-input nc-inc" type="checkbox" value="' + i.Id + '" id="nc' + i.Id + '"' + (preMarcadas.includes(i.Id) ? ' checked' : '') + '>' +
            '<label class="form-check-label" for="nc' + i.Id + '">' + i.Cantidad + ' × ' + escapeHtml(i.Descripcion) + ' · ' + formatearMoneda(i.Importe) + '</label></div>').join("") + '</div>' : '') +
          '<div class="sub mt-2">Se registra el importe que dice la nota, aunque no coincida con lo reclamado.</div></div>',
        showCancelButton: true, confirmButtonText: "Registrar", cancelButtonText: "Cancelar",
        didOpen: () => {
          activarInputPrecio("ncImp");
          const sumar = () => { const t = Array.from(document.querySelectorAll(".nc-inc:checked")).reduce((a, x) => a + Number((incidencias.find(i => i.Id == x.value) || {}).Importe || 0), 0); if (t) document.getElementById("ncImp").value = numeroAPrecio(t); };
          document.querySelectorAll(".nc-inc").forEach(x => x.addEventListener("change", sumar)); sumar();

                   Incidencias: Array.from(document.querySelectorAll(".nc-inc:checked")).map(x => parseInt(x.value, 10)) };
        }
      }).then(r => {
        if (!r.isConfirmed) return;
        fetchAuth(API + "NotasCredito", { method: "POST", body: JSON.stringify(r.value) })
          .then(x => x.ok ? (Swal.fire({ icon: "success", title: "Nota de crédito registrada", timer: 1500, showConfirmButton: false }), cargarSaldos(actual))
                          : leerError(x).then(m => Swal.fire("No se pudo", m, "error")));
      });
    }

    function resolver(id, accion) {
      const i = incidencias.find(x => x.Id === id);
      const textos = {
        LLEGO_DESPUES: ["¿Llegó?", i.Cantidad + " × " + i.Descripcion + " suman al stock, sin deuda nueva: ya estaban facturados."],
        DEVUELTO: ["¿Se devolvió?", i.Cantidad + " × " + i.Descripcion + " salen del stock."],
        ACEPTADO: ["¿Nos lo quedamos?", "Queda en stock. Si el proveedor lo factura, va a llegar como una factura más."]
      };
      let p;
      if (accion === "FACTURADO")
        p = Swal.fire({ title: "Llegó la factura", html: '<input id="fNum" class="form-control mb-2" placeholder="Número de factura"><div class="input-group"><span class="input-group-text">$</span><input id="fImp" inputmode="decimal" class="form-control text-end" value="' + numeroAPrecio(i.Importe) + '"></div>',
          showCancelButton: true, confirmButtonText: "Registrar", cancelButtonText: "Cancelar", didOpen: () => activarInputPrecio("fImp"),
          preConfirm: () => { const n = document.getElementById("fNum").value.trim(), m = precioANumero(document.getElementById("fImp").value);
            if (!n || !(m > 0)) { Swal.showValidationMessage("Cargá número e importe."); return false; } return { Numero: n, Importe: m }; } });
      else if (accion === "RECHAZADO")
        p = Swal.fire({ title: "El proveedor lo rechazó", input: "text", inputPlaceholder: "Motivo (mínimo 10 caracteres)", showCancelButton: true,
          confirmButtonText: "Registrar", cancelButtonText: "Cancelar", confirmButtonColor: "#c0392b",
          inputValidator: v => (!v || v.trim().length < 10) ? "Escribí un motivo de al menos 10 caracteres." : null })
          .then(r => r.isConfirmed ? { isConfirmed: true, value: { Motivo: r.value.trim() } } : r);
      else
        p = Swal.fire({ title: textos[accion][0], text: textos[accion][1], icon: "question", showCancelButton: true, confirmButtonText: "Sí", cancelButtonText: "Cancelar" })
          .then(r => r.isConfirmed ? { isConfirmed: true, value: {} } : r);

      p.then(r => {
        if (!r.isConfirmed) return;
        fetchAuth(API + "Incidencias/" + id + "/Resolver", { method: "POST", body: JSON.stringify(Object.assign({ Accion: accion }, r.value)) })
          .then(x => x.ok ? cargarSaldos(actual) : leerError(x).then(m => Swal.fire("No se pudo", m, "error")));
      });
    }

    function pagar() {
      const p = prov();
      const venc = facturas.filter(f => f.DiasParaVencer <= 7).reduce((a, f) => a + Number(f.Pendiente), 0);
      const saldo = Math.max(0, Number(p.Saldo));
      Swal.fire({
        title: "Pago a " + p.RazonSocial,
        html: '<div class="text-start">' +
          (venc > 0 ? '<div class="sub mb-2">Vencido o por vencer esta semana: <strong>' + formatearMoneda(venc) + '</strong></div>' : '') +
          '<label class="form-label">Importe</label><div class="input-group mb-3"><span class="input-group-text">$</span><input type="text" inputmode="decimal" id="pImporte" class="form-control text-end"></div>' +
          '<label class="form-label">Sale de</label><select id="pCuenta" class="form-select mb-3">' + cuentas.map(c => '<option value="' + c.Id + '">' + escapeHtml(c.Nombre) + '</option>').join("") + '</select>' +
          '<label class="form-label">Referencia (opcional)</label><input type="text" id="pRef" class="form-control" maxlength="100" placeholder="N° de transferencia o recibo"></div>',
        showCancelButton: true, confirmButtonText: "Registrar pago", cancelButtonText: "Cancelar", confirmButtonColor: "#28a745",
        didOpen: () => {
          activarInputPrecio("pImporte");
          document.getElementById("pImporte").value = numeroAPrecio(venc > 0 ? venc : saldo);
          const mp = cuentas.find(c => !c.EsCaja); if (mp) document.getElementById("pCuenta").value = mp.Id;
        },
        preConfirm: () => {
          const imp = precioANumero(document.getElementById("pImporte").value);
          if (!(imp > 0)) { Swal.showValidationMessage("Ingresá un importe mayor a cero."); return false; }
          return { IdProveedor: actual, IdCuentaFinanciera: parseInt(document.getElementById("pCuenta").value, 10), Importe: imp, Referencia: document.getElementById("pRef").value.trim() || null };
        }
      }).then(r => {
        if (!r.isConfirmed) return;
        fetchAuth(API + "Pagos", { method: "POST", body: JSON.stringify(r.value) })
          .then(x => x.ok ? (Swal.fire({ icon: "success", title: "Pago registrado", timer: 1400, showConfirmButton: false }), cargarSaldos(actual))
                          : leerError(x).then(m => Swal.fire("No se pudo pagar", m, "error")));
      });
    }

    /* ================= ORDEN DE PAGO (script 95) =================
       Se eligen las facturas y cuanto de cada una, las notas de crédito
       que se aplican y con qué se paga. Tiene que cerrar:
         facturas = notas de crédito + lo pagado */
    function ordenPago() {
      const p = prov();
      if (!facturas.length) { Swal.fire("Sin facturas", "Este proveedor no tiene facturas impagas.", "info"); return; }
      fetchAuth(API + "Proveedor/" + actual + "/NotasCreditoDisponibles").then(r => r.ok ? r.json() : []).catch(() => []).then(ncs => {
        ncs = ncs || [];
        const filaF = f => '<tr><td><input type="checkbox" class="form-check-input op-f" data-id="' + f.IdMovimiento + '"' + (f.DiasParaVencer <= 7 ? ' checked' : '') + '></td>' +
          '<td>' + escapeHtml(f.Documento) + '<div class="sub">' + fmtFecha(f.FechaDoc) + ' · vence ' + fmtFecha(f.Vencimiento) + '</div></td>' +
          '<td class="text-end">' + formatearMoneda(f.Pendiente) + '</td>' +
          '<td class="text-end"><input type="text" inputmode="decimal" class="form-control form-control-sm imp op-fi" id="opf' + f.IdMovimiento + '" data-max="' + f.Pendiente + '"></td></tr>';
        const filaN = n => '<tr><td><input type="checkbox" class="form-check-input op-n" data-id="' + n.Id + '"></td>' +
          '<td>Nota de crédito ' + escapeHtml(n.Numero) + '<div class="sub">' + fmtFecha(n.Fecha) + '</div></td>' +
          '<td class="text-end">' + formatearMoneda(n.Disponible) + '</td>' +
          '<td class="text-end"><input type="text" inputmode="decimal" class="form-control form-control-sm imp op-ni" id="opn' + n.Id + '" data-max="' + n.Disponible + '"></td></tr>';
        const opcCuentas = cuentas.map(c => '<option value="' + c.Id + '">' + escapeHtml(c.Nombre) + '</option>').join("");
        Swal.fire({
          title: "Orden de pago · " + p.RazonSocial, width: 860,
          html: '<div class="text-start">' +
            '<div class="op-sec">Facturas que se pagan</div>' +
            '<div style="max-height:260px;overflow:auto;"><table class="op-tabla"><thead><tr><th></th><th>Comprobante</th><th class="text-end">Falta pagar</th><th class="text-end">Se paga</th></tr></thead><tbody>' +
              facturas.map(filaF).join("") + '</tbody></table></div>' +
            (ncs.length ? '<div class="op-sec">Notas de crédito que se aplican</div><table class="op-tabla"><tbody>' + ncs.map(filaN).join("") + '</tbody></table>' : '') +
            '<div class="op-sec">Con qué se paga</div><table class="op-tabla"><tbody id="opMedios"></tbody></table>' +
            '<button type="button" class="btn btn-sm btn-link px-0" id="opMas">+ otro medio</button>' +
            '<div class="op-tot"><span>Facturas <b id="opTF">$ 0,00</b></span><span>Notas de crédito <b id="opTN">$ 0,00</b></span>' +
              '<span>A pagar <b id="opTP">$ 0,00</b></span><span>Medios <b id="opTM">$ 0,00</b></span><span id="opEstado"></span></div>' +
            '<input type="text" id="opObs" class="form-control form-control-sm" maxlength="250" placeholder="Observación (opcional)">' +
            '</div>',
          showCancelButton: true, confirmButtonText: "Registrar orden de pago", cancelButtonText: "Cancelar", confirmButtonColor: "#28a745",
          didOpen: () => {
            const num = id => precioANumero(document.getElementById(id).value) || 0;
            const red = x => Math.round(x * 100) / 100;
            const agregarMedio = monto => {
              const k = document.querySelectorAll(".op-m").length;
              const tr = document.createElement("tr");
              tr.className = "op-m";
              tr.innerHTML = '<td style="width:40%;"><select class="form-select form-select-sm op-mc">' + opcCuentas + '</select></td>' +
                '<td><input type="text" class="form-control form-control-sm op-mr" maxlength="100" placeholder="Referencia (n° de transferencia, recibo)"></td>' +
                '<td class="text-end"><input type="text" inputmode="decimal" class="form-control form-control-sm imp op-mi" id="opm' + k + '"></td>';
              document.getElementById("opMedios").appendChild(tr);
              const mp = cuentas.find(c => !c.EsCaja); if (mp) tr.querySelector(".op-mc").value = mp.Id;
              activarInputPrecio("opm" + k);
              const inp = document.getElementById("opm" + k);
              if (monto) inp.value = numeroAPrecio(monto);
              inp.addEventListener("input", totales);
            };
            const totales = () => {
              let tf = 0, tn = 0, tm = 0;
              document.querySelectorAll(".op-f").forEach(c => { const i = document.getElementById("opf" + c.dataset.id); i.disabled = !c.checked; if (c.checked) tf += num(i.id); });
              document.querySelectorAll(".op-n").forEach(c => { const i = document.getElementById("opn" + c.dataset.id); i.disabled = !c.checked; if (c.checked) tn += num(i.id); });
              document.querySelectorAll(".op-mi").forEach(i => tm += num(i.id));
              tf = red(tf); tn = red(tn); tm = red(tm);
              const ap = red(tf - tn);
              document.getElementById("opTF").textContent = formatearMoneda(tf);
              document.getElementById("opTN").textContent = formatearMoneda(tn);
              document.getElementById("opTP").textContent = formatearMoneda(ap);
              document.getElementById("opTM").textContent = formatearMoneda(tm);
              document.getElementById("opEstado").innerHTML = ap < 0 ? '<span class="op-mal">Las notas superan a las facturas</span>'
                : (red(ap - tm) === 0 ? '<span class="op-ok">Cierra ✓</span>' : '<span class="op-mal">Faltan ' + formatearMoneda(red(ap - tm)) + '</span>');
              return { tf, tn, tm, ap };
            };
            // Al marcar: se propone pagar todo lo que falta de esa factura / aplicar la nota entera
            const enganchar = (chkSel, pref) => document.querySelectorAll(chkSel).forEach(c => {
              const i = document.getElementById(pref + c.dataset.id);
              activarInputPrecio(i.id);
              if (c.checked) i.value = numeroAPrecio(Number(i.dataset.max));
              c.addEventListener("change", () => { i.value = c.checked ? numeroAPrecio(Number(i.dataset.max)) : ""; totales(); ajustarMedio(); });
              i.addEventListener("input", () => { totales(); ajustarMedio(); });
            });
            // Con un solo medio, su importe sigue a lo que hay que pagar
            const ajustarMedio = () => {
              const ms = document.querySelectorAll(".op-mi");
              if (ms.length === 1) { const t = totales(); ms[0].value = t.ap > 0 ? numeroAPrecio(t.ap) : ""; totales(); }
            };
            enganchar(".op-f", "opf"); enganchar(".op-n", "opn");
            agregarMedio(0);
            document.getElementById("opMas").addEventListener("click", () => { agregarMedio(0); totales(); });
            ajustarMedio();
            window._opTotales = totales;
          },
          preConfirm: () => {
            const t = window._opTotales();
            const num = el => precioANumero(el.value) || 0;
            const fact = [], nc = [], med = [];
            for (const c of document.querySelectorAll(".op-f:checked")) {
              const i = document.getElementById("opf" + c.dataset.id), v = num(i);
              if (v <= 0) { Swal.showValidationMessage("Poné cuánto se paga de cada factura marcada."); return false; }
              if (v > Number(i.dataset.max) + 0.001) { Swal.showValidationMessage("No se puede pagar más de lo que falta de una factura."); return false; }
              fact.push({ IdMovimiento: parseInt(c.dataset.id, 10), Importe: v });
            }
            if (!fact.length) { Swal.showValidationMessage("Marcá al menos una factura."); return false; }
            for (const c of document.querySelectorAll(".op-n:checked")) {
              const i = document.getElementById("opn" + c.dataset.id), v = num(i);
              if (v <= 0 || v > Number(i.dataset.max) + 0.001) { Swal.showValidationMessage("Revisá lo aplicado de las notas de crédito."); return false; }
              nc.push({ IdNotaCredito: parseInt(c.dataset.id, 10), Importe: v });
            }
            for (const tr of document.querySelectorAll(".op-m")) {
              const v = num(tr.querySelector(".op-mi"));
              if (v <= 0) continue;
              med.push({ IdCuentaFinanciera: parseInt(tr.querySelector(".op-mc").value, 10), Importe: v, Referencia: tr.querySelector(".op-mr").value.trim() || null });
            }
            if (t.ap < 0) { Swal.showValidationMessage("Las notas de crédito no pueden superar a las facturas."); return false; }
            if (Math.round((t.ap - t.tm) * 100) !== 0) { Swal.showValidationMessage("Lo pagado con los medios tiene que ser igual a lo que hay que pagar."); return false; }
            return { IdProveedor: actual, Facturas: fact, NotasCredito: nc, Medios: med, Observacion: document.getElementById("opObs").value.trim() || null };
          }
        }).then(r => {
          if (!r.isConfirmed) return;
          fetchAuth(API + "OrdenesPago", { method: "POST", body: JSON.stringify(r.value) }).then(x => {
            if (!x.ok) return leerError(x).then(m => Swal.fire("No se pudo registrar", m, "error"));
            return x.json().then(res => {
              tab = "ordenes";
              cargarSaldos(actual);
              Swal.fire({ icon: "success", title: "Orden de pago N° " + String(res.IdOrdenPago).padStart(6, "0"), showCancelButton: true,
                          confirmButtonText: '<i class="bi bi-printer"></i> Ver e imprimir', cancelButtonText: "Listo" })
                .then(q => { if (q.isConfirmed) verOrden(res.IdOrdenPago); });
            });
          });
        });
      });
    }

        const o = d.Orden[0];
        const tr = (a, b) => '<tr><td>' + a + '</td><td class="text-end">' + b + '</td></tr>';

          (o.Estado === "ANULADA" ? '<div class="alert alert-danger py-1">ANULADA el ' + fmtFecha(o.FechaAnulacion) + ': ' + escapeHtml(o.MotivoAnulacion || "") + '</div>' : '') +
          '<div><strong>' + escapeHtml(o.Proveedor) + '</strong>' + (o.CuitProveedor ? ' · CUIT ' + escapeHtml(o.CuitProveedor) : '') + '</div>' +

            d.NotasCredito.map(n => tr('Nota de crédito ' + escapeHtml(n.Numero) + ' <span class="sub">' + fmtFecha(n.Fecha) + '</span>', '−' + formatearMoneda(n.Importe))).join("") + '</table>' : '') +
          '<h6 class="mt-3 mb-1">Pagado con</h6><table class="table table-sm mb-0">' +
            d.Medios.map(m => tr(escapeHtml(m.Cuenta) + (m.Referencia ? ' · ' + escapeHtml(m.Referencia) : '') + (m.Estado === "ANULADO" ? ' <span class="sub">(anulado)</span>' : ''), formatearMoneda(m.Importe))).join("") +

        Swal.fire({ title: "Orden de pago N° " + String(o.Id).padStart(6, "0"), html: html, width: 640, showCancelButton: true,

          if (!r.isConfirmed) return;

            '<h4>Daytona · Orden de pago N° ' + String(o.Id).padStart(6, "0") + '</h4>' + html + '<script>window.onload=function(){window.print();}<\/script></body></html>');
          w.document.close();
        });
      }).catch(() => Swal.fire("Error", "No se pudo abrir la orden de pago.", "error"));
    }

    function anularOrden(id) {
      Swal.fire({ title: "Anular la orden de pago", input: "text", inputPlaceholder: "Motivo (mínimo 10 caracteres)",
                  text: "Se anulan todos sus pagos: la plata vuelve a su cuenta y las facturas vuelven a quedar impagas.",
                  icon: "warning", showCancelButton: true, confirmButtonText: "Anular", cancelButtonText: "Cancelar", confirmButtonColor: "#c0392b",
                  inputValidator: v => (v || "").trim().length < 10 ? "Mínimo 10 caracteres." : undefined }).then(r => {

                pon("dfPB", f.PercepcionIibb, true); pon("dfII", f.ImpuestosInternos, true); pon("dfOT", f.OtrosTributos, true);
                verIva();
                let aviso = "Revisá los datos antes de guardar.";

            const dto = { TipoArca: tipo, PuntoVenta: pv, Numero: nro, Fecha: v("dfFecha"), Cae: v("dfCae") || null, CaeVencimiento: v("dfVto") || null,

    /* ================= SALDO INICIAL =================
       Se pega el resumen de cuenta que manda el proveedor. Se toma de
       cada renglon la fecha, el comprobante y lo PENDIENTE: lo que ya
       abonaste no se vuelve a cargar. */

    function aNumero(t) {
      if (!t) return null;
      let s = String(t).replace(/\$/g, "").replace(/\s/g, "");
      const neg = s.indexOf("-") !== -1;
      s = s.replace(/-/g, "");
      if (s.indexOf(",") !== -1) s = s.replace(/\./g, "").replace(",", ".");
      const n = parseFloat(s);
      return isNaN(n) ? null : (neg ? -n : n);
    }

    function interpretarResumen(texto) {
      const filas = [];
      texto.split(/\r?\n/).forEach(linea => {
        const m = linea.match(/^\s*(\d{2})\/(\d{2})\/(\d{4})/);
        if (!m) return;                                   // encabezados, totales, lineas vacias
        const fecha = m[3] + "-" + m[2] + "-" + m[1];
        let comprobante, pendiente;
        const celdas = linea.split("\t").map(c => c.trim()).filter(c => c !== "");
        if (celdas.length >= 5) {
          // Fecha | Comprobante | Total | Abonado | Pendiente | Acumulado | Dias
          comprobante = celdas[1]; pendiente = aNumero(celdas[4]);
        } else {
          // Sin tabulaciones: el texto entre la fecha y el primer importe, y el tercer importe
          const montos = linea.match(/-?\$?\s?-?[\d.]+,\d{2}/g) || [];
          const sinFecha = linea.replace(/^\s*\d{2}\/\d{2}\/\d{4}(\s+\d{2}:\d{2})?/, "");
          const iniMonto = sinFecha.search(/-?\$?\s?-?[\d.]+,\d{2}/);
          comprobante = (iniMonto > 0 ? sinFecha.slice(0, iniMonto) : sinFecha).trim();
          pendiente = aNumero(montos.length >= 3 ? montos[2] : montos[montos.length - 1]);
        }
        if (comprobante && pendiente) filas.push({ Fecha: fecha, Comprobante: comprobante, Importe: pendiente });
      });
      return filas;
    }

    function prepararFoto(file) {
      return new Promise((resolve, reject) => {
        const leer = f => { const fr = new FileReader(); fr.onload = () => resolve({ nombre: file.name, mime: f.type || file.type, base64: fr.result, tam: f.size }); fr.onerror = reject; fr.readAsDataURL(f); };
        if (!file.type.startsWith("image/") || file.size <= 1.5 * 1024 * 1024) { leer(file); return; }
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, 1800 / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          c.toBlob(b => { URL.revokeObjectURL(img.src); leer(new File([b], file.name.replace(/\.\w+$/, ".jpg"), { type: "image/jpeg" })); }, "image/jpeg", 0.82);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    function cambiarFoto(idRecepcion) {
      fotoRecepcion = idRecepcion;
      let input = document.getElementById("fotoFactura");
      if (!input) {
        input = document.createElement("input");
        input.type = "file"; input.id = "fotoFactura"; input.hidden = true;
        input.accept = "image/jpeg,image/png,image/webp,application/pdf";
        input.addEventListener("change", e => {
          const f = e.target.files[0]; e.target.value = "";
          if (!f || !fotoRecepcion) return;
          prepararFoto(f).then(a => {
            if (a.tam > 2 * 1024 * 1024) return Promise.reject("El archivo supera los 2 MB.");
            return fetchAuth(API_BASE + "Finanzas/Adjunto", { method: "POST", body: JSON.stringify({ NombreArchivo: a.nombre, TipoMime: a.mime, ContenidoBase64: a.base64 }) });
          })
          .then(x => x.ok ? x.json() : leerError(x).then(m => Promise.reject(m)))
          .then(d => fetchAuth(API_BASE + "Compras/Recepcion/" + fotoRecepcion + "/Adjunto", { method: "POST", body: JSON.stringify({ IdAdjunto: d.IdAdjunto }) }))
          .then(x => x.ok ? null : leerError(x).then(m => Promise.reject(m)))
          .then(() => { Swal.fire({ icon: "success", title: "Foto actualizada", timer: 1300, showConfirmButton: false }); if (window._fotoCb) window._fotoCb(); })
          .catch(m => Swal.fire("No se pudo cambiar", typeof m === "string" ? m : "Error de conexión.", "error"));
        });
        document.body.appendChild(input);
      }
      input.click();
    }

    function quitarFoto(idRecepcion) {
      Swal.fire({ title: "¿Quitar la foto?", text: "Deja de mostrarse en esta factura. Queda registrado quién la quitó.",
        icon: "warning", showCancelButton: true, confirmButtonText: "Quitar", cancelButtonText: "Cancelar", confirmButtonColor: "#c0392b"
      }).then(r => {
        if (!r.isConfirmed) return;
        fetchAuth(API_BASE + "Compras/Recepcion/" + idRecepcion + "/Adjunto", { method: "POST", body: JSON.stringify({ IdAdjunto: null }) })
          .then(x => x.ok ? (window._fotoCb && window._fotoCb()) : leerError(x).then(m => Swal.fire("No se pudo quitar", m, "error")));
      });
    }

    function verAdjunto(id) {
      fetchAuth(API_BASE + "Finanzas/Adjunto/" + id).then(r => r.ok ? r.blob() : Promise.reject())
        .then(b => window.open(URL.createObjectURL(b), "_blank"))
        .catch(() => Swal.fire("No se pudo abrir", "El comprobante no está disponible.", "error"));
    }

    window.onload = function () {
      if (esPlata) fetchAuth(API_BASE + "Finanzas/Cuentas").then(r => r.ok ? r.json() : []).then(c => cuentas = c || []);
      const id = parseInt(new URLSearchParams(location.search).get("id"), 10);
      cargarSaldos(id || null);
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
