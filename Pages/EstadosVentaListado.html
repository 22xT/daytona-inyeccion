<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estados de Venta - Daytona Inyección</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <style>
    .repuesto-discontinuado {
      opacity: 0.55;
      background-color: #f5f5f5 !important;
    }
    .badge-discontinuado {
      background: #6c757d;
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
    }
    .badge-sistema {
      background: #001f3f;
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
    }
  </style>
</head>

<body data-page="estados-venta">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="header-bar">
      <div>
        <h2><i class="bi bi-tags"></i> Estados de Venta</h2>
        <span class="subtitle">Estados que puede tener una venta. Confirmada y Anulada son del sistema.</span>
      </div>
      <a href="EstadoVentaForm.html" class="btn btn-danger admin-only">
        <i class="bi bi-plus-lg"></i> Estado
      </a>
    </div>

    <div class="panel">
      <div class="panel-header" id="panelResultados"><i class="bi bi-list-ul"></i> Listado</div>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaEstados">
            <tr class="loading-row"><td colspan="3">Cargando estados…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="layout.js"></script>
  <script>
    if (!Auth.requireSession()) { /* redirect */ }

    const apiEstado = API_BASE + "EstadoVenta";
    const usuario = Auth.getUsuario();
    const esAdmin = usuario && usuario.Rol === "Administrador";
    if (esAdmin) document.body.classList.add('is-admin');

    // Ids protegidos
    const ID_SISTEMA = [1, 2];

    function esActivo(e) {
      return e.Activo === true || e.Activo === 1;
    }

    function esSistema(id) {
      return ID_SISTEMA.indexOf(id) !== -1;
    }

    function cargar() {
      fetchAuth(apiEstado).then(r => r.json()).then(data => {
        renderizar(data);
      }).catch(() => {
        document.getElementById("tablaEstados").innerHTML =
          "<tr><td colspan='3' class='text-center text-danger p-4'>No se pudieron cargar los estados.</td></tr>";
      });
    }

    function renderizar(lista) {
      const tbody = document.getElementById("tablaEstados");
      const panel = document.getElementById("panelResultados");
      panel.innerHTML = '<i class="bi bi-list-ul"></i> Listado (' + lista.length + ')';

      if (lista.length === 0) {
        tbody.innerHTML = "<tr><td colspan='3' class='text-center text-muted p-4'>No hay estados cargados.</td></tr>";
        return;
      }

      let html = "";
      lista.forEach(e => {
        const activo = esActivo(e);
        const sistema = esSistema(e.Id);
        const claseFila = activo ? "" : "repuesto-discontinuado";

        let badges = "";
        if (sistema) badges += "<span class='badge-sistema'><i class='bi bi-lock-fill'></i> Sistema</span>";
        if (!activo) badges += "<span class='badge-discontinuado'>Inactivo</span>";

        html += "<tr class='" + claseFila + "'>";
        html += "<td><strong>#" + e.Id + "</strong></td>";
        html += "<td>" + escapeHtml(e.Nombre) + badges + "</td>";

        if (esAdmin) {
          html += "<td class='text-center'>";
          if (sistema) {
            html += "<span class='text-muted small'><i class='bi bi-shield-lock'></i> Protegido</span>";
          } else {
            html += "<a href='EstadoVentaForm.html?id=" + e.Id + "' class='btn btn-sm btn-outline-primary me-1' title='Editar'><i class='bi bi-pencil'></i></a>";
            if (activo) {
              html += "<button class='btn btn-sm btn-outline-danger' onclick='descontinuar(" + e.Id + ")' title='Dar de baja'><i class='bi bi-x-circle'></i></button>";
            } else {
              html += "<button class='btn btn-sm btn-outline-success' onclick='reactivar(" + e.Id + ")' title='Reactivar'><i class='bi bi-arrow-counterclockwise'></i></button>";
            }
          }
          html += "</td>";
        } else {
          html += "<td class='text-center'><span class='text-muted small'>Solo lectura</span></td>";
        }
        html += "</tr>";
      });
      tbody.innerHTML = html;
    }

    function descontinuar(id) {
      Swal.fire({
        title: "¿Dar de baja el estado?",
        text: "Dejará de aparecer en formularios.",
        icon: "question",
        showCancelButton: true,
        confirmButtonColor: "#ff3333",
        confirmButtonText: "Sí, dar de baja",
        cancelButtonText: "Cancelar"
      }).then(result => {
        if (!result.isConfirmed) return;
        fetchAuth(apiEstado + "/" + id, { method: "DELETE" }).then(r => {
          if (r.ok) { Swal.fire("Listo", "Estado dado de baja.", "success"); cargar(); }
          else leerError(r).then(msg => Swal.fire("Error", msg, "error"));
        });
      });
    }

    function reactivar(id) {
      fetchAuth(apiEstado + "/" + id + "/Activar", { method: "PUT" }).then(r => {
        if (r.ok) { Swal.fire("Listo", "Estado reactivado.", "success"); cargar(); }
        else leerError(r).then(msg => Swal.fire("Error", msg, "error"));
      });
    }

    function leerError(response) {
      return response.text().then(text => {
        try { const data = JSON.parse(text); return data.Message || data.message || text; }
        catch { return text; }
      }).catch(() => "No se pudo completar la operación.");
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    window.onload = cargar;
  </script>
</body>
</html>
