<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Presupuestos - Daytona Repuestos Automotor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="precio.js"></script>
  <style>
    .codigo-repuesto {
      font-family: 'Courier New', monospace; font-weight: 700;
      color: #2c3e50; letter-spacing: 0.5px;
    }
    .nro-presup { font-weight: 700; color: var(--navy); font-size: 0.95rem; }
    .badge-vigente    { background: var(--green-soft); color: #155724; }
    .badge-vencido    { background: #fff3cd; color: #856404; }
    .badge-convertido { background: #e8f1ff; color: #0b3f85; }
    .badge-anulado    { background: var(--red-soft); color: #721c24; }
    .btn-icono {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 8px; cursor: pointer; color: var(--text-muted); font-size: 0.85rem;
    }
    .btn-icono:hover { border-color: var(--nav-accent); color: var(--nav-accent-dark); }
    .btn-icono.peligro:hover { border-color: var(--red); color: var(--red); }
    .btn-icono.convertir { border-color: #b7dfc4; color: #1e7e34; }
    .btn-icono.convertir:hover { background: var(--green); border-color: var(--green); color: #fff; }
    #hojaPresupuesto { display: none; }
    @media print {
      body * { visibility: hidden !important; }
      #hojaPresupuesto, #hojaPresupuesto * { visibility: visible !important; }
      #hojaPresupuesto {
        display: block !important; position: absolute; left: 0; top: 0; width: 100%;
        padding: 20px; font-family: Arial, sans-serif; color: #000;
      }
      #hojaPresupuesto table { width: 100%; border-collapse: collapse; }
      #hojaPresupuesto th, #hojaPresupuesto td { border: 1px solid #999; padding: 6px 8px; font-size: 12px; }
      #hojaPresupuesto th { background: #eee; }
    }
  </style>
</head>

<body data-page="presupuestos">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="header-bar">
      <div>
        <h2><i class="bi bi-file-earmark-text"></i> Presupuestos</h2>
        <span class="subtitle">Presupuestos emitidos y su seguimiento</span>
      </div>
      <div class="header-actions">
        <button type="button" id="btnStats" class="btn-stats">
          <i class="bi bi-bar-chart-line"></i>
          <span class="txt">Ver estadísticas</span>
          <i class="bi chev bi-chevron-down"></i>
        </button>
        <a href="CargarVenta.html" class="btn btn-danger">
          <i class="bi bi-plus-lg"></i> Nuevo presupuesto
        </a>
      </div>
    </div>

    <div class="row g-3 mb-3 stats-wrap" id="statsWrap">
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon blue"><i class="bi bi-file-earmark-text"></i></div>
          <div><p class="stat-value" id="kpiTotal">0</p><p class="stat-label">Presupuestos</p></div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon green"><i class="bi bi-check-circle"></i></div>
          <div><p class="stat-value" id="kpiVigentes">0</p><p class="stat-label">Vigentes</p></div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon violet"><i class="bi bi-cart-check"></i></div>
          <div><p class="stat-value" id="kpiConvertidos">0</p><p class="stat-label">Convertidos en venta</p></div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon yellow"><i class="bi bi-percent"></i></div>
          <div><p class="stat-value" id="kpiConversion">0%</p><p class="stat-label">Tasa de conversión</p></div>
        </div>
      </div>
    </div>

    <div class="filtros-bar">
      <div class="row g-2 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Buscar</label>
          <input type="text" id="fTexto" class="form-control" placeholder="N° o cliente...">
        </div>
        <div class="col-md-2">
          <label class="form-label">Desde</label>
          <input type="date" id="fDesde" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Hasta</label>
          <input type="date" id="fHasta" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label">Estado</label>
          <select id="fEstado" class="form-select">
            <option value="">Todos</option>
            <option value="Vigente">Vigente</option>
            <option value="Vencido">Vencido</option>
            <option value="Convertido">Convertido</option>
            <option value="Anulado">Anulado</option>
          </select>
        </div>
        <div class="col-md-2">
          <button id="btnFiltrar" class="btn btn-primary w-100">
            <i class="bi bi-funnel"></i> Filtrar
          </button>
        </div>
        <div class="col-md-1">
          <button id="btnLimpiar" class="btn btn-limpiar" title="Limpiar filtros">
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>N°</th>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Tipo</th>
              <th class="text-center">Ítems</th>
              <th class="text-end">Total</th>
              <th>Vence</th>
              <th>Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla">
            <tr class="loading-row"><td colspan="9">Cargando presupuestos…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="hojaPresupuesto"></div>

  <script src="layout.js"></script>
  <script>
    if (!Auth.requireSession()) { /* redirect */ }

    var api = API_BASE;
    var listado = [];

    function escapeHtml(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    function fecha(v) {
      if (!v) return "-";
      var d = new Date(v);
      return isNaN(d) ? "-" : d.toLocaleDateString("es-AR");
    }

    function badgeEstado(e) {
      var clase = {
        "Vigente": "badge-vigente", "Vencido": "badge-vencido",
        "Convertido": "badge-convertido", "Anulado": "badge-anulado"
      }[e] || "badge-vigente";
      var icono = {
        "Vigente": "bi-check-circle", "Vencido": "bi-clock-history",
        "Convertido": "bi-cart-check", "Anulado": "bi-x-circle"
      }[e] || "bi-circle";
      return '<span class="badge-estado ' + clase + '"><i class="bi ' + icono + '"></i> ' + e + '</span>';
    }

    function leerError(response) {
      return response.text().then(function (text) {
        try { var d = JSON.parse(text); return d.Message || d.message || text; }
        catch (e) { return text; }
      }).catch(function () { return "No se pudo completar la operación."; });
    }

    /* ================= LISTADO ================= */

    function cargar() {
      var params = [];
      var texto = document.getElementById("fTexto").value.trim();
      var desde = document.getElementById("fDesde").value;
      var hasta = document.getElementById("fHasta").value;
      var estado = document.getElementById("fEstado").value;

      if (texto) params.push("texto=" + encodeURIComponent(texto));
      if (desde) params.push("desde=" + desde);
      if (hasta) params.push("hasta=" + hasta);
      if (estado) params.push("estado=" + encodeURIComponent(estado));

      var url = api + "Presupuesto" + (params.length ? "?" + params.join("&") : "");

      document.getElementById("tabla").innerHTML =
        '<tr class="loading-row"><td colspan="9">Cargando presupuestos…</td></tr>';

      fetchAuth(url).then(function (r) {
        if (!r.ok) return leerError(r).then(function (m) { throw new Error(m); });
        return r.json();
      }).then(function (datos) {
        listado = datos || [];
        pintar();
        pintarKpis();
      }).catch(function (err) {
        document.getElementById("tabla").innerHTML =
          '<tr><td colspan="9" class="text-center text-danger py-4">' +
          escapeHtml(err.message || "No se pudieron cargar los presupuestos.") + '</td></tr>';
      });
    }

    function pintar() {
      var tb = document.getElementById("tabla");

      if (listado.length === 0) {
        tb.innerHTML = '<tr><td colspan="9">' +
          '<div class="empty-state"><div class="icon"><i class="bi bi-file-earmark-text"></i></div>' +
          '<h4>Sin presupuestos</h4><p>No hay presupuestos que coincidan con el filtro.</p></div></td></tr>';
        return;
      }

      var html = "";
      listado.forEach(function (p) {
        var anulable = p.Estado !== "Anulado" && p.Estado !== "Convertido";
        var convertible = p.Estado === "Vigente" || p.Estado === "Vencido";
        html += "<tr>" +
          "<td><span class='nro-presup'>#" + p.Numero + "</span></td>" +
          "<td>" + fecha(p.Fecha) + "</td>" +
          "<td>" + escapeHtml(p.Cliente) +
            (p.TelefonoOcasional
              ? "<div class='text-muted' style='font-size:0.78rem;'><i class='bi bi-whatsapp'></i> " +
                escapeHtml(p.TelefonoOcasional) + "</div>"
              : "") +
          "</td>" +
          "<td><span class='badge-rubro'>" + escapeHtml(p.TipoCliente) + "</span></td>" +
          "<td class='text-center'>" + p.CantidadItems + "</td>" +
          "<td class='text-end precio'>" + formatearMoneda(p.Total) + "</td>" +
          "<td>" + fecha(p.FechaVencimiento) + "</td>" +
          "<td>" + badgeEstado(p.Estado) + "</td>" +
          "<td class='text-center'>" +
            "<button class='btn-icono' onclick='verDetalle(" + p.Id + ")' title='Ver detalle'>" +
              "<i class='bi bi-eye'></i></button> " +
            "<button class='btn-icono' onclick='imprimir(" + p.Id + ")' title='Imprimir'>" +
              "<i class='bi bi-printer'></i></button> " +
            (convertible
              ? "<button class='btn-icono convertir' onclick='convertir(" + p.Id + ", " + p.Numero +
                ", \"" + p.Estado + "\")' title='Convertir en venta'>" +
                "<i class='bi bi-cart-check'></i></button> "
              : "") +
            (anulable
              ? "<button class='btn-icono peligro admin-only' onclick='anular(" + p.Id + ", " + p.Numero + ")' " +
                "title='Anular'><i class='bi bi-x-circle'></i></button>"
              : "") +
          "</td>" +
        "</tr>";
      });
      tb.innerHTML = html;
    }

    function pintarKpis() {
      var total = listado.length;
      var vigentes = listado.filter(function (p) { return p.Estado === "Vigente"; }).length;
      var convertidos = listado.filter(function (p) { return p.Estado === "Convertido"; }).length;

      // Los anulados no cuentan como oportunidad perdida: nunca llegaron al cliente
      var base = listado.filter(function (p) { return p.Estado !== "Anulado"; }).length;
      var tasa = base > 0 ? Math.round((convertidos / base) * 100) : 0;

      document.getElementById("kpiTotal").textContent = total;
      document.getElementById("kpiVigentes").textContent = vigentes;
      document.getElementById("kpiConvertidos").textContent = convertidos;
      document.getElementById("kpiConversion").textContent = tasa + "%";
    }

    /* ================= DETALLE ================= */

    function traerDetalle(id) {
      return fetchAuth(api + "Presupuesto/" + id).then(function (r) {
        if (!r.ok) return leerError(r).then(function (m) { throw new Error(m); });
        return r.json();
      });
    }

    // El SP devuelve dos tablas: [0] cabecera, [1] renglones
    function partirDataSet(ds) {
      var tablas = Array.isArray(ds) ? ds : (ds.Table ? [ds.Table, ds.Table1] : []);
      var cab = (tablas[0] && tablas[0][0]) ? tablas[0][0] : null;
      var det = tablas[1] || [];
      return { cabecera: cab, detalle: det };
    }

    function verDetalle(id) {
      traerDetalle(id).then(function (ds) {
        var d = partirDataSet(ds);
        if (!d.cabecera) throw new Error("No se encontró el presupuesto.");

        var filas = "";
        var hayCambio = false;
        d.detalle.forEach(function (r) {
          var cambio = r.PrecioActual !== undefined &&
                       Math.abs(Number(r.PrecioActual) - Number(r.PrecioUnitario)) > 0.009;
          if (cambio) hayCambio = true;
          filas += "<tr>" +
            "<td><span class='codigo-repuesto'>" + escapeHtml(r.Codigo) + "</span></td>" +
            "<td class='text-start'>" + escapeHtml(r.Descripcion) + "</td>" +
            "<td class='text-center'>" + r.Cantidad + "</td>" +
            "<td class='text-end'>" + formatearMoneda(r.PrecioUnitario) +
              (cambio
                ? "<div style='font-size:0.7rem;color:#856404;'>hoy " + formatearMoneda(r.PrecioActual) + "</div>"
                : "") +
            "</td>" +
            "<td class='text-end'>" + formatearMoneda(r.Subtotal) + "</td>" +
          "</tr>";
        });

        var aviso = hayCambio
          ? "<div style='margin-top:10px;padding:8px;background:#fff8e1;border-radius:6px;" +
            "font-size:0.82rem;color:#856404;text-align:left;'>" +
            "<i class='bi bi-exclamation-triangle'></i> Algunos precios cambiaron desde que se emitió." +
            "</div>"
          : "";

        Swal.fire({
          title: "Presupuesto #" + d.cabecera.Numero,
          html:
            "<div style='text-align:left;font-size:0.88rem;margin-bottom:10px;'>" +
              "<div><strong>Cliente:</strong> " + escapeHtml(d.cabecera.Cliente) + "</div>" +
              (d.cabecera.TelefonoOcasional
                ? "<div><strong>Teléfono:</strong> " + escapeHtml(d.cabecera.TelefonoOcasional) + "</div>" : "") +
              "<div><strong>Emitido:</strong> " + fecha(d.cabecera.Fecha) +
                " &nbsp;·&nbsp; <strong>Vence:</strong> " + fecha(d.cabecera.FechaVencimiento) + "</div>" +
              "<div><strong>Estado:</strong> " + badgeEstado(d.cabecera.Estado) + "</div>" +
            "</div>" +
            "<table class='table table-sm' style='font-size:0.82rem;'><thead><tr>" +
              "<th>Código</th><th class='text-start'>Descripción</th><th class='text-center'>Cant</th>" +
              "<th class='text-end'>P. Unit.</th><th class='text-end'>Subtotal</th>" +
            "</tr></thead><tbody>" + filas + "</tbody></table>" +
            "<div style='text-align:right;font-size:1.1rem;font-weight:700;color:#001f3f;'>" +
              "TOTAL: " + formatearMoneda(d.cabecera.Total) + "</div>" +
            aviso,
          width: 720,
          showCancelButton: true,
          confirmButtonText: "Imprimir",
          cancelButtonText: "Cerrar",
          confirmButtonColor: "#001f3f"
        }).then(function (res) {
          if (res.isConfirmed) armarHojaEImprimir(d);
        });
      }).catch(function (err) {
        Swal.fire("Error", err.message || "No se pudo cargar el detalle.", "error");
      });
    }

    function imprimir(id) {
      traerDetalle(id).then(function (ds) {
        var d = partirDataSet(ds);
        if (!d.cabecera) throw new Error("No se encontró el presupuesto.");
        armarHojaEImprimir(d);
      }).catch(function (err) {
        Swal.fire("Error", err.message || "No se pudo imprimir.", "error");
      });
    }

    function armarHojaEImprimir(d) {
      var filas = "";
      d.detalle.forEach(function (r) {
        filas += "<tr>" +
          "<td>" + escapeHtml(r.Codigo) + "</td>" +
          "<td>" + escapeHtml(r.Descripcion) + "</td>" +
          "<td style='text-align:center'>" + r.Cantidad + "</td>" +
          "<td style='text-align:right'>" + formatearMoneda(r.PrecioUnitario) + "</td>" +
          "<td style='text-align:right'>" + formatearMoneda(r.Subtotal) + "</td>" +
        "</tr>";
      });

      var datosCli = "<div><strong>Cliente:</strong> " + escapeHtml(d.cabecera.Cliente) + "</div>";
      if (d.cabecera.TelefonoOcasional)
        datosCli += "<div><strong>Teléfono:</strong> " + escapeHtml(d.cabecera.TelefonoOcasional) + "</div>";
      datosCli += "<div><strong>Tipo:</strong> " + escapeHtml(d.cabecera.TipoCliente) + "</div>";

      document.getElementById("hojaPresupuesto").innerHTML =
        '<div style="border-bottom:3px solid #001f3f;padding-bottom:10px;margin-bottom:14px;">' +
          '<div style="font-size:26px;font-weight:bold;color:#001f3f;">DAYTONA</div>' +
          '<div style="font-size:11px;letter-spacing:2px;color:#555;">REPUESTOS AUTOMOTOR</div>' +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;margin-bottom:14px;font-size:13px;">' +
          '<div>' + datosCli + '</div>' +
          '<div style="text-align:right;">' +
            '<div><strong>PRESUPUESTO N° ' + d.cabecera.Numero + '</strong></div>' +
            '<div>Fecha: ' + fecha(d.cabecera.Fecha) + '</div>' +
            '<div>Válido hasta: ' + fecha(d.cabecera.FechaVencimiento) + '</div>' +
          '</div>' +
        '</div>' +
        '<table><thead><tr>' +
          '<th>Código</th><th>Descripción</th><th>Cant.</th><th>P. Unit.</th><th>Subtotal</th>' +
        '</tr></thead><tbody>' + filas + '</tbody></table>' +
        '<div style="text-align:right;margin-top:14px;font-size:18px;font-weight:bold;color:#001f3f;">' +
          'TOTAL: ' + formatearMoneda(d.cabecera.Total) + '</div>' +
        '<div style="margin-top:24px;font-size:11px;color:#666;border-top:1px solid #ccc;padding-top:8px;">' +
          'Presupuesto sin valor fiscal. Precios sujetos a modificación sin previo aviso.</div>';

      window.print();
    }

    /* ================= CONVERTIR EN VENTA ================= */

    function convertir(id, numero, estado) {
      var avisoVencido = estado === "Vencido"
        ? "<div style='margin-top:8px;padding:8px;background:#fff8e1;border-radius:6px;" +
          "font-size:0.82rem;color:#856404;'><i class='bi bi-exclamation-triangle'></i> " +
          "Este presupuesto está vencido. Revisá los precios antes de confirmar.</div>"
        : "";

      Swal.fire({
        title: "¿Convertir el presupuesto #" + numero + " en venta?",
        html: "<div style='text-align:left;font-size:0.88rem;'>" +
              "Se abre la pantalla de venta con los repuestos ya cargados y " +
              "<strong>los precios presupuestados</strong>.<br><br>" +
              "La venta no se registra hasta que la confirmes ahí." + avisoVencido + "</div>",
        icon: "question",
        showCancelButton: true,
        confirmButtonColor: "#28a745",
        confirmButtonText: "Abrir la venta",
        cancelButtonText: "Cancelar"
      }).then(function (res) {
        if (res.isConfirmed) window.location.href = "CargarVenta.html?presupuesto=" + id;
      });
    }

    /* ================= ANULAR ================= */

    function anular(id, numero) {
      Swal.fire({
        title: "¿Anular el presupuesto #" + numero + "?",
        text: "Queda registrado como anulado. No se borra del historial.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#c0392b",
        confirmButtonText: "Sí, anular",
        cancelButtonText: "Cancelar"
      }).then(function (res) {
        if (!res.isConfirmed) return;

        fetchAuth(api + "Presupuesto/" + id, { method: "DELETE" }).then(function (r) {
          if (!r.ok) return leerError(r).then(function (m) { throw new Error(m); });
          Swal.fire("Anulado", "El presupuesto #" + numero + " quedó anulado.", "success");
          cargar();
        }).catch(function (err) {
          Swal.fire("No se pudo anular", err.message || "Error de conexión.", "error");
        });
      });
    }

    /* ================= INICIO ================= */

    window.onload = function () {
      var usuario = Auth.getUsuario();
      if (usuario && (usuario.Rol === "Administrador" || usuario.Rol === "Supervisor" || usuario.Rol === "Dueño")) {
        document.body.classList.add("is-admin");
      }

      document.getElementById("btnFiltrar").addEventListener("click", cargar);
      document.getElementById("fTexto").addEventListener("keydown", function (e) {
        if (e.key === "Enter") cargar();
      });
      document.getElementById("fEstado").addEventListener("change", cargar);
      document.getElementById("btnLimpiar").addEventListener("click", function () {
        document.getElementById("fTexto").value = "";
        document.getElementById("fDesde").value = "";
        document.getElementById("fHasta").value = "";
        document.getElementById("fEstado").value = "";
        cargar();
      });

      cargar();
    };
  </script>
</body>
</html>
