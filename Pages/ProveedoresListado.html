<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proveedores - Daytona Inyección</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <style>
    .stat-card { background:#fff; border:1px solid #e3e7ec; border-radius:10px; padding:12px 18px; text-align:center; }
    .stat-num { font-size:1.6rem; font-weight:700; line-height:1; }
    .stat-label { font-size:0.72rem; color:#6c7a89; text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }
    .stat-total .stat-num { color:#1F3864; }
    .stat-activos .stat-num { color:#1f7a1f; }
    .stat-inactivos .stat-num { color:#8a8a8a; }
    tr.fila-inactiva { background:#fafafa; color:#8a8a8a; }
    tr.fila-inactiva td { opacity:0.75; }
    th.sortable { cursor:pointer; user-select:none; white-space:nowrap; }
    th.sortable:hover { background:#2E5496; }
    .sort-icon { font-size:0.75rem; opacity:0.5; margin-left:3px; }
    .sort-icon.activo { opacity:1; }
    .empty-state { padding:2.5rem 1rem; text-align:center; color:#8a8a8a; }
    .empty-state i { font-size:2.2rem; display:block; margin-bottom:0.6rem; opacity:0.4; }
    .link-contacto { color:#1F3864; text-decoration:none; }
    .link-contacto:hover { text-decoration:underline; }
  </style>
</head>

<body data-page="proveedores">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="header-bar">
      <div>
        <h2><i class="bi bi-truck"></i> Proveedores</h2>
        <span class="subtitle">Listado completo de proveedores registrados</span>
      </div>
      <a href="ProveedorForm.html" class="btn btn-danger admin-only">
        <i class="bi bi-plus-lg"></i> Proveedor
      </a>
    </div>

    <!-- Contadores -->
    <div class="row g-3 mb-3">
      <div class="col-4">
        <div class="stat-card stat-total">
          <div class="stat-num" id="statTotal">—</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-card stat-activos">
          <div class="stat-num" id="statActivos">—</div>
          <div class="stat-label">Activos</div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-card stat-inactivos">
          <div class="stat-num" id="statInactivos">—</div>
          <div class="stat-label">Inactivos</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><i class="bi bi-funnel"></i> Filtros y búsqueda</div>
      <div class="panel-body">
        <div class="row g-2 align-items-center">
          <div class="col-md-4">
            <div class="btn-group w-100">
              <button type="button" class="btn btn-outline-primary active" data-filtro="todos">Todos</button>
              <button type="button" class="btn btn-outline-primary" data-filtro="activos">Activos</button>
              <button type="button" class="btn btn-outline-primary" data-filtro="inactivos">Inactivos</button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="buscador" class="form-control"
                     placeholder="Buscar por CUIT, razón social, teléfono o provincia...">
            </div>
          </div>
          <div class="col-md-2">
            <button type="button" id="btnLimpiar" class="btn btn-outline-secondary w-100">
              <i class="bi bi-x-circle"></i> Limpiar
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header" id="panelListado"><i class="bi bi-list-ul"></i> Listado</div>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th class="sortable" data-col="Id">ID <i class="bi bi-arrow-down-up sort-icon"></i></th>
              <th class="sortable" data-col="Cuit">CUIT <i class="bi bi-arrow-down-up sort-icon"></i></th>
              <th class="sortable" data-col="RazonSocial">Razón Social <i class="bi bi-arrow-down-up sort-icon"></i></th>
              <th>Condición IVA</th>
              <th class="sortable" data-col="Provincia">Provincia <i class="bi bi-arrow-down-up sort-icon"></i></th>
              <th>Teléfono</th>
              <th class="text-center">Estado</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProveedores">
            <tr><td colspan="8" class="text-center text-muted p-4">
              <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
              Cargando proveedores…
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-2">
      <span id="infoPagina" class="text-muted small"></span>
      <div>
        <button type="button" id="btnAnterior" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-chevron-left"></i> Anterior
        </button>
        <button type="button" id="btnSiguiente" class="btn btn-outline-secondary btn-sm">
          Siguiente <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <script src="layout.js"></script>
  <script>
    if (!Auth.requireSession()) { /* redirect */ }

    const apiProveedor = API_BASE + "Proveedor";
    const usuario = Auth.getUsuario();
    const esAdmin = usuario && usuario.Rol === "Administrador";
    if (esAdmin) document.body.classList.add('is-admin');

    const buscador = document.getElementById("buscador");
    const infoPagina = document.getElementById("infoPagina");
    const btnAnterior = document.getElementById("btnAnterior");
    const btnSiguiente = document.getElementById("btnSiguiente");
    const btnLimpiar = document.getElementById("btnLimpiar");

    let proveedores = [];
    let filtroActual = "todos";
    let ordenCol = "Id";
    let ordenAsc = true;
    const POR_PAGINA = 10;
    let paginaActual = 1;

    /* ============ SEGURIDAD: escapar HTML (evita XSS en SweetAlert y tabla) ============ */
    function esc(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    /* ============ Normalizar texto para búsqueda (sin acentos, sin espacios extra) ============ */
    function norm(s) {
      return String(s || "")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")  // saca acentos
        .replace(/\s+/g, " ").trim();
    }

    function mostrarError(err) {
      if (err && (err.message === "401 Unauthorized" || err.message === "403 Forbidden")) return;
      Swal.fire("Error", (err && err.message) || "Ocurrió un error.", "error");
    }
    function obtenerMensajeError(response, defecto) {
      return response.json().then(err => err && err.Message ? err.Message : defecto).catch(() => defecto);
    }

    /* ============ Filtrado y búsqueda multi-campo ============ */
    function filtrados() {
      const texto = norm(buscador.value);
      let lista = proveedores.filter(p => {
        if (filtroActual === "activos" && !p.Activo) return false;
        if (filtroActual === "inactivos" && p.Activo) return false;
        if (texto === "") return true;

        // Busca en CUIT, razón social, teléfono y provincia
        return norm(p.Cuit).includes(texto)
            || norm(p.RazonSocial).includes(texto)
            || norm(p.Telefono).includes(texto)
            || norm(p.Provincia).includes(texto);
      });

      // Ordenamiento
      lista.sort((a, b) => {
        let va = a[ordenCol], vb = b[ordenCol];
        if (ordenCol === "Id") { va = Number(va); vb = Number(vb); }
        else { va = norm(va); vb = norm(vb); }
        if (va < vb) return ordenAsc ? -1 : 1;
        if (va > vb) return ordenAsc ? 1 : -1;
        return 0;
      });

      return lista;
    }

    function actualizarContadores() {
      const total = proveedores.length;
      const activos = proveedores.filter(p => p.Activo).length;
      document.getElementById("statTotal").textContent = total;
      document.getElementById("statActivos").textContent = activos;
      document.getElementById("statInactivos").textContent = total - activos;
    }

    function listar() {
      fetchAuth(apiProveedor).then(r => {
        if (!r.ok) throw new Error("No se pudo cargar la lista de proveedores.");
        return r.json();
      }).then(data => {
        proveedores = data;
        actualizarContadores();
        render();
      }).catch(err => {
        document.getElementById("tablaProveedores").innerHTML =
          '<tr><td colspan="8"><div class="empty-state text-danger">' +
          '<i class="bi bi-exclamation-triangle"></i>No se pudo cargar el listado.<br>' +
          '<button class="btn btn-sm btn-outline-danger mt-2" onclick="listar()">Reintentar</button>' +
          '</div></td></tr>';
        mostrarError(err);
      });
    }

    function render() {
      const lista = filtrados();
      const totalPaginas = Math.max(1, Math.ceil(lista.length / POR_PAGINA));
      if (paginaActual > totalPaginas) paginaActual = totalPaginas;
      const pagina = lista.slice((paginaActual - 1) * POR_PAGINA, paginaActual * POR_PAGINA);

      document.getElementById("panelListado").innerHTML =
        '<i class="bi bi-list-ul"></i> Listado (' + lista.length + ')';

      // Estado vacío diferenciado: sin datos vs sin coincidencias
      if (lista.length === 0) {
        const hayFiltro = buscador.value.trim() !== "" || filtroActual !== "todos";
        const msg = hayFiltro
          ? '<i class="bi bi-search"></i>No se encontraron proveedores con los filtros seleccionados.' +
            '<br><button class="btn btn-sm btn-outline-primary mt-2" onclick="limpiarFiltros()">Limpiar filtros</button>'
          : '<i class="bi bi-inbox"></i>Todavía no hay proveedores registrados.';
        document.getElementById("tablaProveedores").innerHTML =
          '<tr><td colspan="8"><div class="empty-state">' + msg + '</div></td></tr>';
        infoPagina.textContent = "";
        btnAnterior.disabled = true;
        btnSiguiente.disabled = true;
        actualizarIconosOrden();
        return;
      }

      let filas = "";
      pagina.forEach(p => {
        const estado = p.Activo
          ? '<span class="badge-estado badge-activo"><i class="bi bi-check-circle"></i> Activo</span>'
          : '<span class="badge-estado badge-inactivo"><i class="bi bi-x-circle"></i> Inactivo</span>';

        let acciones = "";
        if (esAdmin) {
          acciones += '<a class="btn btn-sm btn-outline-primary me-1" title="Editar" aria-label="Editar proveedor" href="ProveedorForm.html?id=' + p.Id + '"><i class="bi bi-pencil"></i></a>';
          if (p.Activo) {
            acciones += '<button class="btn btn-sm btn-outline-danger" title="Dar de baja" aria-label="Dar de baja" onclick="darDeBaja(' + p.Id + ')"><i class="bi bi-arrow-down-circle"></i></button>';
          } else {
            acciones += '<button class="btn btn-sm btn-outline-success" title="Reactivar" aria-label="Reactivar" onclick="activar(' + p.Id + ')"><i class="bi bi-arrow-up-circle"></i></button>';
          }
        } else {
          acciones = '<span class="text-muted small"><i class="bi bi-eye"></i> Solo lectura</span>';
        }

        // Teléfono clickeable
        const tel = p.Telefono
          ? '<a class="link-contacto" href="tel:' + esc(String(p.Telefono).replace(/[^0-9+]/g, "")) + '">' + esc(p.Telefono) + '</a>'
          : '<span class="text-muted">—</span>';

        const claseFila = p.Activo ? "" : ' class="fila-inactiva"';

        filas += '<tr' + claseFila + '>' +
          '<td><strong>#' + p.Id + '</strong></td>' +
          '<td>' + esc(p.Cuit) + '</td>' +
          '<td>' + esc(p.RazonSocial) + '</td>' +
          '<td>' + esc(p.CondicionIva || "—") + '</td>' +
          '<td>' + esc(p.Provincia || "—") + '</td>' +
          '<td>' + tel + '</td>' +
          '<td class="text-center">' + estado + '</td>' +
          '<td class="text-center">' + acciones + '</td>' +
        '</tr>';
      });

      document.getElementById("tablaProveedores").innerHTML = filas;

      infoPagina.textContent = "Página " + paginaActual + " de " + totalPaginas +
                               " (" + lista.length + " resultado" + (lista.length === 1 ? "" : "s") + ")";
      btnAnterior.disabled = (paginaActual <= 1);
      btnSiguiente.disabled = (paginaActual >= totalPaginas);
      actualizarIconosOrden();
    }

    function actualizarIconosOrden() {
      document.querySelectorAll("th.sortable").forEach(th => {
        const icon = th.querySelector(".sort-icon");
        const col = th.getAttribute("data-col");
        if (col === ordenCol) {
          icon.className = "bi sort-icon activo " + (ordenAsc ? "bi-sort-down-alt" : "bi-sort-up-alt");
        } else {
          icon.className = "bi bi-arrow-down-up sort-icon";
        }
      });
    }

    /* ============ Baja lógica con confirmación ============ */
    function darDeBaja(id) {
      const p = proveedores.find(x => x.Id === id);
      if (!p) return;

      Swal.fire({
        title: "¿Dar de baja al proveedor?",
        html: '<div style="text-align:left;">' +
              '<strong>' + esc(p.RazonSocial) + '</strong><br>' +
              '<span class="text-muted">CUIT: ' + esc(p.Cuit) + '</span><br><br>' +
              'El proveedor quedará inactivo y no aparecerá al cargar pedidos, ' +
              'pero <strong>conservará todo su historial</strong>. Podés reactivarlo cuando quieras.' +
              '</div>',
        icon: "question",
        showCancelButton: true,
        confirmButtonColor: "#c0392b",
        confirmButtonText: "Sí, dar de baja",
        cancelButtonText: "Cancelar"
      }).then(result => {
        if (!result.isConfirmed) return;
        fetchAuth(apiProveedor + "/" + id, { method: "DELETE" }).then(r => {
          if (!r.ok) return obtenerMensajeError(r, "No se pudo dar de baja el proveedor.").then(m => { throw new Error(m); });
          Swal.fire({ icon: "success", title: "Proveedor dado de baja", timer: 1500, showConfirmButton: false });
          listar();
        }).catch(mostrarError);
      });
    }

    /* ============ Reactivación con confirmación ============ */
    function activar(id) {
      const p = proveedores.find(x => x.Id === id);
      if (!p) return;

      Swal.fire({
        title: "¿Reactivar proveedor?",
        html: '<div style="text-align:left;">' +
              '<strong>' + esc(p.RazonSocial) + '</strong><br>' +
              '<span class="text-muted">CUIT: ' + esc(p.Cuit) + '</span><br><br>' +
              'El proveedor volverá a estar disponible para cargar pedidos.' +
              '</div>',
        icon: "question",
        showCancelButton: true,
        confirmButtonColor: "#1f7a1f",
        confirmButtonText: "Sí, reactivar",
        cancelButtonText: "Cancelar"
      }).then(result => {
        if (!result.isConfirmed) return;
        fetchAuth(apiProveedor + "/" + id + "/Activar", { method: "PUT" }).then(r => {
          if (!r.ok) return obtenerMensajeError(r, "No se pudo reactivar el proveedor.").then(m => { throw new Error(m); });
          Swal.fire({ icon: "success", title: "Proveedor reactivado", timer: 1500, showConfirmButton: false });
          listar();
        }).catch(mostrarError);
      });
    }

    /* ============ Limpiar filtros ============ */
    function limpiarFiltros() {
      buscador.value = "";
      filtroActual = "todos";
      paginaActual = 1;
      document.querySelectorAll("[data-filtro]").forEach(b => b.classList.remove("active"));
      document.querySelector('[data-filtro="todos"]').classList.add("active");
      render();
    }

    /* ============ Eventos ============ */
    document.querySelectorAll("[data-filtro]").forEach(btn => {
      btn.addEventListener("click", function () {
        document.querySelectorAll("[data-filtro]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filtroActual = btn.getAttribute("data-filtro");
        paginaActual = 1;
        render();
      });
    });

    document.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", function () {
        const col = th.getAttribute("data-col");
        if (ordenCol === col) ordenAsc = !ordenAsc;
        else { ordenCol = col; ordenAsc = true; }
        paginaActual = 1;
        render();
      });
    });

    buscador.addEventListener("input", () => { paginaActual = 1; render(); });
    btnLimpiar.addEventListener("click", limpiarFiltros);
    btnAnterior.addEventListener("click", () => { if (paginaActual > 1) { paginaActual--; render(); } });
    btnSiguiente.addEventListener("click", () => { paginaActual++; render(); });

    window.onload = listar;
  </script>
</body>
</html>
