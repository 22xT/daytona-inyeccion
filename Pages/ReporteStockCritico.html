<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reporte de Stock Crítico - Daytona Inyección</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <style>
    .stat-icon.orange { color:#c0631c; background:#fdeede; }
    .badge-sin { background:#c0392b; color:#fff; padding:3px 10px; border-radius:10px; font-size:0.75rem; font-weight:600; }
    .badge-bajo { background:#f39c12; color:#fff; padding:3px 10px; border-radius:10px; font-size:0.75rem; font-weight:600; }
    tr.fila-sin { background:#fdeaea; }
  </style>
</head>

<body data-page="reportes">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="header-bar">
      <div>
        <h2><i class="bi bi-exclamation-triangle"></i> Reporte de Stock Crítico</h2>
        <span class="subtitle">Repuestos que alcanzaron o cayeron por debajo del stock mínimo</span>
      </div>
      <button class="btn btn-success" id="btnExcel">
        <i class="bi bi-file-earmark-excel"></i> Exportar a Excel
      </button>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon red"><i class="bi bi-x-circle"></i></div>
          <div>
            <p class="stat-value" id="numSin">—</p>
            <p class="stat-label">Sin stock</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon orange"><i class="bi bi-exclamation-triangle"></i></div>
          <div>
            <p class="stat-value" id="numBajo">—</p>
            <p class="stat-label">Bajo el mínimo</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon blue"><i class="bi bi-box-seam"></i></div>
          <div>
            <p class="stat-value" id="numTotal">—</p>
            <p class="stat-label">Total a reponer</p>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header" id="panelHeader"><i class="bi bi-list-ul"></i> Repuestos a reponer</div>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Código</th>
              <th>Descripción</th>
              <th>Marca</th>
              <th>Rubro</th>
              <th class="text-center">Stock</th>
              <th class="text-center">Mínimo</th>
              <th class="text-center">Faltante</th>
              <th class="text-center">Estado</th>
            </tr>
          </thead>
          <tbody id="tabla">
            <tr><td colspan="8" class="text-center p-4">
              <span class="spinner-border spinner-border-sm text-primary"></span> Cargando reporte…
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="layout.js"></script>
  <script>
    if (!Auth.requireSession()) { /* redirect */ }

    const apiReporte = API_BASE + "Reporte/StockCritico";
    let datos = [];

    function esc(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    function cargar() {
      fetchAuth(apiReporte).then(r => {
        if (!r.ok) throw new Error("No se pudo cargar el reporte.");
        return r.json();
      }).then(data => {
        datos = data;
        render();
      }).catch(err => {
        document.getElementById("tabla").innerHTML =
          '<tr><td colspan="8" class="text-center text-danger p-4">' + esc(err.message) +
          ' <button class="btn btn-sm btn-outline-danger ms-2" onclick="cargar()">Reintentar</button></td></tr>';
      });
    }

    function render() {
      const sin = datos.filter(d => d.Estado === "SIN STOCK").length;
      const bajo = datos.filter(d => d.Estado === "BAJO MÍNIMO").length;
      document.getElementById("numSin").textContent = sin;
      document.getElementById("numBajo").textContent = bajo;
      document.getElementById("numTotal").textContent = datos.length;
      document.getElementById("panelHeader").innerHTML =
        '<i class="bi bi-list-ul"></i> Repuestos a reponer (' + datos.length + ')';

      const tbody = document.getElementById("tabla");
      if (datos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-success p-4">' +
          '<i class="bi bi-check-circle"></i> No hay repuestos en estado crítico. Todo el stock está por encima del mínimo.</td></tr>';
        return;
      }

      let html = "";
      datos.forEach(d => {
        const esSin = d.Estado === "SIN STOCK";
        const badge = esSin
          ? '<span class="badge-sin"><i class="bi bi-x-circle"></i> Sin stock</span>'
          : '<span class="badge-bajo"><i class="bi bi-exclamation-triangle"></i> Bajo mínimo</span>';
        html += '<tr' + (esSin ? ' class="fila-sin"' : '') + '>' +
          '<td><strong>' + esc(d.Codigo) + '</strong></td>' +
          '<td>' + esc(d.Descripcion) + '</td>' +
          '<td>' + esc(d.Marca || "-") + '</td>' +
          '<td>' + esc(d.Rubro || "-") + '</td>' +
          '<td class="text-center">' + d.StockActual + '</td>' +
          '<td class="text-center">' + d.StockMinimo + '</td>' +
          '<td class="text-center"><strong>' + d.Faltante + '</strong></td>' +
          '<td class="text-center">' + badge + '</td>' +
        '</tr>';
      });
      tbody.innerHTML = html;
    }

    function exportarExcel() {
      if (datos.length === 0) {
        Swal.fire("Sin datos", "No hay repuestos críticos para exportar.", "info");
        return;
      }
      const filas = datos.map(d => ({
        "Código": d.Codigo,
        "Descripción": d.Descripcion,
        "Marca": d.Marca || "",
        "Rubro": d.Rubro || "",
        "Stock actual": d.StockActual,
        "Stock mínimo": d.StockMinimo,
        "Faltante": d.Faltante,
        "Estado": d.Estado
      }));
      const ws = XLSX.utils.json_to_sheet(filas);
      ws["!cols"] = [{wch:12},{wch:45},{wch:14},{wch:32},{wch:12},{wch:12},{wch:10},{wch:14}];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Stock Crítico");
      const hoy = new Date().toISOString().slice(0,10);
      XLSX.writeFile(wb, "StockCritico_Daytona_" + hoy + ".xlsx");
    }

    document.getElementById("btnExcel").addEventListener("click", exportarExcel);
    window.onload = cargar;
  </script>
</body>
</html>
