          didOpen: function () { activarInputPrecio("ePrecio"); activarInputPrecio("eSena"); Telefono.activar(document.getElementById("eTel")); document.getElementById("eNom").focus(); },
          preConfirm: function () {
            var datos = {
              nombre: document.getElementById("eNom").value.trim(),
              tel: document.getElementById("eTel").value.trim(),
              cant: parseInt(document.getElementById("eCant").value, 10),
              precio: precioANumero(document.getElementById("ePrecio").value) || 0,
              sena: precioANumero(document.getElementById("eSena").value) || 0,
              medio: parseInt(document.getElementById("eMedio").value, 10),
              obs: document.getElementById("eObs").value.trim(),
              idProv: ops ? parseInt(document.getElementById("eProv").value, 10) : null,
              idRubro: rubroElegido()
            };
            if (document.getElementById("swRubro") && !datos.idRubro) { Swal.showValidationMessage("Elegí un rubro."); return false; }
            if (datos.nombre.length < 2) { Swal.showValidationMessage("Falta el nombre del cliente."); return false; }
            var errTel = Telefono.validar(datos.tel, true);   // se le avisa por WhatsApp
            if (errTel) { Swal.showValidationMessage(errTel); return false; }
            datos.tel = Telefono.formatear(datos.tel);
            if (!(datos.cant > 0)) { Swal.showValidationMessage("Revisá la cantidad."); return false; }
            if (datos.precio <= 0) { Swal.showValidationMessage("Indicá el precio que le pasaste al cliente."); return false; }
            if (datos.sena > datos.cant * datos.precio + 0.01) { Swal.showValidationMessage("La seña no puede superar el total."); return false; }
            return accion(datos).catch(function (err) {
              Swal.showValidationMessage(err.message || "No se pudo tomar el encargo."); return false;
            });
          }
        }).then(function (res) {
          if (!res.isConfirmed || !res.value) return;
          var d = res.value;
          Swal.fire({ icon: "success", title: "Encargo #" + d.IdEncargo + " tomado",
            html: (d.IdPedido ? "Sumado al pedido N° " + d.IdPedido + " (en armado).<br>" : "") +
                  (d.LlegadaEstimada ? "Llega aprox. el <strong>" + llegadaTexto(d.LlegadaEstimada) + "</strong> si el pedido se envía hoy." : ""),
            showCancelButton: true, confirmButtonText: "Seguir buscando", cancelButtonText: "Ver encargos" })
            .then(function (r2) { if (r2.dismiss === Swal.DismissReason.cancel) window.location.href = "Encargos.html"; });
        });
      });
    }

    function enviarEncargo(datos, idRepuesto, idProveedor) {
      return fetchAuth(api + "Encargos", {
        method: "POST",
        body: JSON.stringify({
          Nombre: datos.nombre, Telefono: datos.tel, Observacion: datos.obs || null,
          Lineas: [{ IdRepuesto: idRepuesto, Cantidad: datos.cant, PrecioPactado: datos.precio }],
          MontoSena: datos.sena > 0 ? datos.sena : null,
          IdMedioSena: datos.sena > 0 ? datos.medio : null,
          IdProveedorPedido: idProveedor
        })
      }).then(function (r) {
        if (!r.ok) return leerError(r).then(function (m) { throw new Error(m); });
        return r.json();
      });
    }

    /* ================= PRESUPUESTO / VENTA EN ARMADO (28/10) =================
       "Presupuestar" (o "Vender", si hay stock) junta los repuestos que pide
       el cliente que está en el mostrador, también los que NO tenemos.
       Se guardan en este navegador y pasan a la Venta, donde se confirma la
       venta o se hace el presupuesto (lo que no hay queda "a pedido"). */
    var CLAVE_ARMADO = "daytona.ventaEnArmado";
    function leerArmado() {
      try { var v = JSON.parse(localStorage.getItem(CLAVE_ARMADO)); return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }
    function guardarArmado(lista) {
      try { localStorage.setItem(CLAVE_ARMADO, JSON.stringify(lista)); } catch (e) { }
      pintarArmado();
    }
    function sumarArmado(item) {
      var lista = leerArmado();
      var ex = null;
      for (var i = 0; i < lista.length; i++) if (lista[i].IdRepuesto === item.IdRepuesto) { ex = lista[i]; break; }
      if (ex) ex.Cantidad += 1;
      else lista.push({ IdRepuesto: item.IdRepuesto, Cantidad: 1, Descripcion: item.Descripcion, Precio: item.Precio, Stock: item.Stock });
      guardarArmado(lista);
      var bar = document.getElementById("armado");
      bar.classList.remove("pulso"); void bar.offsetWidth; bar.classList.add("pulso");
    }
    function quitarArmado(id) {
      guardarArmado(leerArmado().filter(function (x) { return x.IdRepuesto !== id; }));
    }
    function vaciarArmado() {
      try { localStorage.removeItem(CLAVE_ARMADO); } catch (e) { }
      pintarArmado();
    }
    function aPedido(x) { return (Number(x.Stock) || 0) < x.Cantidad; }
    function pintarArmado() {
      var lista = leerArmado();
      var bar = document.getElementById("armado"), pop = document.getElementById("armadoLista");
      bar.hidden = lista.length === 0;
      document.body.classList.toggle("con-armado", lista.length > 0);
      if (!lista.length) { pop.hidden = true; return; }
      var unidades = 0, total = 0, faltan = false;
      lista.forEach(function (x) { unidades += x.Cantidad; total += x.Cantidad * (Number(x.Precio) || 0); if (aPedido(x)) faltan = true; });
      document.getElementById("armadoTitulo").textContent = faltan ? "Presupuesto en armado" : "Venta en armado";
      document.getElementById("armadoResumen").textContent = unidades + " repuesto" + (unidades === 1 ? "" : "s") + " · " + formatearMoneda(total);
      document.getElementById("armadoIr").textContent = faltan ? "Hacer el presupuesto" : "Ir a la venta";
      document.getElementById("armadoIrCorto").textContent = faltan ? "Presupuesto" : "Venta";
      pop.innerHTML = lista.map(function (x) {
        return '<div class="al-fila"><div class="al-desc" title="' + escapeHtml(x.Descripcion) + '">' + escapeHtml(x.Descripcion) +
          '<small>' + (aPedido(x) ? 'a pedido (no hay en el local)' : 'hay en el local') + '</small></div>' +
          '<div class="precio-sub">' + x.Cantidad + ' × ' + formatearMoneda(Number(x.Precio) || 0) + '</div>' +
          '<button type="button" class="quitar" onclick="quitarArmado(' + x.IdRepuesto + ')" title="Sacar" aria-label="Sacar"><i class="bi bi-x-lg"></i></button></div>';
      }).join("") +
      '<div class="al-pie"><span>Las cantidades se ajustan en la venta.</span><button type="button" onclick="vaciarArmado()">Vaciar</button></div>';
    }
    function toggleListaArmado() {
      var pop = document.getElementById("armadoLista");
      pop.hidden = !pop.hidden;
      document.getElementById("armadoVer").setAttribute("aria-expanded", pop.hidden ? "false" : "true");
    }
    function irALaVenta() { window.location.href = "CargarVenta.html?armado=1"; }

    function presupuestarPropio(id) {
      var r = propiosActuales.find(function (x) { return x.Id === id; });
      if (!r) return;
      sumarArmado({ IdRepuesto: r.Id, Descripcion: r.Descripcion, Precio: Number(r.PrecioDeVenta) || 0, Stock: r.Disponible !== undefined ? r.Disponible : (Number(r.Stock) || 0) });
    }

    // Un articulo que solo esta en la lista del proveedor se suma al catalogo
    // (stock 0, minimo 0: igual que al encargarlo) y va al presupuesto
    function presupuestarExterno(i) {
      var ext = externosActuales[i];
      if (!ext) return;
      cargarRubros().then(function () {
        if (!necesitaRubro(ext)) return asegurarRepuesto(ext, null);
        return Swal.fire({
          title: "¿En qué rubro va?",
          html: '<div style="text-align:left;font-size:0.9rem;"><p class="mb-2">' + escapeHtml(ext.Descripcion) +
                ' · <strong>' + escapeHtml(ext.Proveedor) + '</strong></p>' + rubroSelectHtml(ext) + '</div>',
          showCancelButton: true, confirmButtonText: "Sumar al presupuesto", cancelButtonText: "Cancelar", confirmButtonColor: "#0d3b78",
          preConfirm: function () {
            var idRubro = rubroElegido();
            if (!idRubro) { Swal.showValidationMessage("Elegí un rubro."); return false; }
            return asegurarRepuesto(ext, idRubro).catch(function (err) {
              Swal.showValidationMessage(err.message || "No se pudo sumar."); return false;
            });
          }
        }).then(function (res) { return res.isConfirmed ? res.value : null; });
      }).then(function (idRep) {
        if (!idRep) return;
        sumarArmado({ IdRepuesto: idRep, Descripcion: ext.Descripcion, Precio: Number(ext.PrecioSugerido) || 0, Stock: Number(ext.StockPropio) || 0 });
      }).catch(function (err) {
        Swal.fire("No se pudo sumar", (err && err.message) || "Intentá de nuevo.", "error");
      });
    }

    // Vincular y equivalentes: ver vincular.js

    // Otra marca con stock: se busca por su codigo para verla con todos sus datos
    function irAEquivalente(id) {
      var g = Equivalencias.porId[id];
      var e = (Equivalencias.porGrupo[g] || []).find(function (x) { return x.IdRepuesto === id; });
      if (!e) return;
      var inp = document.getElementById("buscar");
      inp.value = e.Codigo || e.Descripcion;
      buscar(true);
    }

    function refrescarEquivalencias() {
      Equivalencias.cargar().then(function () { buscar(true); });
    }

    /* ================= INICIO ================= */

    function probar(texto) {
      var inp = document.getElementById("buscar");
      inp.value = texto;
      buscar(true);
      inp.focus();
    }

    function limpiar() {
      var inp = document.getElementById("buscar");
      inp.value = "";
      estadoInicial();
      document.getElementById("btnLimpiar").classList.remove("visible");
      inp.focus();
    }

    /* ---------- Ojito: ocultar costos ----------
       Para dar vuelta el monitor y mostrarle al cliente sin que vea lo
       que pagamos. Queda recordado en este navegador. */
    function aplicarCostos(ocultar) {
      document.body.classList.toggle("sin-costos", ocultar);
      var b = document.getElementById("btnCostos");
      if (!b) return;
      var txt = ocultar ? "Mostrar costos" : "Ocultar costos (para mostrarle la pantalla al cliente)";
      b.innerHTML = '<i class="bi ' + (ocultar ? 'bi-eye-slash' : 'bi-eye') + '"></i>';
      b.setAttribute("aria-pressed", ocultar ? "true" : "false");
      b.setAttribute("aria-label", ocultar ? "Mostrar costos" : "Ocultar costos");
      b.setAttribute("title", txt);
      b.setAttribute("data-bs-original-title", txt);
      if (window.bootstrap && bootstrap.Tooltip) {
        var tt = bootstrap.Tooltip.getInstance(b);
        if (tt && tt.setContent) tt.setContent({ ".tooltip-inner": txt });
      }
      try { localStorage.setItem("buscadorSinCostos", ocultar ? "1" : "0"); } catch (e) { }
    }

    var textoDesdeReporte = "";

    window.onload = function () {
      cargarProveedores();
      Equivalencias.cargar();
      armarMarcas([]);
      cargarRubros().then(armarMarcas).catch(function () { });
      pintarBotones();
      cargarCarrito();
      EnCamino.cargar();
      pintarArmado();
      // Si se sumo algo desde otra pestaña, la barra se actualiza sola
      window.addEventListener("storage", function (e) { if (e.key === CLAVE_ARMADO) pintarArmado(); });

      var ocultos = false;
      try { ocultos = localStorage.getItem("buscadorSinCostos") === "1"; } catch (e) { }
      aplicarCostos(ocultos);
      var bc = document.getElementById("btnCostos");
      if (window.bootstrap && bootstrap.Tooltip) bootstrap.Tooltip.getOrCreateInstance(bc);
      bc.addEventListener("click", function () { aplicarCostos(!document.body.classList.contains("sin-costos")); });

      var inp = document.getElementById("buscar");

      // Mientras escribe: busca solo, con una pausa corta
      inp.addEventListener("input", function () {
        document.getElementById("btnLimpiar").classList.toggle("visible", inp.value.length > 0);
        clearTimeout(temporizador);
        temporizador = setTimeout(function () { buscar(false); }, 320);
      });

      // Enter o el boton: busca ya, sin esperar
      document.getElementById("formBuscar").addEventListener("submit", function (e) {
        e.preventDefault();
        clearTimeout(temporizador);
        buscar(true);
      });

      document.getElementById("btnLimpiar").addEventListener("click", limpiar);

      // Esc limpia; "/" vuelve al buscador desde cualquier lado
      document.addEventListener("keydown", function (e) {
        var enCampo = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
        if (e.key === "Escape" && document.activeElement === inp) { limpiar(); }
        if (e.key === "/" && !enCampo && !document.querySelector(".swal2-container")) {
          e.preventDefault(); inp.focus(); inp.select();
        }
      });

      inp.focus();

      // Buscador.html?q=... (desde el reporte de busquedas)
      try {
        var q = new URLSearchParams(location.search).get("q");
        if (q) { textoDesdeReporte = q.trim(); inp.value = q; buscar(true); }
      } catch (e) { }
    };
  </script>
</body>
</html>
