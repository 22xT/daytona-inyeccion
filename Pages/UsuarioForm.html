<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuario - Daytona Inyección</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>

<body data-page="usuarios">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="header-bar">
      <div>
        <h2 id="tituloPagina"><i class="bi bi-person-plus"></i> Nuevo Usuario
          <span class="mode-badge">Alta</span>
        </h2>
        <span class="subtitle">Los campos marcados con * son obligatorios</span>
      </div>
      <a href="UsuariosListado.html" class="btn-back">
        <i class="bi bi-arrow-left"></i> Volver al listado
      </a>
    </div>

    <form id="formUsuario" novalidate>
      <div class="panel">
        <div class="panel-header"><span class="num">1</span> Datos del usuario</div>
        <div class="panel-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombre <span class="required">*</span></label>
              <input type="text" id="nombre" class="form-control" maxlength="100" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Correo <span class="required">*</span></label>
              <input type="email" id="correo" class="form-control" maxlength="150" required placeholder="nombre@dominio.com">
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><span class="num">2</span> Credenciales y rol</div>
        <div class="panel-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Rol <span class="required">*</span></label>
              <select id="idRol" class="form-select" required>
                <option value="">Seleccionar...</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">
                Contraseña <span id="lblObligatoria" class="required">*</span>
              </label>
              <div class="input-group">
                <input type="password" id="clave" class="form-control" minlength="8" maxlength="100">
                <button class="btn btn-outline-secondary" type="button" id="btnVerClave" tabindex="-1">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div class="form-text" id="ayudaPass">Mínimo 8 caracteres.</div>
              <div class="form-text d-none" id="ayudaEditar">Dejar vacío para no cambiar la contraseña.</div>
            </div>
          </div>
        </div>
      </div>

      <input type="hidden" id="id">

      <div class="actions">
        <a href="UsuariosListado.html" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save"></i> Guardar
        </button>
      </div>
    </form>
  </div>

  <script src="layout.js"></script>
  <script>
    if (!Auth.requireSession()) { /* redirect */ }

    const apiUsuario = API_BASE + "Usuario";
    const apiRol = API_BASE + "Rol";
    const usuario = Auth.getUsuario();
    const esAdmin = usuario && usuario.Rol === "Administrador";

    if (!esAdmin) {
      Swal.fire({ icon: "error", title: "Acceso denegado", text: "Solo administradores." })
        .then(() => window.location.href = "UsuariosListado.html");
    }

    const f = {
      id: document.getElementById("id"),
      nombre: document.getElementById("nombre"),
      correo: document.getElementById("correo"),
      idRol: document.getElementById("idRol"),
      clave: document.getElementById("clave")
    };

    const params = new URLSearchParams(window.location.search);
    const idUsuario = params.get("id");
    const esEdicion = idUsuario !== null;

    function mostrarError(err) {
      if (err && (err.message === "401 Unauthorized" || err.message === "403 Forbidden")) return;
      Swal.fire("Error", (err && err.message) || "Ocurrió un error.", "error");
    }
    function obtenerMensajeError(response, defecto) {
      return response.json().then(err => err && err.Message ? err.Message : defecto).catch(() => defecto);
    }

    function toggleClave() {
      const icon = document.querySelector('#btnVerClave i');
      if (f.clave.type === 'password') {
        f.clave.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        f.clave.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    function validar(u, esEdicion) {
      if (u.Nombre === "") return "Debe ingresar el nombre.";
      if (u.Correo === "") return "Debe ingresar el correo.";
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u.Correo)) return "El correo no es válido.";
      if (!u.IdRol || u.IdRol <= 0) return "Debe seleccionar un rol.";
      if (!esEdicion) {
        if (u.ClaveHash === "") return "Debe ingresar una contraseña.";
        if (u.ClaveHash.length < 8) return "La contraseña debe tener al menos 8 caracteres.";
      } else {
        if (u.ClaveHash !== "" && u.ClaveHash.length < 8)
          return "La contraseña debe tener al menos 8 caracteres.";
      }
      return "";
    }

    function cargarRoles() {
      return fetchAuth(apiRol).then(r => {
        if (!r.ok) throw new Error("No se pudo cargar la lista de roles.");
        return r.json();
      }).then(data => {
        data.filter(r => r.Activo).forEach(r => {
          const opt = document.createElement("option");
          opt.value = r.Id;
          opt.textContent = r.Nombre;
          f.idRol.appendChild(opt);
        });
      });
    }

    function cargarUsuario(id) {
      return fetchAuth(apiUsuario + "/" + id).then(r => {
        if (!r.ok) throw new Error("No se pudo cargar el usuario.");
        return r.json();
      }).then(data => {
        const u = data[0];
        if (!u) {
          return Swal.fire("Atención", "No se encontró.", "warning")
            .then(() => window.location.href = "UsuariosListado.html");
        }
        f.id.value = u.Id || "";
        f.nombre.value = u.Nombre || "";
        f.correo.value = u.Correo || "";
        f.idRol.value = u.IdRol || "";
      });
    }

    function guardar(e) {
      e.preventDefault();
      const usuarioObj = {
        Id: f.id.value.trim() === "" ? 0 : parseInt(f.id.value.trim()),
        Nombre: f.nombre.value.trim(),
        Correo: f.correo.value.trim(),
        IdRol: parseInt(f.idRol.value || "0"),
        ClaveHash: f.clave.value
      };
      const error = validar(usuarioObj, esEdicion);
      if (error !== "") { Swal.fire("Atención", error, "warning"); return; }

      const metodo = esEdicion ? "PUT" : "POST";
      const url = esEdicion ? apiUsuario + "/" + usuarioObj.Id : apiUsuario;

      fetchAuth(url, { method: metodo, body: JSON.stringify(usuarioObj) }).then(r => {
        if (!r.ok) return obtenerMensajeError(r, "No se pudo guardar.").then(m => { throw new Error(m); });
        Swal.fire({ icon: "success", title: "Guardado", timer: 1200, showConfirmButton: false })
          .then(() => window.location.href = "UsuariosListado.html");
      }).catch(mostrarError);
    }

    window.onload = function () {
      document.getElementById("formUsuario").addEventListener("submit", guardar);
      document.getElementById("btnVerClave").addEventListener("click", toggleClave);

      cargarRoles().then(() => {
        if (esEdicion) {
          document.getElementById("tituloPagina").innerHTML =
            '<i class="bi bi-pencil-square"></i> Editar Usuario <span class="mode-badge">Edición</span>';
          document.getElementById("lblObligatoria").classList.add('d-none');
          document.getElementById("ayudaPass").classList.add('d-none');
          document.getElementById("ayudaEditar").classList.remove('d-none');
          f.clave.removeAttribute("required");
          cargarUsuario(idUsuario);
        } else {
          f.nombre.focus();
        }
      }).catch(mostrarError);
    };
  </script>
</body>
</html>
