    /* ================= DESCUENTO Y FORMA DE PAGO ================= */

    // Los escalones salen de la configuracion. Si no se pueden leer,
    // se usan los valores por defecto: la venta no se puede frenar
    // porque falle una consulta de parametros.
    function cargarParametrosVenta() {
      return fetchAuth(apiConfiguracion + "/Venta")
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (p) {
          if (!p) return;
          if (p.DescuentosPublico) {
            var lista = String(p.DescuentosPublico).split(",")
              .map(function (x) { return parseFloat(x.trim()); })
              .filter(function (x) { return !isNaN(x) && x > 0 && x <= 100; });
            if (lista.length > 0) descuentosPublico = lista;
          }
          var dm = parseFloat(p.DescuentoMecanico);
          if (!isNaN(dm)) descuentoMecanico = dm;
        })
        .catch(function () { /* se usan los valores por defecto */ });
    }

    function pintarBotonesDescuento() {
      var cont = document.getElementById("botonesDescuento");
      var esMecanico = tipoCliente === "mecanico";

      // El mecanico tiene un descuento fijo: no se le ofrecen escalones.
      var valores = esMecanico ? [descuentoMecanico] : descuentosPublico;

      var html = '<button type="button" class="btn-desc' +
                 (descuentoActual === 0 ? ' activo' : '') +
                 '" onclick="setDescuento(0)">Sin</button>';

      valores.forEach(function (v) {
        html += '<button type="button" class="btn-desc' +
                (descuentoActual === v ? ' activo' : '') +
                '" onclick="setDescuento(' + v + ')">' + v + '%</button>';
      });

      cont.innerHTML = html;
    }

    function setDescuento(v) {
      descuentoActual = v;
      pintarBotonesDescuento();
      renderCarrito();
    }

    // La forma de pago ahora se elige en el modal de cobro. Se conservan
    // estas funciones porque las llaman otras partes de la pantalla.
    function setFormaPago(fp) { formaPago = fp; }

    function clienteTieneCuentaCorriente() {
      return !!(clienteElegido && (clienteElegido.CuentaCorriente === true ||
                                   clienteElegido.CuentaCorriente === 1));
    }

    function actualizarOpcionCredito() { /* se evalua en el modal de cobro */ }

    // El saldo se muestra al lado del nombre. No bloquea nada: informar
    // no es lo mismo que restringir, y la decision de seguir fiando es
    // del mostrador.
    function cargarSaldoCliente() {
      saldoCliente = null;
      creditoCliente = null;
      if (!clienteElegido) { pintarChipCliente(); return; }

      fetchAuth(apiCuentaCorriente + "/" + clienteElegido.Id)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (d && d[0]) saldoCliente = Number(d[0].Saldo);
          pintarChipCliente();
        })
        .catch(function () { pintarChipCliente(); });

      // Limite y deuda atrasada (script 82). Si la API vieja no lo tiene, no pasa nada.
      var idPedido = clienteElegido.Id;
      fetchAuth(API_BASE + "Cliente/" + idPedido + "/Credito")
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!clienteElegido || clienteElegido.Id !== idPedido) return;
          creditoCliente = d && d.Situacion && d.Situacion[0] ? d.Situacion[0] : null;
          pintarChipCliente();
        })
        .catch(function () { });
    }

    // Que pasaria con el credito si queda "falta" en cuenta corriente
    function problemaCredito(falta) {
      if (!creditoCliente || !(falta > 0.009)) return null;
      var c = creditoCliente, partes = [];
      var lim = c.LimiteCredito;
      if (lim !== null && lim !== undefined && Number(c.Saldo) + falta > Number(lim) + 0.01)
        partes.push("Con esta venta debería " + formatearMoneda(Number(c.Saldo) + falta) + " y su límite es " + formatearMoneda(lim) + ".");
      if (Number(c.DiasMaximo) > 0 && Number(c.DiasAtraso) > Number(c.DiasMaximo))
        partes.push("Tiene deuda sin pagar hace " + c.DiasAtraso + " días (el máximo es " + c.DiasMaximo + ").");
      return partes.length ? partes.join(" ") : null;
    }

    /* ================= CONVERSIÓN DESDE PRESUPUESTO ================= */

    // Web API serializa DataSet distinto segun version: array de tablas
    // o { Table: [...], Table1: [...] }. Se contemplan las dos.
    function partirDataSet(ds) {
      var tablas = Array.isArray(ds) ? ds : (ds && ds.Table ? [ds.Table, ds.Table1 || []] : []);
      var cab = (tablas[0] && tablas[0][0]) ? tablas[0][0] : null;
      return { cabecera: cab, detalle: tablas[1] || [] };
    }

    function idPresupuestoDeLaUrl() {
      var m = window.location.search.match(/[?&]presupuesto=(\d+)/);
      return m ? parseInt(m[1], 10) : null;
    }

    function cargarDesdePresupuesto(id) {
      fetchAuth(apiPresupuesto + "/" + id).then(function (r) {
        if (!r.ok) return leerError(r).then(function (m) { throw new Error(m); });
        return r.json();
      }).then(function (ds) {
        var d = partirDataSet(ds);
        if (!d.cabecera) throw new Error("No se encontró el presupuesto.");
        if (d.cabecera.Estado === "Anulado") throw new Error("El presupuesto está anulado.");
        if (d.cabecera.Estado === "Convertido") throw new Error("Ese presupuesto ya se convirtió en venta.");

        presupuestoOrigen = { Id: d.cabecera.Id, Numero: d.cabecera.Numero };

        // Tipo de cliente y datos, tal como se presupuestó
        setTipo(d.cabecera.TipoCliente === "Mecanico" ? "mecanico" : "publico");
        if (d.cabecera.IdCliente) {
          clienteElegido = todosClientes.find(function (c) { return c.Id === d.cabecera.IdCliente; }) || null;
          pintarChipCliente();
        }

        // Armado del carrito, respetando el precio presupuestado
        var sinStock = [];
        var ajustados = [];
        var cambiaronPrecio = [];

        carrito = [];
        d.detalle.forEach(function (r) {
          var rep = todosRepuestos.find(function (x) { return x.Id === r.IdRepuesto; });
          var stock = rep && rep.StockActual !== undefined ? rep.StockActual : 0;

          if (stock <= 0) { sinStock.push(r.Descripcion); return; }

          var cant = r.Cantidad;
          if (cant > stock) { ajustados.push(r.Descripcion + " (" + r.Cantidad + " → " + stock + ")"); cant = stock; }

          if (r.PrecioActual !== undefined &&
              Math.abs(Number(r.PrecioActual) - Number(r.PrecioUnitario)) > 0.009) {
            cambiaronPrecio.push(r.Descripcion);
          }

          carrito.push({
            IdRepuesto: r.IdRepuesto,
            Codigo: r.Codigo || "",
            Descripcion: r.Descripcion,
            // Se respeta el precio del presupuesto: para eso se emitió
            PrecioUnitario: Number(r.PrecioUnitario),
            Cantidad: cant,
            StockActual: stock,
            StockMinimo: (rep && rep.StockMinimo) || 5
          });
        });

        renderCarrito();

        document.getElementById("bannerPresup").style.display = "flex";
        document.getElementById("bannerPresupTexto").textContent =
          "Convirtiendo el presupuesto N° " + d.cabecera.Numero +
          " — se respetan los precios presupuestados";

        // Avisos solo si hubo algo raro
        var avisos = [];
        if (sinStock.length > 0)
          avisos.push("<strong>Sin stock, quedaron fuera:</strong><br>" + sinStock.join("<br>"));
        if (ajustados.length > 0)
          avisos.push("<strong>Cantidad ajustada al stock:</strong><br>" + ajustados.join("<br>"));
        if (cambiaronPrecio.length > 0)
          avisos.push("<strong>Cambiaron de precio desde que se presupuestó:</strong><br>" +
                      cambiaronPrecio.join("<br>") +
                      "<br><em>Se mantiene el precio presupuestado.</em>");
        if (d.cabecera.Estado === "Vencido")
          avisos.unshift("<strong>El presupuesto está vencido</strong> (venció el " +
                         new Date(d.cabecera.FechaVencimiento).toLocaleDateString("es-AR") + ").");

        if (avisos.length > 0) {
          Swal.fire({
            icon: "warning",
            title: "Revisá antes de confirmar",
            html: "<div style='text-align:left;font-size:0.86rem;'>" + avisos.join("<hr>") + "</div>",
            width: 520
          });
        }
      }).catch(function (err) {
        Swal.fire("No se pudo cargar el presupuesto", err.message || "Error de conexión.", "error");
      });
    }

    /* ================= ENTREGA DE UN ENCARGO =================
       Se llega desde Encargos con ?encargo=N. El carrito se arma con lo
       encargado al precio pactado, y en el cobro la seña ya figura como
       pagada (medio "Seña aplicada"). Al registrar, el servidor cierra
       el encargo en la misma operación. */

    function idEncargoDeLaUrl() {
      var m = window.location.search.match(/[?&]encargo=(\d+)/);
      return m ? parseInt(m[1], 10) : null;
    }

    function cargarDesdeEncargo(id) {
      fetchAuth(API_BASE + "Encargos/" + id).then(function (r) {
        if (!r.ok) return leerError(r).then(function (m) { throw new Error(m); });
        return r.json();
      }).then(function (d) {
        var cab = d.Encargo && d.Encargo[0];
        if (!cab) throw new Error("No se encontró el encargo.");
        if (cab.Estado === "ENTREGADO") throw new Error("Ese encargo ya fue entregado.");
        if (cab.Estado === "CANCELADO") throw new Error("Ese encargo está cancelado.");

        encargoOrigen = { Id: cab.Id, Nombre: cab.Nombre, Telefono: cab.Telefono,
                          Sena: Number(cab.Sena) || 0, IdMedioSen: cab.IdMedioSen };

        if (cab.IdCliente) {
          clienteElegido = todosClientes.find(function (c) { return c.Id === cab.IdCliente; }) || null;
          pintarChipCliente();
        }

        // Lo reservado para ESTE encargo es justamente lo que se entrega
        (d.Renglones || []).forEach(function (r) {
          var rep = todosRepuestos.find(function (x) { return x.Id === r.IdRepuesto; });
          if (rep) {
            rep.Reservado = Math.max(0, (rep.Reservado || 0) - r.Cantidad);
            rep.StockActual = Math.max(0, (rep.StockFisico || 0) - rep.Reservado);
          }
        });

        var faltan = [];
        carrito = [];
        (d.Renglones || []).forEach(function (r) {
          var rep = todosRepuestos.find(function (x) { return x.Id === r.IdRepuesto; });
          var stock = rep && rep.StockActual !== undefined ? rep.StockActual : 0;
          var cant = Math.min(r.Cantidad, stock);
          if (cant < r.Cantidad) faltan.push(r.Descripcion + " (encargado " + r.Cantidad + ", hay " + stock + ")");
          if (cant <= 0) return;
          carrito.push({
            IdRepuesto: r.IdRepuesto, Codigo: r.Codigo || "", Descripcion: r.Descripcion,
            // Se respeta el precio que se le dijo al cliente
            PrecioUnitario: Number(r.PrecioPactado), Cantidad: cant,
            StockActual: stock, StockMinimo: (rep && rep.StockMinimo) || 5
          });
        });
        renderCarrito();

        document.getElementById("bannerPresup").style.display = "flex";
        document.getElementById("bannerPresupTexto").textContent =
          "Entregando el encargo #" + cab.Id + " de " + cab.Nombre +
          (encargoOrigen.Sena > 0 ? " — seña ya cobrada: " + formatearMoneda(encargoOrigen.Sena) : "");

        if (faltan.length > 0)
          Swal.fire({ icon: "warning", title: "Falta stock para entregar todo",
                      html: "<div style='text-align:left;font-size:0.86rem;'>" + faltan.join("<br>") + "</div>" });
      }).catch(function (err) {
        encargoOrigen = null;
        Swal.fire("No se pudo cargar el encargo", err.message || "Error de conexión.", "error");
      });
    }

    function cancelarConversion() {
      presupuestoOrigen = null;
      encargoOrigen = null;
      document.getElementById("bannerPresup").style.display = "none";
      // Se saca el parámetro de la URL para que un F5 no lo vuelva a cargar
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, "", window.location.pathname);
      }
    }

    // Marca el presupuesto como Convertido. Si falla, la venta ya está hecha:
    // se avisa pero no se revierte nada.
    function vincularPresupuesto(idVenta) {
      if (!presupuestoOrigen) return Promise.resolve();

      if (!idVenta) {
        Swal.fire({
          icon: "info",
          title: "Venta registrada",
          text: "No se pudo leer el número de la venta, así que el presupuesto N° " +
                presupuestoOrigen.Numero + " no quedó marcado como convertido."
        });
        return Promise.resolve();
      }

      return fetchAuth(apiPresupuesto + "/" + presupuestoOrigen.Id, {
        method: "PUT",
        body: JSON.stringify({ IdVenta: idVenta })
      }).then(function (r) {
        if (!r.ok) throw new Error("no vinculado");
      }).catch(function () {
        Swal.fire({
          icon: "info",
          title: "Venta registrada",
          text: "La venta se guardó, pero el presupuesto N° " + presupuestoOrigen.Numero +
                " no quedó marcado como convertido. Podés vincularlo después."
        });
      });
    }

    /* ================= CONFIRMAR VENTA ================= */

    function resolverIdCliente() {
      if (clienteElegido) return clienteElegido.Id;
      var dni = tipoCliente === "mecanico" ? DNI_MECANICO_MOSTRADOR : DNI_CONSUMIDOR_FINAL;
      var g = todosClientes.find(function (c) { return String(c.Dni) === dni; });
      return g ? g.Id : null;
    }

    /* ================= COBRO =================
       El vendedor elige los medios cuando el cliente paga. Puede ser
       uno solo o varios (mitad efectivo, mitad transferencia). El
       efectivo admite vuelto; los demas no, porque nadie paga de mas
       con tarjeta. Si el cliente tiene cuenta corriente, lo que falte
       queda debiendo; si no, hay que completar el total. */

    var pagos = [];   // [{ IdMedioPago, Codigo, Nombre, ComisionPorc, Monto }]

    function medioPorId(id) {
      return mediosPago.find(function (m) { return m.Id === id; });
    }

    function sumaPagos() {
      return pagos.reduce(function (a, p) { return a + (Number(p.Monto) || 0); }, 0);
    }

    function redondear(n) { return Math.round(n * 100) / 100; }

    // Lo que se registra de cada pago: el efectivo se recorta al total,
    // el excedente es vuelto y no entra a caja.
    function pagosARegistrar(total) {
      var noEfe = pagos.filter(function (p) { return p.Codigo !== "EFE"; })
                       .reduce(function (a, p) { return a + (Number(p.Monto) || 0); }, 0);
      var restaEfe = Math.max(0, total - noEfe);
      return pagos.map(function (p) {
        var m = Number(p.Monto) || 0;
        if (p.Codigo === "EFE") { var usado = Math.min(m, restaEfe); restaEfe -= usado; m = usado; }
        return { IdMedioPago: p.IdMedioPago, Monto: redondear(m) };
      }).filter(function (p) { return p.Monto > 0; });
    }

    function pintarCobro(total) {
      var lista = document.getElementById("cobroLista");
      var resumen = document.getElementById("cobroResumen");
      if (!lista) return;

      if (pagos.length === 0) {
        lista.innerHTML = '<div class="cobro-vacio">Tocá el medio con el que paga el cliente.</div>';
      } else {
        lista.innerHTML = pagos.map(function (p, i) {
          // La seña de un encargo ya se cobró: se muestra, no se edita
          if (p.Fijo)
            return '<div class="cobro-fila"><div class="nom">' + escapeHtml(p.Nombre) +
                   '<small>Cobrada al tomar el encargo</small></div>' +
                   '<strong style="width:150px;text-align:right;">' + formatearMoneda(p.Monto) + '</strong>' +
                   '<span style="width:28px;"></span></div>';
          var com = Number(p.ComisionPorc) > 0
            ? '<small>' + Number(p.ComisionPorc) + '% de comisión: ' +
              formatearMoneda(redondear((Number(p.Monto) || 0) * p.ComisionPorc / 100)) + '</small>'
            : (p.Codigo === "EFE" ? '<small>Lo que entrega el cliente</small>' : '');
          return '<div class="cobro-fila">' +
            '<div class="nom">' + escapeHtml(p.Nombre) + com + '</div>' +
            '<div class="input-group input-group-sm" style="width:150px;">' +
              '<span class="input-group-text">$</span>' +
              '<input type="text" inputmode="decimal" class="form-control" id="pago_' + i + '" ' +
                'value="' + numeroAPrecio(p.Monto) + '" data-idx="' + i + '">' +
            '</div>' +
            '<button type="button" class="quitar" data-quitar="' + i + '" title="Quitar">' +
              '<i class="bi bi-x-circle"></i></button>' +
          '</div>';
        }).join("");

        pagos.forEach(function (p, i) {
          if (p.Fijo) return;
          var inp = document.getElementById("pago_" + i);
          activarInputPrecio("pago_" + i);
          inp.addEventListener("input", function () {
            pagos[i].Monto = precioANumero(inp.value) || 0;
            pintarResumen(total);
          });
        });
        lista.querySelectorAll("[data-quitar]").forEach(function (b) {
          b.addEventListener("click", function () {
            pagos.splice(parseInt(b.getAttribute("data-quitar"), 10), 1);
            pintarCobro(total);
          });
        });
      }
      pintarResumen(total);
    }

    function pintarResumen(total) {
      var resumen = document.getElementById("cobroResumen");
      var pagado = sumaPagos();
      var hayEfe = pagos.some(function (p) { return p.Codigo === "EFE"; });
      var noEfe = pagos.filter(function (p) { return p.Codigo !== "EFE"; })
                       .reduce(function (a, p) { return a + (Number(p.Monto) || 0); }, 0);
      var comision = pagosARegistrar(total).reduce(function (a, p) {
        var m = medioPorId(p.IdMedioPago);
        return a + (m ? p.Monto * m.ComisionPorc / 100 : 0);
      }, 0);

      var html = '<div class="fila"><span>Pagado</span><strong>' + formatearMoneda(pagado) + '</strong></div>';
      var diff = redondear(pagado - total);

      if (noEfe > total + 0.01) {
        html += '<div class="fila falta"><span>Con tarjeta, QR o transferencia no puede haber vuelto</span></div>';
      } else if (diff > 0.009) {
        html += hayEfe
          ? '<div class="fila vuelto"><span>Vuelto</span><span>' + formatearMoneda(diff) + '</span></div>'
          : '<div class="fila falta"><span>Se pasó por ' + formatearMoneda(diff) + '</span></div>';
      } else if (diff < -0.009) {
        var falta = -diff;
        html += clienteTieneCuentaCorriente()
          ? '<div class="fila ctacte"><span>Queda en cuenta corriente</span><span>' + formatearMoneda(falta) + '</span></div>'
          : '<div class="fila falta"><span>Falta cobrar</span><span>' + formatearMoneda(falta) + '</span></div>';
        var probCred = clienteTieneCuentaCorriente() ? problemaCredito(falta) : null;
        if (probCred) {
          html += '<div class="fila falta" style="display:block;font-weight:600;"><i class="bi bi-exclamation-triangle"></i> ' + escapeHtml(probCred) + '</div>';
          html += puedeAutorizarCredito
            ? '<label class="fila" style="justify-content:flex-start;gap:8px;cursor:pointer;"><input type="checkbox" ' + (autorizoCredito ? 'checked ' : '') +
              'onchange="autorizoCredito = this.checked"> Lo autorizo (queda registrado a mi nombre)</label>'
            : '<div class="fila" style="color:var(--text-muted);font-size:0.82rem;display:block;">Cobrá una parte o pedile al dueño o a un administrador que la autorice.</div>';
        }
      } else if (pagos.length > 0) {
        html += '<div class="fila" style="color:var(--green);font-weight:700;"><span>Cobro completo</span><span>✓</span></div>';
      }

      if (comision > 0.009)
        html += '<div class="fila" style="color:var(--text-muted);font-size:0.8rem;"><span>Comisiones</span><span>' +
                formatearMoneda(comision) + '</span></div>';

      resumen.innerHTML = html;
    }

    function validarCobro(total) {
      var noEfe = pagos.filter(function (p) { return p.Codigo !== "EFE"; })
                       .reduce(function (a, p) { return a + (Number(p.Monto) || 0); }, 0);
      var registrado = pagosARegistrar(total).reduce(function (a, p) { return a + p.Monto; }, 0);

      if (pagos.some(function (p) { return !(Number(p.Monto) > 0); }))
        return "Hay un pago sin importe.";
      if (noEfe > total + 0.01)
        return "Con tarjeta, QR o transferencia no se puede cobrar más que el total.";
      if (registrado < total - 0.01 && !clienteTieneCuentaCorriente())
        return "Falta cobrar " + formatearMoneda(total - registrado) +
               ". Para dejar saldo pendiente hay que elegir un cliente con cuenta corriente.";
      var probCred = registrado < total - 0.01 ? problemaCredito(total - registrado) : null;
      if (probCred && !puedeAutorizarCredito)
        return probCred + " Cobrá una parte o pedile al dueño o a un administrador que la autorice.";
      if (probCred && !autorizoCredito)
        return probCred + " Para seguir, marcá que lo autorizás.";
      return null;
    }

    function confirmar() {
      if (carrito.length === 0) return;
      if (hayFaltantes()) {
        Swal.fire("Hay repuestos sin stock", "Lo que no está en el local se puede presupuestar o encargar, pero no vender. Sacalo del carrito o hacé el presupuesto.", "info");
        return;
      }
      autorizoCredito = false;

      var idCliente = resolverIdCliente();
      if (!idCliente) {
        Swal.fire({
          icon: "error",
          title: "Falta el cliente interno",
          html: "No encontré el cliente con DNI <strong>" +
                (tipoCliente === "mecanico" ? DNI_MECANICO_MOSTRADOR : DNI_CONSUMIDOR_FINAL) +
                "</strong>.<br><br>Cargalo una vez desde Clientes y ya vas a poder vender sin seleccionar cliente."
        });
        return;
      }

      if (mediosPago.length === 0) {
        Swal.fire("Sin medios de pago", "No se pudieron cargar los medios de pago. Recargá la pantalla.", "error");
        return;
      }

      var nombreMostrar = clienteElegido
        ? clienteElegido.Apellido + ", " + clienteElegido.Nombre
        : (tipoCliente === "mecanico" ? "Mecánico Mostrador" : "Consumidor Final");

      var total = totalCarrito();

      var criticos = carrito.filter(function (c) {
        return (c.StockActual - c.Cantidad) <= c.StockMinimo;
      });
      var extra = criticos.length > 0
        ? "<div style='color:#856404;font-size:0.8rem;margin-top:8px;'><i class='bi bi-exclamation-triangle'></i> " +
          criticos.length + " repuesto(s) quedan en stock crítico.</div>"
        : "";

      // Arranca con efectivo por el total: es el caso mas comun
      var efe = mediosPago.find(function (m) { return m.Codigo === "EFE"; });
      pagos = efe ? [{ IdMedioPago: efe.Id, Codigo: efe.Codigo, Nombre: efe.Nombre,
                       ComisionPorc: Number(efe.ComisionPorc), Monto: total }] : [];
      // Entrega de encargo: la seña cuenta como pagada y el efectivo cubre el resto
      if (encargoOrigen && encargoOrigen.Sena > 0) {
        var sena = Math.min(encargoOrigen.Sena, total);
        if (sena < encargoOrigen.Sena) {
          Swal.fire("La seña supera el total", "Lo que se entrega vale menos que la seña cobrada. " +
                    "Agregá lo que falta del encargo o cancelalo desde Encargos.", "warning");
          return;
        }
        pagos = [{ IdMedioPago: encargoOrigen.IdMedioSen, Codigo: "SEN", Nombre: "Seña aplicada",
                   ComisionPorc: 0, Monto: sena, Fijo: true }];
        if (efe && total - sena > 0.009)
          pagos.push({ IdMedioPago: efe.Id, Codigo: efe.Codigo, Nombre: efe.Nombre,
                       ComisionPorc: Number(efe.ComisionPorc), Monto: redondear(total - sena) });
      }

      var botones = mediosPago.map(function (m) {
        return '<button type="button" class="cobro-medio" data-medio="' + m.Id + '">' +
          '<i class="bi ' + (ICONO_MEDIO[m.Codigo] || "bi-wallet2") + '"></i>' +
          escapeHtml(m.Nombre) +
          (Number(m.ComisionPorc) > 0 ? '<span class="com">' + Number(m.ComisionPorc) + '%</span>' : '') +
        '</button>';
      }).join("");

      Swal.fire({
        title: "Cobrar",
        width: 560,
        html:
          "<div style='text-align:left;'>" +
            "<div style='font-size:0.85rem;color:var(--text-muted);margin-bottom:8px;'>" +
              escapeHtml(nombreMostrar) + " · " + carrito.length + " ítem(s)" +
              (descuentoActual > 0 ? " · " + descuentoActual + "% desc." : "") +
              (clienteTieneCuentaCorriente() ? " · <span style='color:#856404;'>tiene cuenta corriente</span>" : "") +
            "</div>" +
            "<div class='cobro-total'><div class='lbl'>TOTAL</div><div class='val'>" + formatearMoneda(total) + "</div></div>" +
            "<div class='cobro-medios'>" + botones + "</div>" +
            "<div id='cobroLista'></div>" +
            "<div class='cobro-resumen' id='cobroResumen'></div>" +
            extra +
          "</div>",
        showCancelButton: true,
        confirmButtonColor: "#28a745",
        confirmButtonText: "Registrar venta",
        cancelButtonText: "Cancelar",
        didOpen: function () {
          document.querySelectorAll("[data-medio]").forEach(function (b) {
            b.addEventListener("click", function () {
              var m = medioPorId(parseInt(b.getAttribute("data-medio"), 10));
              if (!m) return;
              // Propone lo que falta; si ya esta cubierto, cero para que lo cargue
              var falta = Math.max(0, redondear(total - sumaPagos()));
              // Si el unico pago es el efectivo inicial por el total, se
              // reemplaza: el vendedor esta cambiando de medio, no sumando
              if (pagos.length === 1 && pagos[0].Codigo === "EFE" && !pagos[0].Fijo &&
                  Math.abs(pagos[0].Monto - total) < 0.01 && m.Codigo !== "EFE") {
                pagos = [];
                falta = total;
              }
              pagos.push({ IdMedioPago: m.Id, Codigo: m.Codigo, Nombre: m.Nombre,
                           ComisionPorc: Number(m.ComisionPorc), Monto: falta });
              pintarCobro(total);
              var ultimo = document.getElementById("pago_" + (pagos.length - 1));
              if (ultimo) { ultimo.focus(); ultimo.select(); }
            });
          });
          pintarCobro(total);
        },
        preConfirm: function () {
          var err = validarCobro(total);
          if (err) { Swal.showValidationMessage(err); return false; }
          return pagosARegistrar(total);
        }
      }).then(function (res) {
        if (!res.isConfirmed || !res.value) return;
        registrarVenta(idCliente, total, res.value);
      });
    }

    function registrarVenta(idCliente, total, pagosFinal) {
      var btn = document.getElementById("btnConfirmar");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Guardando…';

      var pagado = pagosFinal.reduce(function (a, p) { return a + p.Monto; }, 0);

      var venta = {
        IdCliente: idCliente,
        TokenOperacion: tokenOperacion,
        PorcentajeDescuento: descuentoActual,
        Pagos: pagosFinal,
        TipoCliente: tipoCliente === "mecanico" ? "Mecanico" : "Publico",
        NombreOcasional: encargoOrigen ? encargoOrigen.Nombre
                         : ((presupActual && presupActual.nombre) ? presupActual.nombre : null),
        TelefonoOcasional: encargoOrigen ? encargoOrigen.Telefono
                         : ((presupActual && presupActual.telefono) ? presupActual.telefono : null),
        IdEncargo: encargoOrigen ? encargoOrigen.Id : null,
        AutorizarCredito: puedeAutorizarCredito && autorizoCredito,
        Detalle: carrito.map(function (c) {
          return { IdRepuesto: c.IdRepuesto, Cantidad: c.Cantidad, PrecioUnitario: c.PrecioUnitario };
        })
      };

      fetchAuth(apiVenta, { method: "POST", body: JSON.stringify(venta) }).then(function (r) {
        if (!r.ok) {
          return leerError(r).then(function (msg) {
            if (String(msg).indexOf("[CREDITO]") === 0) {
              Swal.fire({ icon: "warning", title: "Supera el crédito del cliente",
                          text: String(msg).replace("[CREDITO]", "").trim() });
              cargarSaldoCliente();
              restaurarBoton();
              return;
            }
            Swal.fire({
              icon: "error",
              title: "No se pudo registrar la venta",
              html: "<div class='text-start'>" + escapeHtml(msg) + "</div><br>" +
                    "<small class='text-muted'>El stock pudo cambiar mientras armabas la venta.</small>"
            });
            restaurarBoton();
          });
        }

        return r.json().catch(function () { return null; }).then(function (res) {
          var idVenta = res && (res.IdVenta || res.idVenta || res.Id);
          idVenta = parseInt(idVenta, 10);
          if (isNaN(idVenta) || idVenta <= 0) idVenta = null;

          return vincularPresupuesto(idVenta).then(function () {
            var saldo = res && res.SaldoGenerado !== undefined ? Number(res.SaldoGenerado) : (total - pagado);
            var comision = res && res.Comision !== undefined ? Number(res.Comision) : 0;

            var detallePagos = pagosFinal.map(function (p) {
              var m = medioPorId(p.IdMedioPago);
              var nom = m ? m.Nombre : (encargoOrigen && p.IdMedioPago === encargoOrigen.IdMedioSen ? "Seña aplicada" : "Pago");
              return nom + ": " + formatearMoneda(p.Monto);
            }).join("<br>");

            var html = "N° <strong>" + String(idVenta || "").padStart(8, "0") + "</strong><br>" +
                       "Total: <strong>" + formatearMoneda(total) + "</strong><br><br>" +
                       "<div style='font-size:0.88rem;'>" + detallePagos + "</div>";
            if (saldo > 0.009)
              html += "<br><span style='color:#c0392b;'>Quedó debiendo <strong>" + formatearMoneda(saldo) + "</strong></span>";
            if (comision > 0.009)
              html += "<br><small class='text-muted'>Comisiones: " + formatearMoneda(comision) + "</small>";
            if (res && res.Duplicada)
              html += "<br><small class='text-muted'>Esta venta ya estaba registrada: no se duplicó.</small>";
            if (presupuestoOrigen)
              html += "<br><small class='text-muted'>Presupuesto N° " + presupuestoOrigen.Numero + " marcado como convertido.</small>";
            if (encargoOrigen)
              html += "<br><small class='text-muted'>Encargo #" + encargoOrigen.Id + " entregado.</small>";

            Swal.fire({
              icon: "success", title: "Venta registrada", html: html,
              showCancelButton: true, confirmButtonText: "Venta", cancelButtonText: "Ir al listado",
              confirmButtonColor: "#28a745"
            }).then(function (r2) {
              if (encargoOrigen && !r2.isConfirmed) { window.location.href = "Encargos.html"; return; }
              if (r2.isConfirmed) window.location.href = window.location.pathname;
              else window.location.href = "ListadoVentas.html";
            });
          });
        });
      }).catch(function () {
        Swal.fire("Error de conexión", "No se pudo contactar al servidor.", "error");
        restaurarBoton();
      });
    }

    function restaurarBoton() {
      var btn = document.getElementById("btnConfirmar");
      btn.disabled = carrito.length === 0;
      btn.innerHTML = '<i class="bi bi-check2-circle"></i> CONFIRMAR VENTA';
    }

    function leerError(response) {
      return response.text().then(function (text) {
        try { var d = JSON.parse(text); return d.Message || d.message || text; }
        catch (e) { return text; }
      }).catch(function () { return "No se pudo completar la operación."; });
    }

    /* ================= INICIO ================= */

    window.onload = function () {
      cargarCombos();
      cargarMediosPago();
      renderCarrito();

      var idPresup = idPresupuestoDeLaUrl();
      var idEncargo = idEncargoDeLaUrl();

      // Los repuestos y los clientes tienen que estar antes de armar
      // el carrito desde un presupuesto: de ahí salen stock y precios.
      Promise.all([cargarClientes(), cargarRepuestos()]).then(function () {
        if (idPresup) cargarDesdePresupuesto(idPresup);
        else if (idEncargo) cargarDesdeEncargo(idEncargo);
      });

      document.getElementById("tipoPublico").addEventListener("click", function () { setTipo("publico"); });
      document.getElementById("tipoMecanico").addEventListener("click", function () { setTipo("mecanico"); });
      document.getElementById("btnBuscarCliente").addEventListener("click", abrirBuscarCliente);

      document.getElementById("buscarRepuesto").addEventListener("input", buscar);
      document.getElementById("buscarRepuesto").addEventListener("keydown", function (e) {
        // Enter agrega el primer resultado con stock: venta sin usar el mouse
        if (e.key !== "Enter") return;
        e.preventDefault();
        var primero = document.querySelector(".res-item:not(.sin-stock):not(.ext) .btn-add");
        if (primero) primero.click();
      });

      document.getElementById("filtroRubro").addEventListener("change", buscar);
      document.getElementById("filtroMarca").addEventListener("change", function () {
        filtrarModelosPorMarca();
        buscar();
      });
      document.getElementById("filtroModelo").addEventListener("change", buscar);
      document.getElementById("btnLimpiarFiltros").addEventListener("click", function () {
        document.getElementById("filtroRubro").value = "";
        document.getElementById("filtroMarca").value = "";
        filtrarModelosPorMarca();
        document.getElementById("filtroModelo").value = "";
        document.getElementById("buscarRepuesto").value = "";
        buscar();
        document.getElementById("buscarRepuesto").focus();
      });


      cargarParametrosVenta().then(pintarBotonesDescuento);

      document.getElementById("btnVaciar").addEventListener("click", vaciar);
      document.getElementById("btnPresupuesto").addEventListener("click", abrirPresupuesto);
      document.getElementById("btnConfirmar").addEventListener("click", confirmar);

      document.getElementById("buscarRepuesto").focus();
    };
  </script>
</body>
</html>
