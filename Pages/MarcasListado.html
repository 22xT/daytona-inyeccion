<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Marcas - Daytona Inyección</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <style>
    .repuesto-discontinuado {
      opacity: 0.55;
      background-color: #f5f5f5 !important;
    }
    .badge-discontinuado {
      background: #6c757d;
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px;
      vertical-align: middle;
    }
  </style>
</head>

<body data-page="marcas">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="header-bar">
      <div>
        <h2><i class="bi bi-tag"></i> Marcas</h2>
        <span class="subtitle">Catálogo de marcas de vehículos</span>
      </div>
      <a href="MarcaForm.html" class="btn btn-danger admin-only">
        <i class="bi bi-plus-lg"></i> Nueva Marca
      </a>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon"><i class="bi bi-tag"></i></div>
          <div>
            <p class="stat-value" id="statTotal">0</p>
            <p class="stat-label">Marcas activas</p>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon yellow"><i class="bi bi-x-circle"></i></div>
          <div>
            <p class="stat-value" id="statInactivas">0</p>
            <p class="stat-label">Discontinuadas</p>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><i class="bi bi-funnel"></i> Filtros y búsqueda</div>
      <div class="panel-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Buscar por nombre</label>
            <input type="text" id="busqueda" class="form-control" placeholder="Ej: Ford, Renault...">
          </div>
          <div class="col-md-3">
            <label class="form-label">Estado</label>
            <select id="filtroEstado" class="form-select">
              <option value="activos" selected>Solo activas</option>
              <option value="discontinuados">Discontinuadas</option>
              <option value="todos">Todas</option>
            </select>
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <button id="btnLimpiar" class="btn btn-outline-secondary w-100">
              <i class="bi bi-arrow-counterclockwise"></i> Limpiar
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header" id="panelResultados"><i class="bi bi-list-ul"></i> Listado de marcas</div>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th class="text-center">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaMarcas">
            <tr class="loading-row"><td colspan="3">Cargando marcas…</td></tr>
          </tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state d-none">
        <div class="icon"><i class="bi bi-search"></i></div>
        <h4>No se encontraron marcas</h4>
        <p>Probá cambiar los filtros o limpiar la búsqueda.</p>
      </div>
    </div>
  </div>

  <script src="layout.js"></script>
  <script>
    if (!Auth.requireSession()) { /* redirect */ }

    const apiMarca = API_BASE + "Marca";

    const usuario = Auth.getUsuario();
    const esAdmin = usuario && usuario.Rol === "Administrador";
    if (esAdmin) document.body.classList.add('is-admin');

    let marcas = [];

    function esActivo(m) {
      return m.Activo === true || m.Activo === 1 || m.Activo === undefined;
    }

    function cargar() {
      fetchAuth(apiMarca).then(r => r.json()).then(data => {
        marcas = data;
        actualizarStats();
        aplicarFiltros();
      }).catch(() => {
        document.getElementById("tablaMarcas").innerHTML =
          "<tr><td colspan='3' class='text-center text-danger p-4'>No se pudieron cargar las marcas.</td></tr>";
      });
    }

    function actualizarStats() {
      const activas = marcas.filter(esActivo);
      const inactivas = marcas.filter(m => !esActivo(m));
      document.getElementById("statTotal").textContent = activas.length;
      document.getElementById("statInactivas").textContent = inactivas.length;
    }

    function aplicarFiltros() {
      const texto = document.getElementById("busqueda").value.trim().toLowerCase();
      const estado = document.getElementById("filtroEstado").value;

      let lista = marcas.slice();
      if (estado === "activos") lista = lista.filter(esActivo);
      else if (estado === "discontinuados") lista = lista.filter(m => !esActivo(m));
      if (texto) lista = lista.filter(m => (m.Nombre || "").toLowerCase().includes(texto));

      lista.sort((a, b) => (a.Nombre || "").localeCompare(b.Nombre || ""));
      renderizar(lista);
    }

    function renderizar(lista) {
      const tbody = document.getElementById("tablaMarcas");
      const empty = document.getElementById("emptyState");
      const panel = document.getElementById("panelResultados");
      panel.innerHTML = '<i class="bi bi-list-ul"></i> Listado de marcas (' + lista.length + ')';

      if (lista.length === 0) {
        tbody.innerHTML = "";
        empty.classList.remove("d-none");
        return;
      }
      empty.classList.add("d-none");

      let html = "";
      lista.forEach(m => {
        const activo = esActivo(m);
        const claseFila = activo ? "" : "repuesto-discontinuado";
        const badge = activo ? "" : "<span class='badge-discontinuado'>Discontinuada</span>";

        html += "<tr class='" + claseFila + "'>";
        html += "<td><strong>#" + m.Id + "</strong></td>";
        html += "<td>" + escapeHtml(m.Nombre) + badge + "</td>";
        if (esAdmin) {
          html += "<td class='text-center'>";
          html += "<a href='MarcaForm.html?id=" + m.Id + "' class='btn btn-sm btn-outline-primary me-1' title='Editar'><i class='bi bi-pencil'></i></a>";
          if (activo) {
            html += "<button class='btn btn-sm btn-outline-danger' onclick='descontinuar(" + m.Id + ")' title='Descontinuar'><i class='bi bi-x-circle'></i></button>";
          } else {
            html += "<button class='btn btn-sm btn-outline-success' onclick='reactivar(" + m.Id + ")' title='Reactivar'><i class='bi bi-arrow-counterclockwise'></i></button>";
          }
          html += "</td>";
        } else {
          html += "<td class='text-center'><span class='text-muted small'>Solo lectura</span></td>";
        }
        html += "</tr>";
      });
      tbody.innerHTML = html;
    }

    function descontinuar(id) {
      Swal.fire({
        title: "¿Descontinuar marca?",
        text: "Dejará de aparecer en los formularios de carga de repuestos.",
        icon: "question",
        showCancelButton: true,
        confirmButtonColor: "#ff3333",
        confirmButtonText: "Sí, descontinuar",
        cancelButtonText: "Cancelar"
      }).then(result => {
        if (!result.isConfirmed) return;
        fetchAuth(apiMarca + "/" + id, { method: "DELETE" }).then(r => {
          if (r.ok) { Swal.fire("Listo", "La marca fue descontinuada.", "success"); cargar(); }
          else leerError(r).then(msg => Swal.fire("Error", msg, "error"));
        });
      });
    }

    function reactivar(id) {
      fetchAuth(apiMarca + "/" + id + "/Activar", { method: "PUT" }).then(r => {
        if (r.ok) { Swal.fire("Listo", "La marca fue reactivada.", "success"); cargar(); }
        else leerError(r).then(msg => Swal.fire("Error", msg, "error"));
      });
    }

    function leerError(response) {
      return response.text().then(text => {
        try { const data = JSON.parse(text); return data.Message || data.message || text; }
        catch { return text; }
      }).catch(() => "No se pudo completar la operación.");
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    }

    window.onload = function () {
      cargar();
      document.getElementById("busqueda").addEventListener("input", aplicarFiltros);
      document.getElementById("filtroEstado").addEventListener("change", aplicarFiltros);
      document.getElementById("btnLimpiar").addEventListener("click", () => {
        document.getElementById("busqueda").value = "";
        document.getElementById("filtroEstado").value = "activos";
        aplicarFiltros();
      });
    };
  </script>
</body>
</html>
