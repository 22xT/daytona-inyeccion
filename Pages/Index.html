<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio - Daytona Inyección</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>

<body data-page="inicio">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="welcome-banner">
      <h1>Bienvenido, <span id="bienvenidaNombre">Usuario</span> <i class="bi bi-hand-thumbs-up"></i></h1>
      <p>Panel de gestión integral de Daytona Inyección</p>
    </div>

    <!-- Stats globales -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon"><i class="bi bi-tools"></i></div>
          <div>
            <p class="stat-value" id="statRepuestos">—</p>
            <p class="stat-label">Repuestos en sistema</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon yellow"><i class="bi bi-exclamation-triangle"></i></div>
          <div>
            <p class="stat-value" id="statStockBajo">—</p>
            <p class="stat-label">Stock crítico</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon green"><i class="bi bi-receipt"></i></div>
          <div>
            <p class="stat-value" id="statVentasHoy">—</p>
            <p class="stat-label">Ventas de hoy</p>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon red"><i class="bi bi-cash-stack"></i></div>
          <div>
            <p class="stat-value" id="statFacturadoHoy">—</p>
            <p class="stat-label">Facturado hoy</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Accesos directos -->
    <h5 class="mb-3" style="color: var(--navy); font-weight: 700;">
      <i class="bi bi-grid"></i> Accesos rápidos
    </h5>
    <div class="row g-3" id="accesosRapidos">
      <!-- Se renderiza por JS segun el rol del usuario -->
    </div>
  </div>

  <script src="layout.js"></script>
  <script>
    if (!Auth.requireSession()) { /* redirect */ }

    const usuario = Auth.getUsuario();
    document.getElementById("bienvenidaNombre").textContent = usuario.Nombre;

    const api = API_BASE;

    // Catalogo de accesos rapidos: cada uno declara que roles lo ven
    const ACCESOS = [
      {
        href: "StockRepuestos.html",
        icon: "bi-tools",
        titulo: "Repuestos",
        texto: "Consultá el stock y gestioná el catálogo de repuestos.",
        cta: "Ver stock",
        roles: ["Dueño", "Administrador", "Supervisor", "Vendedor", "Analista"]
      },
      {
        href: "ListadoVentas.html",
        icon: "bi-receipt",
        titulo: "Ventas",
        texto: "Historial de ventas confirmadas y anuladas.",
        cta: "Ver ventas",
        roles: ["Dueño", "Administrador", "Supervisor", "Vendedor"]
      },
      {
        href: "CargarVenta.html",
        icon: "bi-cart-plus",
        titulo: "Venta",
        texto: "Registrá una venta a un cliente.",
        cta: "Registrar",
        roles: ["Administrador", "Supervisor", "Vendedor"]
      },
      {
        href: "ListadoPedido.html",
        icon: "bi-clipboard-data",
        titulo: "Pedidos de compra",
        texto: "Seguimiento de pedidos a proveedores.",
        cta: "Ver pedidos",
        roles: ["Dueño", "Administrador", "Supervisor", "Vendedor"]
      },
      {
        href: "PedidoNuevo.html",
        icon: "bi-box-seam",
        titulo: "Pedido",
        texto: "Cargá un pedido de reposición de stock.",
        cta: "Crear pedido",
        roles: ["Administrador", "Supervisor", "Vendedor"]
      },
      {
        href: "ClientesListado.html",
        icon: "bi-people",
        titulo: "Clientes",
        texto: "Gestión de clientes con sus datos de contacto.",
        cta: "Ver clientes",
        roles: ["Dueño", "Administrador", "Supervisor", "Vendedor"]
      },
      {
        href: "ProveedoresListado.html",
        icon: "bi-truck",
        titulo: "Proveedores",
        texto: "Administración de proveedores y condiciones.",
        cta: "Ver proveedores",
        roles: ["Dueño", "Administrador", "Supervisor", "Vendedor"]
      },
      {
        href: "MarcasListado.html",
        icon: "bi-tag",
        titulo: "Marcas",
        texto: "Gestión de marcas de vehículos.",
        cta: "Ver marcas",
        roles: ["Administrador", "Analista"]
      },
      {
        href: "ModelosListado.html",
        icon: "bi-car-front",
        titulo: "Modelos",
        texto: "Gestión de modelos por marca.",
        cta: "Ver modelos",
        roles: ["Administrador", "Analista"]
      },
      {
        href: "RubrosListado.html",
        icon: "bi-folder2-open",
        titulo: "Rubros",
        texto: "Categorías de repuestos con su sigla.",
        cta: "Ver rubros",
        roles: ["Administrador", "Analista"]
      },
      {
        href: "UsuariosListado.html",
        icon: "bi-people-fill",
        titulo: "Usuarios",
        texto: "Administración de usuarios del sistema.",
        cta: "Ver usuarios",
        roles: ["Administrador"]
      },
      {
        href: "RolesListado.html",
        icon: "bi-shield-lock-fill",
        titulo: "Roles",
        texto: "Configuración de roles y permisos.",
        cta: "Ver roles",
        roles: ["Administrador"]
      }
    ];

    function tieneRol(rolUsuario, rolesPermitidos) {
      if (!rolesPermitidos || rolesPermitidos.length === 0) return true;
      if (!rolUsuario) return false;
      return rolesPermitidos.indexOf(rolUsuario) !== -1;
    }

    function renderAccesos() {
      const cont = document.getElementById("accesosRapidos");
      const rolUsuario = usuario.Rol;

      const visibles = ACCESOS.filter(a => tieneRol(rolUsuario, a.roles));

      if (visibles.length === 0) {
        cont.innerHTML = '<div class="col-12"><p class="text-muted text-center p-4">No hay accesos rápidos disponibles para tu rol.</p></div>';
        return;
      }

      let html = "";
      visibles.forEach(a => {
        html += '<div class="col-md-4 col-lg-3">';
        html += '<a href="' + a.href + '" class="dashboard-card">';
        html += '<div class="icon"><i class="bi ' + a.icon + '"></i></div>';
        html += '<h5>' + a.titulo + '</h5>';
        html += '<p>' + a.texto + '</p>';
        html += '<div class="arrow">' + a.cta + ' <i class="bi bi-arrow-right"></i></div>';
        html += '</a></div>';
      });
      cont.innerHTML = html;
    }

    renderAccesos();

    // ============================================================
    // STATS GLOBALES
    // ============================================================

    // Stats: repuestos y stock crítico (todos los roles pueden ver Repuesto)
    fetchAuth(api + "Repuesto")
      .then(r => r.json())
      .then(data => {
        document.getElementById("statRepuestos").textContent = data.length;
        const critico = data.filter(r =>
          (r.StockActual !== undefined) && (r.StockMinimo !== undefined) &&
          Number(r.StockActual) <= Number(r.StockMinimo)
        ).length;
        document.getElementById("statStockBajo").textContent = critico;
      }).catch(() => {
        document.getElementById("statRepuestos").textContent = "—";
        document.getElementById("statStockBajo").textContent = "—";
      });

    // Stats: ventas de hoy (solo si el rol puede ver ventas)
    const rolesQueVenVentas = ["Dueño", "Administrador", "Supervisor", "Vendedor"];
    if (tieneRol(usuario.Rol, rolesQueVenVentas)) {
      fetchAuth(api + "Venta")
        .then(r => r.json())
        .then(data => {
          const hoy = new Date().toISOString().slice(0, 10);
          let ventasHoy = 0;
          let facturado = 0;
          data.forEach(v => {
            const fecha = (v.Fecha || "").slice(0, 10);
            // Aceptamos ambas formas por compatibilidad
            const estado = v.Estado || v.EstadoVenta;
            if (fecha === hoy && estado === "Confirmada") {
              ventasHoy++;
              facturado += Number(v.Total || 0);
            }
          });
          document.getElementById("statVentasHoy").textContent = ventasHoy;
          document.getElementById("statFacturadoHoy").textContent = "$" + facturado.toFixed(2);
        }).catch(() => {
          document.getElementById("statVentasHoy").textContent = "—";
          document.getElementById("statFacturadoHoy").textContent = "—";
        });
    } else {
      document.getElementById("statVentasHoy").textContent = "—";
      document.getElementById("statFacturadoHoy").textContent = "—";
    }
  </script>
</body>
</html>
