<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio - Daytona Repuestos Automotor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
  <link href="estilos-areas.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>

<body data-page="inicio">
  <div id="sidebar-container"></div>

  <!-- Inicio sobrio: solo las areas, para elegir donde entrar -->
  <main class="main-content areas-main">
    <div class="areas-saludo">
      <div>
        <p class="fecha" id="fecha"></p>
        <h1 id="saludo">Hola</h1>
      </div>
      <p class="ayuda">Elegí dónde vas a trabajar.</p>
    </div>
    <div class="areas-grid" id="areas"></div>
  </main>

  <script src="layout.js"></script>
  <script>
    if (!Auth.requireSession()) { /* redirect */ }

    (function () {
      var usuario = Auth.getUsuario() || {};
      var hora = new Date().getHours();
      var saludo = hora < 13 ? "Buen día" : hora < 20 ? "Buenas tardes" : "Buenas noches";
      var nombre = String(usuario.Nombre || "").trim().split(/\s+/)[0];
      document.getElementById("saludo").textContent = saludo + (nombre ? ", " + nombre : "");
      var f = new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" }).replace(",", "");
      document.getElementById("fecha").textContent = f.charAt(0).toUpperCase() + f.slice(1);

      function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

      var areas = Layout.areasVisibles(usuario.Rol);
      var cont = document.getElementById("areas");
      if (!areas.length) {
        cont.outerHTML = '<div class="areas-vacio">Tu usuario todavía no tiene pantallas asignadas. Pedíselo a un administrador.</div>';
        return;
      }
      cont.innerHTML = areas.map(function (a) {
        return '<a class="area-tile' + (a.proximamente ? ' proximo' : '') + '" style="--ac:' + (a.color || '#0f2d52') + '" href="Area.html?a=' + a.key + '">' +
          (a.proximamente ? '<span class="chip">PRÓXIMAMENTE</span>' : '') +
          '<i class="bi ' + a.icon + ' fondo" aria-hidden="true"></i>' +
          '<span class="texto"><span><span class="nombre">' + esc(a.titulo) + '</span>' +
          '<span class="bajada">' + esc(a.bajada) + '</span></span>' +
          '<span class="ir" aria-hidden="true"><i class="bi bi-arrow-right"></i></span></span></a>';
      }).join("");
    })();
  </script>
</body>
</html>
