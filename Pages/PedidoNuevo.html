<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reposición sugerida - Daytona Repuestos Automotor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="precio.js"></script>
  <style>
    /* ============ LAYOUT DE REPOSICIÓN ============ */
    /* Solo la pestaña de reposición usa alto fijo. El pedido manual
       conserva el scroll normal de siempre. */
    body.repo-activo { overflow: hidden; }
    body.repo-activo .main-content {
      height: calc(100vh - 70px);
      display: flex; flex-direction: column; gap: 10px;
      padding: 12px 16px 14px !important;
    }

    .repo-body { display: flex; gap: 12px; flex: 1; min-height: 0; }
    .repo-col-izq { flex: 0 0 65%; display: flex; flex-direction: column; min-height: 0; }
    .repo-col-der { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    .caja {
      background: #fff; border: 1px solid var(--border); border-radius: 12px;
      display: flex; flex-direction: column; min-height: 0; flex: 1;
    }

    .repo-head {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 600; color: var(--navy); font-size: 0.92rem; flex-shrink: 0;
    }

    /* ---- Filas de productos ---- */
    .repo-lista { overflow-y: auto; flex: 1; min-height: 0; }
    .repo-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-bottom: 1px solid var(--border);
    }
    .repo-item:last-child { border-bottom: none; }
    .repo-item:hover { background: var(--bg-soft); }

    .repo-foto {
      width: 44px; height: 44px; flex-shrink: 0; border-radius: 7px;
      border: 1px solid var(--border); object-fit: cover; background: var(--bg);
    }
    .repo-foto-ph {
      width: 44px; height: 44px; flex-shrink: 0; border-radius: 7px;
      border: 1px solid var(--border); background: var(--bg); color: #b6c0cc;
      display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
    }

    .repo-info { flex: 1; min-width: 0; }
    .repo-desc {
      font-size: 0.86rem; line-height: 1.25;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .repo-stock { font-size: 0.74rem; color: var(--text-muted); margin-top: 3px; }
    .repo-stock .repo-sep { margin: 0 5px; }
    .repo-cero { color: var(--red); font-weight: 700; }
    .repo-bajo { color: #c47700; font-weight: 700; }

    .repo-cant { flex-shrink: 0; }

    .repo-prov { flex: 0 0 168px; min-width: 0; font-size: 0.78rem; }
    .repo-prov-nombre {
      font-weight: 600; color: var(--navy);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .repo-estrella { color: #e8a800; }
    .repo-sin-prov {
      color: #856404; background: #fff8e1; border: 1px solid #ffeaa7;
      border-radius: 7px; padding: 4px 8px; font-size: 0.73rem; line-height: 1.3;
    }
    .repo-link {
      background: none; border: none; padding: 2px 0;
      color: var(--nav-accent-dark); font-size: 0.74rem; cursor: pointer;
      text-decoration: underline; display: block;
    }
    .repo-link:hover { color: var(--nav-accent); }

    .repo-alts { margin-top: 4px; border-left: 2px solid var(--border); padding-left: 6px; }
    .repo-alt {
      display: flex; justify-content: space-between; gap: 8px; width: 100%;
      background: none; border: none; padding: 3px 5px; border-radius: 5px;
      font-size: 0.74rem; color: var(--text); cursor: pointer; text-align: left;
    }
    .repo-alt:hover { background: var(--nav-accent-soft); }
    .repo-alt.elegida { background: var(--nav-accent-soft); font-weight: 600; color: var(--nav-accent-dark); }

    .repo-precio { flex: 0 0 108px; text-align: right; }
    .repo-unit { font-size: 0.78rem; color: var(--text-muted); }
    .repo-sub { font-size: 0.95rem; font-weight: 700; color: var(--navy); }

    .repo-quitar {
      background: none; border: none; color: #c0392b; cursor: pointer;
      padding: 3px 5px; border-radius: 5px; font-size: 0.85rem; flex-shrink: 0;
    }
    .repo-quitar:hover { background: #ffeded; }

    /* ---- Resumen por proveedor ---- */
    .repo-resumen { overflow-y: auto; flex: 1; min-height: 0; padding: 6px 0; }
    .repo-grupo { padding: 8px 14px; border-bottom: 1px solid var(--border); }
    .repo-grupo:last-child { border-bottom: none; }
    .repo-grupo-head {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-bottom: 5px;
    }
    .repo-grupo-head .nom { font-weight: 700; color: var(--navy); font-size: 0.85rem; }
    .repo-grupo-head .cant {
      font-size: 0.7rem; color: var(--text-muted);
      background: var(--bg); padding: 2px 8px; border-radius: 9px; white-space: nowrap;
    }
    .repo-grupo-item {
      display: flex; justify-content: space-between; gap: 10px;
      font-size: 0.78rem; color: var(--text-muted); padding: 2px 0;
    }
    .repo-grupo-item .d { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .repo-grupo-item .m { white-space: nowrap; color: var(--text); }
    .repo-grupo-sub {
      text-align: right; font-size: 0.8rem; font-weight: 700;
      color: var(--navy); margin-top: 4px;
    }
    .repo-grupo.pendiente { background: #fffdf5; }
    .repo-grupo.pendiente .nom { color: #856404; }
    .repo-grupo.pendiente .repo-grupo-sub { color: #856404; font-weight: 500; font-size: 0.73rem; }

    .repo-total {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
      color: #fff; padding: 13px 18px; border-radius: 0 0 12px 12px;
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .repo-total .lbl { font-size: 0.8rem; opacity: 0.85; letter-spacing: 0.6px; }
    .repo-total .monto { font-size: 1.5rem; font-weight: 700; }

    .repo-nota {
      font-size: 0.78rem; color: var(--text-muted);
      text-align: center; margin-top: 8px; flex-shrink: 0;
    }
    .btn-repo-confirmar {
      background: var(--green); border: 2px solid var(--green); color: #fff;
      border-radius: 10px; padding: 13px 6px; margin-top: 6px; width: 100%;
      font-size: 0.98rem; font-weight: 700; letter-spacing: 0.4px;
      cursor: pointer; transition: 0.15s; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-repo-confirmar:hover:not(:disabled) { background: #1e7e34; border-color: #1e7e34; }
    .btn-repo-confirmar:disabled {
      opacity: 0.45; cursor: not-allowed;
      background: #e9ecef; border-color: #dee2e6; color: #8b96a3;
    }

    .qty-group { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
    .qty-group button {
      width: 27px; height: 27px; border: none; background: #fff;
      color: var(--navy); font-size: 0.95rem; cursor: pointer; line-height: 1;
    }
    .qty-group button:hover { background: var(--bg); }
    .qty-group input {
      width: 42px; height: 27px; border: none; text-align: center;
      font-size: 0.84rem; font-weight: 600; color: var(--navy);
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    }

    .codigo-repuesto {
      font-family: 'Courier New', monospace; font-weight: 700;
      color: #2c3e50; letter-spacing: 0.5px;
    }

    @media (max-width: 1200px) {
      .repo-prov { flex-basis: 140px; }
      .repo-precio { flex-basis: 92px; }
    }
    @media (max-width: 991px) {
      body.repo-activo { overflow: auto; }
      body.repo-activo .main-content { height: auto; }
      .repo-body { flex-direction: column; }
      .repo-col-izq, .repo-col-der { flex: 1 1 auto; }
      .repo-lista { max-height: 55vh; }
      .repo-resumen { max-height: 40vh; }
    }

    /* ===== Reposicion sugerida: filas densas, alternativas en linea ===== */
    .rp-caja { display:flex; flex-direction:column; min-height:0; flex:1; }
    .rp-top { display:flex; justify-content:space-between; align-items:flex-start; padding:12px 14px 6px; }
    .rp-titulo { font-weight:800; color:var(--navy); font-size:1.02rem; }
    .rp-stats { font-size:0.8rem; color:var(--text-muted); margin-top:2px; }
    .rp-stats b { color:#1F2937; font-weight:700; }
    .rp-stats .rojo { color:#B42318; }
    .rp-btn-sec { border:1px solid var(--border); background:#fff; border-radius:8px; padding:5px 10px; font-size:0.8rem; font-weight:600; color:#374151; }
    .rp-btn-sec:hover { background:var(--bg-soft); }
    .rp-filtros { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:6px 14px 10px; border-bottom:1px solid var(--border); }
    .rp-buscar { position:relative; flex:1 1 200px; }
    .rp-buscar i { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85rem; }
    .rp-buscar input { width:100%; border:1px solid var(--border); border-radius:8px; padding:5px 10px 5px 28px; font-size:0.85rem; }
    .rp-chips { display:flex; gap:4px; }
    .rp-chip { border:1px solid var(--border); background:#fff; border-radius:16px; padding:3px 10px; font-size:0.76rem; font-weight:600; color:var(--text-muted); }
    .rp-chip.activo { background:var(--navy); border-color:var(--navy); color:#fff; }
    .rp-chip .n { opacity:0.75; margin-left:3px; }
    .rp-sel { width:auto; max-width:190px; font-size:0.8rem; }

    .rp-cab, .rp-fila { display:grid; grid-template-columns: 28px minmax(180px, 2.2fr) 110px 112px minmax(170px, 1.6fr) 100px; gap:10px; align-items:center; }
    .rp-cab { padding:7px 14px; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); background:var(--bg-soft); border-bottom:1px solid var(--border); }
    .rp-cab .c { text-align:center; } .rp-cab .d { text-align:right; }
    .rp-item { border-bottom:1px solid #F0F1F3; border-left:3px solid transparent; transition:background 0.4s; }
    .rp-item.u-SIN_STOCK { border-left-color:#D92D20; }
    .rp-item.u-CRITICO { border-left-color:#F79009; }
    .rp-item.excluido .rp-fila > *:not(:first-child) { opacity:0.4; }
    .rp-item.flash { background:#EEF4FF; }
    .rp-fila { padding:8px 14px 8px 11px; }
    .rp-cod { font-family:'Courier New', monospace; font-weight:700; font-size:0.78rem; color:#2c3e50; }
    .rp-desc { font-size:0.84rem; color:#111827; line-height:1.25; }
    .rp-urg { font-size:0.66rem; font-weight:700; border-radius:5px; padding:1px 6px; margin-left:4px; vertical-align:1px; }
    .rp-urg.SIN_STOCK { background:#FEE4E2; color:#B42318; } .rp-urg.CRITICO { background:#FEF0C7; color:#93370D; }
    .rp-stock { font-size:0.82rem; font-variant-numeric:tabular-nums; }
    .rp-stock b { font-size:0.95rem; }
    .rp-barra { height:4px; background:#E5E7EB; border-radius:2px; margin-top:3px; overflow:hidden; }
    .rp-barra > div { height:100%; background:#F79009; }
    .rp-camino { font-size:0.7rem; color:#1E40AF; }
    .rp-cant { display:flex; align-items:center; justify-content:center; }
    .rp-cant button { width:26px; height:28px; border:1px solid var(--border); background:#fff; color:#374151; font-weight:700; }
    .rp-cant button:first-child { border-radius:7px 0 0 7px; } .rp-cant button:last-child { border-radius:0 7px 7px 0; }
    .rp-cant input { width:44px; height:28px; border:1px solid var(--border); border-left:none; border-right:none; text-align:center; font-weight:700; font-size:0.88rem; }
    .rp-sug { font-size:0.68rem; color:var(--text-muted); text-align:center; }
    .rp-prov { font-size:0.84rem; line-height:1.25; }
    .rp-prov .nom { font-weight:700; color:#111827; }
    .rp-prov .pre { font-variant-numeric:tabular-nums; }
    .rp-tag { font-size:0.66rem; font-weight:700; border-radius:5px; padding:1px 6px; }
    .rp-tag.mejor { background:#DCFCE7; color:#166534; } .rp-tag.mas { background:#FEF0C7; color:#93370D; }
    .rp-tag.siniva { background:#F3F4F6; color:#4B5563; }
    .rp-opc { border:none; background:none; padding:0; font-size:0.76rem; font-weight:600; color:var(--nav-accent, #1266d1); }
    .rp-sinprov { font-size:0.8rem; color:#93370D; }
    .rp-sinprov button { border:1px solid #F5C99A; background:#FFFAEB; color:#93370D; border-radius:6px; font-size:0.74rem; font-weight:700; padding:2px 8px; margin-left:4px; }
    .rp-sub { text-align:right; font-weight:700; font-variant-numeric:tabular-nums; font-size:0.86rem; }
    .rp-alts { margin:0 14px 10px 50px; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
    .rp-alt { display:grid; grid-template-columns: 18px 1fr auto 90px 70px; gap:10px; align-items:center; width:100%; border:none; border-bottom:1px solid #F0F1F3; background:#fff; padding:6px 10px; font-size:0.8rem; text-align:left; }
    .rp-alt:last-child { border-bottom:none; }
    .rp-alt:hover { background:#F8FAFF; }
    .rp-alt.elegida { background:#EEF4FF; }
    .rp-alt .r { text-align:right; font-variant-numeric:tabular-nums; }
    .rp-alt .dif { color:#93370D; } .rp-alt .dif.cero { color:#166534; }
    .rp-vacio { padding:40px 20px; text-align:center; color:var(--text-muted); }

    .rp-res-top { padding:12px 14px; font-weight:800; color:var(--navy); border-bottom:1px solid var(--border); }
    .rp-res-top small { display:block; font-weight:500; color:var(--text-muted); font-size:0.78rem; }
    .rp-grupo { border-bottom:1px solid #F0F1F3; transition:background 0.4s; }
    .rp-grupo.flash { background:#EEF4FF; }
    .rp-grupo-h { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; border:none; background:none; padding:9px 14px; text-align:left; }
    .rp-grupo-h .nom { font-weight:700; color:#111827; font-size:0.88rem; }
    .rp-grupo-h .cnt { font-size:0.74rem; color:var(--text-muted); }
    .rp-grupo-h .sub { font-weight:700; font-variant-numeric:tabular-nums; }
    .rp-grupo-items { display:none; padding:0 14px 8px; }
    .rp-grupo.abierto .rp-grupo-items { display:block; }
    .rp-gi { display:flex; justify-content:space-between; gap:8px; font-size:0.76rem; color:#4B5563; padding:2px 0; }
    .rp-pend { padding:10px 14px; font-size:0.8rem; color:#93370D; background:#FFFAEB; }
    .rp-sobrecosto { display:none; padding:8px 14px; font-size:0.78rem; color:#93370D; background:#FFFAEB; border-top:1px solid #FDE5C2; }
    .rp-sobrecosto.visible { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .rp-sobrecosto button { border:none; background:none; color:var(--nav-accent, #1266d1); font-weight:700; font-size:0.76rem; padding:0; }
    @media (max-width: 1366px) {
      .rp-cab, .rp-fila { grid-template-columns: 26px minmax(150px, 2fr) 92px 104px minmax(150px, 1.5fr) 90px; gap:8px; }
    }

    /* ===== Rediseño 14/10: identificar bien el repuesto, explicar el
       "cuanto" y decir en que pedido esta lo ya pedido ===== */
    .repo-col-izq { flex: 1 1 auto; min-width: 0; }
    .repo-col-der { flex: 0 0 360px; min-width: 0; }
    .rp-titulo { font-size: 1.05rem; }
    .rp-stats { font-size: 0.84rem; }
    .rp-filtros { gap: 10px; }
    .rp-buscar input { height: 34px; font-size: 0.88rem; }
    .rp-chips { background: #fff; border: 1px solid var(--border); border-radius: 9px; padding: 2px; gap: 2px; }
    .rp-chip { border: none; border-radius: 7px; height: 28px; padding: 0 10px; font-size: 0.8rem; color: #4a5568; }
    .rp-chip:hover { background: #f0f4f9; }
    .rp-chip.activo { background: var(--navy); color: #fff; }
    .rp-sel { max-width: 200px; min-width: 0; width: auto; height: 34px; font-size: 0.84rem; padding-right: 2rem; }
    .rp-buscar { flex: 1 1 160px; }

    .rp-cab, .rp-fila { grid-template-columns: 4px minmax(240px, 2.4fr) 190px 118px minmax(170px, 1.3fr) 96px 32px; column-gap: 14px; }
    .rp-carrito { height: 32px; border-radius: 8px; padding: 0 12px; border: none; background: var(--navy); color: #fff; font-weight: 700; font-size: 0.8rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
    .rp-carrito:hover { background: #0b2c55; }
    .rp-carrito:focus-visible { outline: 2px solid var(--nav-accent); outline-offset: 2px; }
    .rp-sacar { width: 30px; height: 30px; border: 1px solid transparent; background: none; border-radius: 7px; color: #8a94a3; }
    .rp-sacar:hover { border-color: #f1b8b4; background: #fdeceb; color: #a8281e; }
    .rp-sacar:focus-visible { outline: 2px solid var(--nav-accent); outline-offset: 1px; }
    .rp-cab { text-transform: none; letter-spacing: 0; font-size: 0.76rem; font-weight: 600; color: #6b7685; }
    .rp-fila { padding: 11px 14px 11px 11px; align-items: start; }
    .rp-fila > input[type=checkbox] { margin-top: 3px; }
    .rp-desc { font-size: 0.9rem; font-weight: 600; color: #111827; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .rp-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 4px; font-size: 0.78rem; color: #6b7685; }
    .rp-marca { font-weight: 800; font-size: 0.74rem; letter-spacing: 0.4px; color: #fff; background: var(--navy); border-radius: 5px; padding: 1px 8px; }
    .rp-fab { font-family: Consolas, 'Courier New', monospace; font-weight: 700; color: #111827; font-size: 0.82rem; }
    .rp-cod { font-family: inherit; font-weight: 400; font-size: 0.76rem; color: #8a94a3; }

    .rp-sit { font-size: 0.84rem; color: #374151; line-height: 1.35; }
    .rp-sit b { color: #111827; font-variant-numeric: tabular-nums; }
    .rp-sit .rp-barra { margin: 4px 0 5px; }
    .rp-estado { display: inline-block; font-size: 0.72rem; font-weight: 700; border-radius: 5px; padding: 1px 7px; margin: 0 4px 3px 0; }
    .rp-estado.sin { background: #fdeceb; color: #a8281e; }
    .rp-estado.crit { background: #fff3d1; color: #7a5600; }
    .rp-estado.enc { background: #fff3d1; color: #7a5600; }
    .rp-ped { font-size: 0.76rem; color: #1e40af; margin-top: 2px; }
    .rp-ped a { color: inherit; text-decoration: underline; }
    .rp-cant { justify-content: flex-start; }
    .rp-falta { font-size: 0.74rem; color: #6b7685; margin-top: 4px; }
    .rp-sug { text-align: left; }
    .rp-sub { font-size: 0.95rem; color: var(--navy); }

    /* Panel derecho: sobrio, una sola accion */
    .rp-res-top { font-weight: 700; font-size: 0.98rem; }
    .rp-grupo-h .nom { font-size: 0.9rem; }
    .rp-grupo-items { display: block; }
    .rp-gi { font-size: 0.8rem; }
    .rp-gi span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .repo-total { background: #fff; color: var(--navy); border-top: 1px solid var(--border); }
    .repo-total .lbl { font-size: 0.86rem; letter-spacing: 0; opacity: 1; color: #4a5568; font-weight: 600; }
    .repo-total .monto { font-size: 1.45rem; font-weight: 800; color: var(--navy); }
    .btn-repo-confirmar { background: var(--navy); border-color: var(--navy); border-radius: 10px; font-size: 0.95rem; letter-spacing: 0; }
    .btn-repo-confirmar:hover:not(:disabled) { background: #0b2c55; border-color: #0b2c55; }

    @media (max-width: 1366px) {
      .repo-col-der { flex-basis: 310px; }
      .rp-cab, .rp-fila { grid-template-columns: 4px minmax(200px, 2fr) 160px 110px minmax(140px, 1.2fr) 90px 32px; column-gap: 10px; }
    }
    @media (max-width: 991px) {
      .repo-col-der { flex-basis: auto; }
      .rp-cab { display: none; }
      .rp-fila { grid-template-columns: 26px 1fr 1fr; row-gap: 8px; }
      .rp-fila > :nth-child(2) { grid-column: 2 / -1; }
    }
  </style>
</head>

<body data-page="pedido-nuevo">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div id="tabRepo" class="repo-body">

      <!-- Izquierda: que reponer, cuanto y a quien -->
      <div class="repo-col-izq">
        <div class="caja rp-caja">
          <div class="rp-top">
            <div>
              <div class="rp-titulo" id="repoTitulo">Reposición sugerida</div>
              <div class="rp-stats" id="repoStats">Analizando stock…</div>
            </div>
            <div style="display:flex;gap:8px;">
              <button type="button" class="rp-btn-sec" id="btnRepoTodos" title="Sumar al carrito todos los que se ven, con su cantidad"><i class="bi bi-cart-plus"></i> Sumar todos al carrito</button>
              <button type="button" class="rp-btn-sec" id="btnRepoRefrescar" title="Volver a analizar el stock"><i class="bi bi-arrow-clockwise"></i> Actualizar</button>
            </div>
          </div>
          <div class="rp-filtros">
            <div class="rp-buscar"><i class="bi bi-search"></i><input type="text" id="repoBuscar" placeholder="Buscar por descripción, marca o código" aria-label="Buscar en la reposición"></div>
            <div class="rp-chips" id="repoChips">
              <button type="button" class="rp-chip activo" data-f="">Todos</button>
              <button type="button" class="rp-chip" data-f="SIN_STOCK">Sin stock</button>
              <button type="button" class="rp-chip" data-f="ENC">Encargados</button>
              <button type="button" class="rp-chip" data-f="SIN_PROV">Sin proveedor</button>
            </div>
            <select id="repoProvFiltro" class="form-select form-select-sm rp-sel"><option value="">Todos los proveedores</option></select>
            <select id="repoOrden" class="form-select form-select-sm rp-sel">
              <option value="urg">Más urgentes primero</option>
              <option value="sub">Mayor subtotal</option>
              <option value="prov">Por proveedor</option>
            </select>
          </div>
          <div class="rp-cab">
            <span></span><span>Repuesto</span><span>Situación</span><span>Cantidad</span><span>Mejor precio</span><span></span><span></span>
          </div>
          <div class="repo-lista" id="repoLista"></div>
        </div>
      </div>

      <!-- Derecha: el carrito (el proveedor se elige alla) -->
      <div class="repo-col-der">
        <div class="caja rp-caja">
          <div class="rp-res-top" id="repoResTop">Carrito<small>Lo que vas sumando para pedir</small></div>
          <div class="repo-resumen" id="repoResumen"></div>
          <div class="repo-total">
            <span class="lbl">Total estimado</span>
            <span class="monto" id="repoTotal">$0,00</span>
          </div>
        </div>
        <div class="repo-nota" id="repoNota">En el carrito elegís el proveedor de cada uno y confirmás.</div>
        <a href="Carrito.html" class="btn-repo-confirmar" id="btnRepoConfirmar" style="text-decoration:none;">
          <i class="bi bi-cart"></i> Ir al carrito
        </a>
      </div>

    </div>


  </div>

  <script src="layout.js"></script>
<script>

  if (!Auth.requireSession()) { /* redirect */ }

  const api = API_BASE;

  const usuario = Auth.getUsuario();
  const rolesCrear = ["Administrador", "Supervisor", "Vendedor"];
  const puedeCrear = usuario && rolesCrear.indexOf(usuario.Rol) !== -1;
  if (!puedeCrear) {
    Swal.fire({ icon: "info", title: "Solo lectura", text: "Podés consultar los pedidos, pero no crear nuevos." });
  }

  /* ===================== HELPERS ===================== */
  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
  }
  // Se mantiene el nombre corto, pero el formato ahora vive en precio.js
  function fmt(n) {
    return formatearMoneda(n);
  }
  function extraerMensaje(text) {
    try { const d = JSON.parse(text); return d.Message || d.message || null; }
    catch { return text || null; }
  }

  /* ==========================================================
     REPOSICION SUGERIDA
     El calculo lo hace la base (SP_Reposicion_Sugerida): stock,
     minimo, lo que ya viene en camino y las opciones de compra.
     Aca solo se decide: cuanto, a quien, y que se incluye.
     ========================================================== */

  var repoItems = [];          // {IdRepuesto, Codigo, Descripcion, Stock, Minimo, EnCamino, Sugerido, Urgencia,
                               //  Cantidad, Incluido, IdProveedor, NombreProveedor, Precio, CondicionIva,
                               //  Alternativas:[{IdProveedor, Nombre, Precio, CondicionIva}], abierto}
  var repoProveedores = [];    // para la asignacion manual
  var repoCubiertos = 0;       // bajo minimo pero ya pedidos
  var repoFiltro = "", repoTexto = "", repoProvSel = "", repoOrden = "urg";

  function repoCargarProveedores() {
    return fetchAuth(api + "Proveedor").then(function (r) { return r.json(); })
      .then(function (d) { repoProveedores = (d || []).filter(function (p) { return p.Activo !== false && p.Activo !== 0; }); })
      .catch(function () { repoProveedores = []; });
  }

  function repoCargarFaltantes() {
    document.getElementById("repoLista").innerHTML = '<div class="rp-vacio"><span class="spinner-border spinner-border-sm"></span> Analizando stock…</div>';
    return fetchAuth(api + "Compras/Reposicion")
      .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function (d) {
        var alts = {};
        (d.Alternativas || []).forEach(function (a) {
          (alts[a.IdRepuesto] = alts[a.IdRepuesto] || []).push({
            IdProveedor: a.IdProveedor, Nombre: a.Proveedor, Precio: Number(a.Precio), CondicionIva: a.CondicionIva });
        });
        repoCubiertos = Number(d.CubiertosEnCamino || 0);
        var pedidos = {};
        (d.EnCamino || []).forEach(function (p) {
          (pedidos[p.IdRepuesto] = pedidos[p.IdRepuesto] || []).push({
            IdPedido: p.IdPedido, Proveedor: p.Proveedor, Cantidad: Number(p.Cantidad),
            EnArmado: p.EnArmado === 1 || p.EnArmado === true, LlegadaEstimada: p.LlegadaEstimada });
        });
        repoItems = (d.Items || []).map(function (r) {
          var lista = alts[r.IdRepuesto] || [];
          var mejor = lista[0] || null;
          return {
            IdRepuesto: r.IdRepuesto, Codigo: r.Codigo || "", Descripcion: r.Descripcion,
            // Si la marca no esta cargada, sale del rubro: va entre comillas (DISTRIBUCION "SKF")
            Marca: r.MarcaFabricante || ((/"([^"]+)"/.exec(r.Rubro || "") || [])[1] || "").trim(),
            CodigoFabricante: r.CodigoFabricante || "",
            Rubro: String(r.Rubro || "").replace(/\s*"[^"]*"\s*/g, " ").trim(),
            Pedidos: pedidos[r.IdRepuesto] || [],
            Stock: Number(r.Stock), Minimo: Number(r.Minimo), EnCamino: Number(r.EnCamino), Encargado: Number(r.Encargado || 0),
            Sugerido: Number(r.Sugerido), Urgencia: r.Urgencia,
            Cantidad: Number(r.Sugerido), Incluido: true,
            IdProveedor: mejor ? mejor.IdProveedor : null, NombreProveedor: mejor ? mejor.Nombre : null,
            Precio: mejor ? mejor.Precio : null, CondicionIva: mejor ? mejor.CondicionIva : null,
            Alternativas: lista, abierto: false
          };
        });
        repoLlenarFiltroProveedores();
        repoRender();
      })
      .catch(function () {
        document.getElementById("repoLista").innerHTML = '<div class="rp-vacio text-danger">No se pudo analizar el stock. ' +
          '<button class="btn btn-sm btn-outline-danger ms-2" onclick="repoCargarFaltantes()">Reintentar</button></div>';
      });
  }

  function repoLlenarFiltroProveedores() {
    var nombres = {};
    repoItems.forEach(function (it) { it.Alternativas.forEach(function (a) { nombres[a.IdProveedor] = a.Nombre; }); });
    var sel = document.getElementById("repoProvFiltro");
    sel.innerHTML = '<option value="">Todos los proveedores</option>' + Object.keys(nombres)
      .sort(function (a, b) { return String(nombres[a]).localeCompare(String(nombres[b])); })
      .map(function (id) { return '<option value="' + id + '">' + escapeHtml(nombres[id]) + '</option>'; }).join("");
  }

  /* ---------- Calculos ---------- */

  function repoMejor(it) { return it.Alternativas.length ? it.Alternativas[0] : null; }

  function repoVisibles() {
    var t = repoTexto.trim().toUpperCase();
    var lista = repoItems.map(function (it, idx) { return { it: it, idx: idx }; }).filter(function (x) {
      var it = x.it;
      if (repoFiltro === "SIN_STOCK" && it.Urgencia !== "SIN_STOCK") return false;
      if (repoFiltro === "SIN_PROV" && it.IdProveedor) return false;
      if (repoFiltro === "ENC" && !(it.Encargado > 0)) return false;
      if (repoProvSel && !it.Alternativas.some(function (a) { return String(a.IdProveedor) === repoProvSel; })) return false;
      if (t && (it.Codigo + " " + it.Descripcion + " " + it.Marca + " " + it.CodigoFabricante).toUpperCase().indexOf(t) === -1) return false;
      return true;
    });
    var urg = { SIN_STOCK: 0, CRITICO: 1, BAJO: 2 };
    lista.sort(function (a, b) {
      if (repoOrden === "sub") return (b.it.Cantidad * (b.it.Precio || 0)) - (a.it.Cantidad * (a.it.Precio || 0));
      if (repoOrden === "prov") return String(a.it.NombreProveedor || "~").localeCompare(String(b.it.NombreProveedor || "~"));
      return (urg[a.it.Urgencia] - urg[b.it.Urgencia]) || (a.it.Stock - b.it.Stock);
    });
    return lista;
  }

  /* ---------- Render de la lista ---------- */

  function repoRender() {
    var cont = document.getElementById("repoLista");
    var sinStock = repoItems.filter(function (it) { return it.Urgencia === "SIN_STOCK"; }).length;
    var sinProv = repoItems.filter(function (it) { return it.Incluido && !it.IdProveedor; }).length;
    document.getElementById("repoStats").innerHTML = repoItems.length === 0 ? "Todo el stock está sobre el mínimo." :
      '<b>' + repoItems.length + '</b> producto' + (repoItems.length === 1 ? '' : 's') + ' para reponer' +
      (sinStock ? ' · <b class="rojo">' + sinStock + ' sin stock</b>' : '') +
      (sinProv ? ' · <b>' + sinProv + ' sin proveedor</b>' : '') +
      (repoCubiertos ? ' · ' + repoCubiertos + ' más bajo el mínimo pero ya pedido' + (repoCubiertos === 1 ? '' : 's') + ' del todo (no aparece' + (repoCubiertos === 1 ? '' : 'n') + ')' : '');
    document.querySelectorAll("#repoChips .rp-chip").forEach(function (c) {
      var f = c.getAttribute("data-f");
      var n = f === "SIN_STOCK" ? sinStock : f === "SIN_PROV" ? sinProv : f === "ENC" ? repoItems.filter(function (it) { return it.Encargado > 0; }).length : repoItems.length;
      c.innerHTML = c.innerHTML.split('<span')[0] + '<span class="n">' + n + '</span>';
      c.classList.toggle("activo", f === repoFiltro);
    });

    var vis = repoVisibles();
    if (repoItems.length === 0) {
      cont.innerHTML = '<div class="rp-vacio"><i class="bi bi-check2-circle" style="font-size:1.6rem;color:#166534;"></i><div class="mt-2">No hay nada para reponer.</div></div>';
    } else if (vis.length === 0) {
      cont.innerHTML = '<div class="rp-vacio">Ningún producto coincide con el filtro.</div>';
    } else {
      cont.innerHTML = vis.map(function (x) { return repoFila(x.it, x.idx); }).join("");
    }
    repoRenderResumen();
  }

  // "Martes 16/10" a partir de una fecha de la base
  function repoFechaCorta(f) {
    if (!f) return "";
    var d = new Date(f);
    if (isNaN(d)) return "";
    return d.toLocaleDateString("es-AR", { weekday: "short", day: "2-digit", month: "2-digit" });
  }

  // Lo que ya esta pedido de este repuesto, en palabras: en que pedido y cuando llega
  function repoTextoPedidos(it) {
    if (!it.Pedidos || !it.Pedidos.length) return it.EnCamino ? it.EnCamino + ' ya pedido' + (it.EnCamino === 1 ? '' : 's') : '';
    return it.Pedidos.map(function (p) {
      return '<b>' + p.Cantidad + '</b> en pedido <a href="ListadoPedido.html" title="Ver pedidos">N° ' + p.IdPedido + '</a> a ' + escapeHtml(p.Proveedor) +
        (p.EnArmado ? ' · en armado, sin enviar' : (p.LlegadaEstimada ? ' · llega ' + repoFechaCorta(p.LlegadaEstimada) : ' · enviado'));
    }).join('<br>');
  }

  function repoFila(it, idx) {
    var pct = it.Minimo > 0 ? Math.min(100, Math.round(it.Stock / it.Minimo * 100)) : 0;
    var estado = (it.Urgencia === "SIN_STOCK" ? '<span class="rp-estado sin">Sin stock</span>'
                : it.Urgencia === "CRITICO" ? '<span class="rp-estado crit">Crítico</span>' : '') +
                (it.Encargado > 0 ? '<span class="rp-estado enc" title="Clientes que dejaron encargado este repuesto">' +
                  it.Encargado + ' encargado' + (it.Encargado === 1 ? '' : 's') + '</span>' : '');
    var mejor = repoMejor(it);
    var precio = mejor
      ? '<div class="rp-prov"><span class="nom">' + escapeHtml(mejor.Nombre) + '</span><br><span class="pre">' + formatearMoneda(mejor.Precio) + ' c/u</span>' +
        (it.Alternativas.length > 1 ? '<div class="rp-falta">' + (it.Alternativas.length - 1) + ' proveedor' + (it.Alternativas.length > 2 ? 'es' : '') + ' más</div>' : '') + '</div>'
      : '<div class="rp-sinprov"><i class="bi bi-exclamation-triangle"></i> Ningún proveedor con precio</div>';
    var cuenta = 'Querés tener ' + it.Minimo + (it.Encargado ? ' + ' + it.Encargado + ' encargado' + (it.Encargado === 1 ? '' : 's') : '') +
                 ', tenés ' + it.Stock + (it.EnCamino ? ' y ya pediste ' + it.EnCamino : '') + ': faltan ' + it.Sugerido + '.';
    var pedidos = repoTextoPedidos(it);

    return '<div class="rp-item u-' + it.Urgencia + '" id="rpItem' + idx + '">' +
      '<div class="rp-fila">' +
        '<span></span>' +
        '<div>' +
          '<div class="rp-desc" title="' + escapeHtml(it.Descripcion) + '">' + escapeHtml(it.Descripcion) + '</div>' +
          '<div class="rp-meta">' +
            (it.Marca ? '<span class="rp-marca">' + escapeHtml(it.Marca) + '</span>' : '') +
            (it.CodigoFabricante ? '<span class="rp-fab" title="Código de fábrica">' + escapeHtml(it.CodigoFabricante) + '</span>' : '') +
            (it.Codigo && it.Codigo !== it.CodigoFabricante ? '<span class="rp-cod" title="Tu código">tu cód. ' + escapeHtml(it.Codigo) + '</span>' : '') +
            (it.Rubro ? '<span>' + escapeHtml(it.Rubro) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="rp-sit" title="' + escapeHtml(cuenta) + '">' + estado +
          '<div>Tenés <b>' + it.Stock + '</b> de <b>' + it.Minimo + '</b></div>' +
          '<div class="rp-barra"><div style="width:' + pct + '%"></div></div>' +
          (pedidos ? '<div class="rp-ped">' + pedidos + '</div>' : '') +
        '</div>' +
        '<div><div class="rp-cant">' +
          '<button type="button" onclick="repoSumar(' + idx + ', -1)" aria-label="Menos">−</button>' +
          '<input type="number" min="1" value="' + it.Cantidad + '" onchange="repoCambiarCantidad(' + idx + ', this.value)" aria-label="Cantidad">' +
          '<button type="button" onclick="repoSumar(' + idx + ', 1)" aria-label="Más">+</button></div>' +
          '<div class="rp-falta">faltan ' + it.Sugerido + '</div></div>' +
        '<div>' + precio + '</div>' +
        '<div style="text-align:right;"><button type="button" class="rp-carrito" onclick="repoAlCarrito(' + idx + ')" ' +
          'title="Sumar ' + it.Cantidad + ' al carrito"><i class="bi bi-cart-plus"></i> Sumar</button></div>' +
        '<div><button type="button" class="rp-sacar" onclick="repoNoReponer(' + idx + ')" ' +
          'title="No lo quiero tener en stock: pasa a mínimo 0 y sale de la lista" aria-label="No reponer"><i class="bi bi-x-lg"></i></button></div>' +
      '</div></div>';
  }

  /* ---------- Carrito ---------- */

  function repoAlCarrito(idx, silencioso) {
    var it = repoItems[idx]; if (!it || !(it.Cantidad > 0)) return Promise.resolve(false);
    return fetchAuth(api + "Compras/Carrito", {
      method: "POST", body: JSON.stringify({ IdRepuesto: it.IdRepuesto, Cantidad: it.Cantidad, Origen: "REPOSICION" })
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { if (!silencioso) Swal.fire("No se pudo sumar", extraerMensaje(t) || "Error", "error"); return false; });
      if (!silencioso) {
        repoItems.splice(idx, 1);
        repoRender();
        Swal.fire({ toast: true, position: "bottom-end", icon: "success", title: "Sumado al carrito", showConfirmButton: false, timer: 1400 });
      }
      return true;
    });
  }

  // Todos los que se ven, uno atras de otro
  function repoTodosAlCarrito() {
    var vis = repoVisibles();
    if (!vis.length) return;
    Swal.fire({
      title: "¿Sumar " + vis.length + " repuesto" + (vis.length === 1 ? "" : "s") + " al carrito?",
      text: "Cada uno con la cantidad que tiene puesta. El proveedor se elige en el carrito.",
      showCancelButton: true, confirmButtonText: "Sumar", cancelButtonText: "Cancelar", confirmButtonColor: "#0d3b78"
    }).then(function (res) {
      if (!res.isConfirmed) return;
      var ids = vis.map(function (x) { return x.it.IdRepuesto; });
      var ok = 0;
      ids.reduce(function (p, id) {
        return p.then(function () {
          var idx = repoItems.findIndex(function (x) { return x.IdRepuesto === id; });
          return repoAlCarrito(idx, true).then(function (b) { if (b) ok++; });
        });
      }, Promise.resolve()).then(function () {
        Swal.fire({ icon: "success", title: ok + " sumado" + (ok === 1 ? "" : "s") + " al carrito", confirmButtonText: "Ir al carrito", showCancelButton: true, cancelButtonText: "Seguir acá" })
          .then(function (r) { if (r.isConfirmed) location.href = "Carrito.html"; else repoCargarFaltantes(); });
      });
    });
  }

  /* ---------- Acciones ---------- */

  // "No lo quiero en stock": minimo 0. Deja de aparecer en la reposicion
  // (salvo que tenga encargos: esos se siguen pidiendo).
  function repoNoReponer(idx) {
    var it = repoItems[idx]; if (!it) return;
    Swal.fire({
      icon: "question",
      title: "¿Sacarlo de la reposición?",
      html: '<div style="font-size:0.92rem;"><strong>' + escapeHtml(it.Marca ? it.Marca + ' ' : '') + escapeHtml(it.Descripcion) + '</strong>' +
            '<p class="mt-2 mb-0">Su stock mínimo pasa de ' + it.Minimo + ' a <strong>0</strong>: no se vuelve a sugerir. ' +
            'Si lo querés tener, cambiás el mínimo en Repuestos → Stock.' +
            (it.Encargado > 0 ? '<br><span style="color:#7a5600;">Tiene ' + it.Encargado + ' encargado(s): eso se sigue pidiendo.</span>' : '') + '</p></div>',
      showCancelButton: true, confirmButtonText: "Sacar", cancelButtonText: "Cancelar", confirmButtonColor: "#b02a37",
      preConfirm: function () {
        return fetchAuth(api + "Compras/StockMinimo", { method: "POST", body: JSON.stringify({ IdRepuesto: it.IdRepuesto, StockMinimo: 0 }) })
          .then(function (r) { if (!r.ok) return r.text().then(function (t) { throw new Error(extraerMensaje(t) || "No se pudo cambiar el mínimo."); }); })
          .catch(function (e) { Swal.showValidationMessage(e.message); return false; });
      }
    }).then(function (res) { if (res.isConfirmed) repoCargarFaltantes(); });
  }

  function repoDestacar(idx, idProv) {
    var f = document.getElementById("rpItem" + idx);
    if (f) { f.classList.add("flash"); setTimeout(function () { f.classList.remove("flash"); }, 700); }
    var g = document.getElementById("rpGrupo" + idProv);
    if (g) { g.classList.add("flash"); setTimeout(function () { g.classList.remove("flash"); }, 700); }
  }

  function repoCambiarCantidad(idx, valor) {
    var it = repoItems[idx]; if (!it) return;
    var n = parseInt(valor, 10);
    it.Cantidad = isNaN(n) || n < 0 ? 0 : Math.min(n, 9999);
    if (it.Cantidad === 0) it.Incluido = false;
    repoRender(); repoDestacar(idx, it.IdProveedor);
  }
  function repoSumar(idx, delta) { var it = repoItems[idx]; if (it) repoCambiarCantidad(idx, it.Cantidad + delta); }

  // Volver todo a la opcion mas barata

  // Asignacion manual: para repuestos sin lista de precios cargada

  /* ---------- Resumen: los pedidos que se generan ---------- */

  var repoGruposAbiertos = {};

  // Pedido en armado que ya existe para ese proveedor (si alguno de la lista esta ahi)

  function repoRenderResumen() {
    fetchAuth(api + "Compras/Carrito").then(function (r) { return r.ok ? r.json() : { Items: [], Opciones: [] }; })
      .then(function (d) {
        var items = d.Items || [], ops = {};
        (d.Opciones || []).forEach(function (o) { if (!ops[o.IdRepuesto]) ops[o.IdRepuesto] = o; });   // vienen del mas barato
        var total = 0;
        var html = items.map(function (it) {
          var o = ops[it.IdRepuesto];
          var marca = it.MarcaFabricante || ((/"([^"]+)"/.exec(it.Rubro || "") || [])[1] || "");
          if (o) total += Number(o.Precio) * it.Cantidad;
          return '<div class="rp-gi" style="padding:4px 14px;"><span title="' + escapeHtml(it.Descripcion) + '">' + it.Cantidad + ' × ' +
            (marca ? '<b>' + escapeHtml(marca) + '</b> ' : '') + escapeHtml(it.CodigoFabricante || it.Descripcion) + '</span>' +
            '<span>' + (o ? formatearMoneda(Number(o.Precio) * it.Cantidad) : '—') + '</span></div>';
        }).join("");
        document.getElementById("repoResTop").innerHTML = (items.length ? 'Carrito · ' + items.length + ' repuesto' + (items.length === 1 ? '' : 's') : 'Carrito vacío') +
          '<small>' + (items.length ? 'Con el proveedor más barato; lo cambiás en el carrito' : 'Sumá lo que haga falta con el botón Sumar') + '</small>';
        document.getElementById("repoResumen").innerHTML = html || '<div class="rp-vacio">Todavía no sumaste nada.</div>';
        document.getElementById("repoTotal").textContent = formatearMoneda(total);
      }).catch(function () { });
  }

  /* ---------- Confirmacion y generacion ---------- */

  // Todos los pedidos en un solo envio: la base los crea todos o ninguno.
  // Antes se mandaban cabecera y renglones por separado, y un corte a
  // mitad de camino dejaba pedidos incompletos.

  function initRepo() {
    document.getElementById("btnRepoTodos").addEventListener("click", repoTodosAlCarrito);
    document.getElementById("btnRepoRefrescar").addEventListener("click", repoCargarFaltantes);

    // Proveedores primero: hacen falta para resolver los nombres de las listas
    document.getElementById("repoBuscar").addEventListener("input", function (e) { repoTexto = e.target.value; repoRender(); });
    document.getElementById("repoProvFiltro").addEventListener("change", function (e) { repoProvSel = e.target.value; repoRender(); });
    document.getElementById("repoOrden").addEventListener("change", function (e) { repoOrden = e.target.value; repoRender(); });
    document.querySelectorAll("#repoChips .rp-chip").forEach(function (c) {
      c.addEventListener("click", function () { repoFiltro = c.getAttribute("data-f"); repoRender(); });
    });
    // El calculo lo hace la base; los proveedores solo hacen falta para asignar a mano
    repoCargarProveedores();
    repoCargarFaltantes();
  }

  /* ============ INICIO ============ */
  window.onload = function () {
    document.body.classList.add("repo-activo");   // alto fijo, la lista scrollea sola
    initRepo();
  };
</script>
